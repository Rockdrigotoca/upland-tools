<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rockdrigo’s Upland Tools</title>
<meta name="description" content="Free tools for Upland players by Rockdrigo: ornament optimizing, prices and more.">
<link rel="stylesheet" href="shared/theme.css">
<style>
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:8px}
.tool{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
a.tool:hover{border-color:var(--muted)}
.tool h2{margin:0;font-size:1.0625rem}
.tool p{margin:0;color:var(--muted);font-size:.875rem;flex:1}
.tool .foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.state{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--muted)}
.state.live{background:var(--accent);color:var(--accent-ink)}
.tool.soon{opacity:.75}
</style>
</head>
<body>
<div class="wrap">
  <header id="site-header" data-home="true"></header>
  <main class="tools" id="tools"></main>
  <footer id="site-footer" data-home="true"></footer>
</div>
<script src="shared/site.js"></script>
<script>
"use strict";
const {t, esc} = Site;
Site.register({
  en:{
    title:'Rockdrigo’s Upland Tools', subtitle:'Free tools for Upland players. Your data stays in your browser.',
    live:'Live', soon:'Coming soon', open:'Open →',
    optimizerName:'Rockdrigo’s Ornament Optimizer', optimizerDesc:'Type a username and get one ornament per season on every structure: what to apply today, which ornaments to move (with one-click links), and what is missing.',
    grabberName:'Rockdrigo’s Freeloader', grabberDesc:'Which collection each property should sit in for the most monthly yield, which properties to borrow from (or lend to) friends to unlock more bonuses, and the cheapest properties for sale to finish the rest.',
    horoscopeName:'Rockdrigo’s Property Horoscope', horoscopeDesc:'Your property’s fortune for the week, read from its street number and the alignment of nearby Uppies. Scientifically unproven. Legally distinct from advice.',
    pricesName:'Rockdrigo’s Cheapskate', pricesDesc:'Ornament prices: what they actually sell for in UPX, what they are listed at in UPX and USD, which showroom has them, and what your own ornaments are worth.'
  },
  es:{
    title:'Herramientas de Upland de Rockdrigo', subtitle:'Herramientas gratis para jugadores de Upland. Tus datos se quedan en tu navegador.',
    live:'Disponible', soon:'Próximamente', open:'Abrir →',
    optimizerName:'Optimizador de Ornamentos de Rockdrigo', optimizerDesc:'Escribe un usuario y ten un ornamento por temporada en cada estructura: qué aplicar hoy, qué mover (con enlaces directos) y qué falta.',
    grabberName:'El Gorrón de Rockdrigo', grabberDesc:'En qué colección debe ir cada propiedad para el mayor rendimiento mensual, qué propiedades pedir prestadas (o prestar) a tus amigos para desbloquear más bonos, y las propiedades en venta más baratas para terminar el resto.',
    horoscopeName:'El Horóscopo Inmobiliario de Rockdrigo', horoscopeDesc:'La suerte de tu propiedad esta semana, leída en su número de calle y la alineación de los Uppies cercanos. Sin respaldo científico. Legalmente no es un consejo.',
    pricesName:'El Codo de Rockdrigo', pricesDesc:'Precios de ornamentos: en cuánto se venden de verdad en UPX, a cuánto están listados en UPX y USD, en qué showroom están y cuánto valen los tuyos.'
  },
  en_cunk:{
    subtitle:'Tools for Upland, a game about owning pretend land, which is the best kind of land.',
    live:'Exists', soon:'Not yet. Soon. Possibly.', open:'Go in →',
    optimizerName:'Rockdrigo’s Ornament Optimizer: A History of Putting Things on Houses', optimizerDesc:'Since the dawn of time, people have put things on houses. This tells you which things, which houses, and when.',
    grabberName:'Rockdrigo’s Freeloader: A History of Borrowing Things', grabberDesc:'People have always borrowed things from friends and been vague about giving them back. This makes it profitable.',
    horoscopeName:'Rockdrigo’s Property Horoscope: The Stars, But for Land', horoscopeDesc:'Astrology has never been applied to real estate. There may be a reason. We intend to find out.',
    pricesName:'Rockdrigo’s Cheapskate: A History of Paying Less', pricesDesc:'Find out what things are worth, a question that has troubled economists since money.'
  },
  es_cunk:{
    subtitle:'Herramientas para Upland, un juego de tener terrenos de mentira, que son los mejores terrenos.',
    live:'Existe', soon:'Todavía no. Pronto. Quizá.', open:'Entrar →',
    optimizerName:'El Optimizador de Ornamentos de Rockdrigo: una historia de ponerle cosas a las casas', optimizerDesc:'Desde el principio de los tiempos, la gente le ha puesto cosas a las casas. Esto te dice qué cosas, a qué casas y cuándo.',
    grabberName:'El Gorrón de Rockdrigo: una historia de pedir prestado', grabberDesc:'La gente siempre le ha pedido cosas prestadas a sus amigos y ha sido vaga para devolverlas. Esto lo vuelve rentable.',
    horoscopeName:'El Horóscopo Inmobiliario de Rockdrigo: los astros, pero para terrenos', horoscopeDesc:'Nunca se ha aplicado la astrología a los bienes raíces. Quizá haya una razón. Pensamos averiguarlo.',
    pricesName:'El Codo de Rockdrigo: una historia de pagar menos', pricesDesc:'Averigua cuánto valen las cosas, una pregunta que inquieta a los economistas desde que existe el dinero.'
  }
});

const TOOLS = [
  {key:'optimizer', href:'ornament-optimizer/', live:true},
  {key:'prices', href:'cheapskate/', live:true},
  {key:'grabber', href:'freeloader/', live:true},
  {key:'horoscope', href:null, live:false}
];
function render(){
  document.getElementById('tools').innerHTML = TOOLS.map(x => {
    const inner = `<h2>${esc(t(x.key + 'Name'))}</h2><p>${esc(t(x.key + 'Desc'))}</p>
      <div class="foot"><span class="state${x.live ? ' live' : ''}">${esc(t(x.live ? 'live' : 'soon'))}</span>${x.live ? `<span class="small">${esc(t('open'))}</span>` : ''}</div>`;
    return x.live ? `<a class="card tool" href="${x.href}">${inner}</a>` : `<div class="card tool soon">${inner}</div>`;
  }).join('');
}
Site.mount({onChange: render});
</script>
</body>
</html>
