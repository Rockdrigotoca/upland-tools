<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ornament Season Planner</title>
<meta name="description" content="Plan Upland structure ornaments for every season: what to apply now, which ornaments to move, and what is missing.">
<link rel="stylesheet" href="../shared/theme.css">
<style>
.cell{width:calc(22px * var(--text-scale,1));height:calc(22px * var(--text-scale,1))}
.thumb{width:calc(44px * var(--text-scale,1));height:calc(44px * var(--text-scale,1))}
.item{grid-template-columns:calc(44px * var(--text-scale,1)) 1fr auto}
@media (max-width:560px){.item{grid-template-columns:calc(36px * var(--text-scale,1)) 1fr}.thumb{width:calc(36px * var(--text-scale,1));height:calc(36px * var(--text-scale,1))}}
</style>
</head>
<body>
<div class="wrap">
  <header id="site-header"></header>

  <section class="card" id="loader">
    <form class="row" id="userForm">
      <input type="text" id="username" data-i-ph="userPh" class="grow" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn primary" id="loadBtn" type="submit" data-i="load"></button>
      <button class="btn hidden" id="refreshBtn" type="button" data-i="refresh"></button>
    </form>
    <div class="status" id="status"></div>
    <details class="csv">
      <summary data-i="csvSummary"></summary>
      <p class="note" data-i="csvNote"></p>
      <div class="files">
        <label><span data-i="csvOrn"></span><input type="file" id="fOrn" accept=".csv"></label>
        <label><span data-i="csvStruct"></span><input type="file" id="fStr" accept=".csv"></label>
        <label><span data-i="csvProps"></span><input type="file" id="fProp" accept=".xlsx,.xls,.csv"></label>
      </div>
      <div class="row" style="margin-top:10px"><button class="btn" id="csvBtn" type="button" data-i="csvLoad"></button></div>
    </details>
  </section>

  <main id="app" class="hidden">
    <div class="kpis" id="kpis"></div>
    <div class="seasons" id="seasonCards"></div>
    <nav class="tabs" id="tabs"></nav>
    <section id="panel"></section>
  </main>

  <footer id="site-footer"></footer>
</div>

const $ = s => document.querySelector(s);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ return d.toLocaleDateString(Site.locale(), {month:'short', day:'numeric'}); }
function pill(season){ const s = SEASONS.includes(season) ? season : 'Unknown'; return `<span class="pill" style="--c:var(--${s})">${esc(season || '?')}</span>`; }
function thumb(o){ return o.img ? `<img class="thumb" loading="lazy" alt="" src="${esc(IMG + encodeURI(o.img))}">` : `<div class="thumb ph">◆</div>`; }
const groupBy = (arr, f) => arr.reduce((m, x) => { const k = f(x); (m.get(k) || m.set(k, []).get(k)).push(x); return m; }, new Map());

// ---------- seasons ----------
function today(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function seasonInfo(now = today()){
  const y = now.getFullYear(), ranges = [];
  for(const s of SEASONS){
    const [m1,d1,m2,d2] = SEASON_DATES[s];
    for(const yy of [y-1, y, y+1]) ranges.push({s, start:new Date(yy, m1-1, d1), end:new Date(m2 < m1 ? yy+1 : yy, m2-1, d2)});
  }
  const act = ranges.find(r => now >= r.start && now <= r.end);
  const next = ranges.filter(r => r.start > now).sort((a,b) => a.start - b.start)[0];
  return {active: act ? act.s : null, end: act && act.end, next: next.s, nextStart: next.start, target: act ? act.s : next.s, now};
}
const days = (a, b) => Math.round((b - a) / 864e5);

function seasonFromName(name, rarity){
  const n = (name || '').toLowerCase();
  if(CATALOG.byName[name]) return CATALOG.byName[name];
  for(const s of SEASONS) if(n.includes(s.toLowerCase())) return s;
  if(/sakura|hanami|cherry/.test(n)) return 'Blossom';
  if(/christmas|santa|gingerbread|winter|snow|present/.test(n)) return 'Wonderland';
  if(/halloween|lantern|zombie|skelly|creepy|spooky/.test(n)) return 'Harvest';
  const r = (rarity || '').toLowerCase();
  if(r === 'uncanny') return 'Harvest';
  if(r.includes('winter')) return 'Wonderland';
  return null;
}

function structType(name, img){
  if(name === 'Small Town House' && /small_town_house_new2/.test(img || '')) return 'Small Town House v2';
  return name;
}

// ---------- live loading ----------
async function loadLive(user){
  setStatus(t('fetchOrn'));
  const rawOrn = await getJSON(`${API}/nft/assets/v2/decorations/${encodeURIComponent(user)}`);
  setStatus(t('fetchStr'));
  const rawStr = await getJSON(`${API}/nft/assets/structures/${encodeURIComponent(user)}`);

  const props = new Map();
  const structures = rawStr.map(s => {
    props.set(s.prop_id, {id:s.prop_id, address:s.address, city:s.city && s.city.name});
    return {id:'s'+s.dgoodId, propId:s.prop_id, type:structType(s.constructionName, s.buildingImage), address:s.address, city:s.city && s.city.name};
  });

  const ornaments = (Array.isArray(rawOrn) ? rawOrn : []).filter(o => o.category === 'structornmt').map(o => {
    const m = o.metadata || {}, p = m.property || {};
    return {id:o.dgoodId, mint:o.serialNumber, name:m.displayName, designId:m.decorationId, type:m.subtitle, applied:!!m.isApplied,
      propId:p.id, address:p.fullAddress, city:p.cityName, img:m.image, rarity:m.rarityLevel, season:null};
  });

  // Properties holding ornaments but missing from the structure list: read their buildings directly.
  const known = new Set(structures.map(s => s.propId));
  const missing = [...new Set(ornaments.map(o => o.propId).filter(id => id && !known.has(id)))];
  if(missing.length){
    setStatus(t('fetchProps', {n:missing.length}));
    const res = await pool(missing, 4, id => getJSON(`${API}/api/properties/${id}`));
    const seen = new Set(structures.map(s => s.id));
    res.forEach(p => {
      if(!p) return;
      props.set(p.prop_id, {id:p.prop_id, address:p.full_address, city:p.city && p.city.name});
      if((p.owner_username || '').toLowerCase() !== user.toLowerCase()) return;
      for(const b of (p.buildings || [])){
        if(b.constructionStatus !== 'completed' || seen.has('s'+b.nftID)) continue;
        seen.add('s'+b.nftID);
        structures.push({id:'s'+b.nftID, propId:p.prop_id, type:structType(b.buildingName, b.buildingImage), address:p.full_address, city:p.city && p.city.name, inferred:true});
      }
    });
  }
  // City names: prefer the game's map city from structures/properties over the ornament's neighborhood city.
  for(const o of ornaments){ const p = props.get(o.propId); if(p && p.city) o.city = p.city; }

  // Seasons: built-in catalog → saved cache → ask Upland → guess from name.
  const cache = store.get('uop:seasons', {});
  const unknownIds = [...new Set(ornaments.map(o => o.designId))].filter(id => !CATALOG.byId[id] && !cache[id]);
  if(unknownIds.length){
    setStatus(t('fetchSeasons', {n:unknownIds.length}));
    const res = await pool(unknownIds, 4, id => getJSON(`${API}/business/decorations/${id}/preview`));
    res.forEach((r, i) => { if(r && SEASONS.includes(r.seasonName)) cache[unknownIds[i]] = r.seasonName; });
    store.set('uop:seasons', cache);
  }
  for(const o of ornaments) o.season = CATALOG.byId[o.designId] || cache[o.designId] || seasonFromName(o.name, o.rarity);

  return {user, live:true, ornaments, structures};
}

// ---------- CSV / XLSX loading ----------
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cur = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if(c === '"') q = true;
    else if(c === ','){ row.push(cur); cur = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
  const head = rows.shift() || [];
  return rows.filter(r => r.some(v => v !== '')).map(r => Object.fromEntries(head.map((h, i) => [h.trim(), (r[i] ?? '').trim()])));
}
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function readTable(file){
  if(/\.xlsx?$/i.test(file.name)){
    if(!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:'', raw:false});
  }
  return parseCSV(await file.text());
}
async function loadFiles(){
  const fo = $('#fOrn').files[0], fs = $('#fStr').files[0], fp = $('#fProp').files[0];
  if(!fo || !fs) throw new Error(t('csvNeed'));
  const [ro, rs, rp] = await Promise.all([readTable(fo), readTable(fs), fp ? readTable(fp) : []]);
  const key = a => String(a || '').toUpperCase().replace(/\s+/g, ' ').trim();
  const propByAddr = new Map(), v2 = new Set(), propStructs = new Map();
  for(const p of rp){
    const a = key(p['Address']); if(!a) continue;
    if(!propByAddr.has(a)) propByAddr.set(a, String(p['Property ID'] || '').trim() || 'addr:' + a);
    const s = String(p['Structures'] || '').trim();
    if(s === 'Small Town House 1') v2.add(a);
    if(s) propStructs.set(a, s === 'Small Town House 1' ? 'Small Town House v2' : s);
  }
  const pid = a => propByAddr.get(key(a)) || 'addr:' + key(a);
  let n = 0;
  const structures = rs.map(s => {
    let type = s['Construction Name'];
    if(type === 'Small Town House' && v2.has(key(s['Address']))) type = 'Small Town House v2';
    return {id:'c' + (n++), propId:pid(s['Address']), type, address:s['Address'], city:s['City']};
  });
  const ornaments = ro.map(o => ({
    id:'csv:' + o['Name'] + '#' + o['Mint'] + '@' + key(o['Address']), mint:Number(o['Mint']) || 0, name:o['Name'], designId:o['Name'], type:o['Sub Name'],
    applied:String(o['Is Applied']).toLowerCase() === 'true', propId:pid(o['Address']), address:o['Address'], city:o['City'], img:null,
    rarity:o['Rarity'], season:seasonFromName(o['Name'], o['Rarity'])
  }));
  // Structures the export leaves out but the properties file lists, or an applied ornament proves.
  const have = new Set(structures.map(s => s.propId + '|' + s.type));
  for(const [a, type] of propStructs){
    const id = pid(a);
    if(ORN_TYPES.includes(type) && !have.has(id + '|' + type) && ornaments.some(o => o.propId === id)){
      have.add(id + '|' + type);
      const o = ornaments.find(o => o.propId === id);
      structures.push({id:'c' + (n++), propId:id, type, address:o.address, city:o.city, inferred:true});
    }
  }
  for(const o of ornaments){
    if(o.applied && !have.has(o.propId + '|' + o.type)){
      have.add(o.propId + '|' + o.type);
      structures.push({id:'c' + (n++), propId:o.propId, type:o.type, address:o.address, city:o.city, inferred:true});
    }
  }
  const cityByProp = new Map(structures.map(s => [s.propId, s.city]));
  for(const o of ornaments) if(cityByProp.get(o.propId)) o.city = cityByProp.get(o.propId);
  return {user:t('csvMode'), live:false, ornaments, structures};
}

// ---------- planner ----------
function buildPlan(D){
  const supported = new Set([...ORN_TYPES, ...D.ornaments.map(o => o.type)]);
  const structs = D.structures.filter(s => supported.has(s.type))
    .sort((a,b) => (a.city || '').localeCompare(b.city || '') || (a.address || '').localeCompare(b.address || ''));
  const hasStructAt = new Set(structs.map(s => s.propId + '|' + s.type));
  const typesOwned = new Set(structs.map(s => s.type));
  const slot = new Map();   // structId|season -> ornament
  const used = new Set();

  const buckets = groupBy(D.ornaments.filter(o => SEASONS.includes(o.season)), o => o.season + '|' + o.type);
  for(const [k, orns] of buckets){
    const [season, type] = [k.slice(0, k.indexOf('|')), k.slice(k.indexOf('|') + 1)];
    const ss = structs.filter(s => s.type === type);
    if(!ss.length) continue;
    // 1) Use ornaments already on the structure's own property (applied first).
    const byProp = groupBy([...orns].sort((a,b) => (b.applied - a.applied) || (a.mint - b.mint)), o => o.propId);
    const need = [];
    for(const s of ss){
      const o = (byProp.get(s.propId) || []).find(o => !used.has(o.id));
      if(o){ slot.set(s.id + '|' + season, o); used.add(o.id); } else need.push(s);
    }
    // 2) Fill the rest from spare ornaments, taking from storage before properties that use that type.
    const spare = orns.filter(o => !used.has(o.id))
      .sort((a,b) => (hasStructAt.has(a.propId + '|' + type) - hasStructAt.has(b.propId + '|' + type)) || (a.mint - b.mint));
    need.forEach((s, i) => { const o = spare[i]; if(o){ slot.set(s.id + '|' + season, o); used.add(o.id); } });
  }

  // Which ornament is applied on which structure (properties can hold several structures of a type).
  const appliedBy = groupBy(D.ornaments.filter(o => o.applied), o => o.propId + '|' + o.type);
  const appliedTaken = new Map();
  const rows = structs.map(s => {
    const k = s.propId + '|' + s.type, list = appliedBy.get(k) || [], i = appliedTaken.get(k) || 0;
    appliedTaken.set(k, i + 1);
    const cells = {};
    for(const season of SEASONS){
      const o = slot.get(s.id + '|' + season);
      cells[season] = !o ? {state:'no'} : {state: o.propId === s.propId ? 'in' : 'mv', o};
    }
    return {s, cells, applied: list[i] || null};
  });

  const moves = [];
  for(const r of rows) for(const season of SEASONS){ const c = r.cells[season]; if(c.state === 'mv') moves.push({o:c.o, to:r.s, season}); }

  const extras = D.ornaments.filter(o => !used.has(o.id)).map(o => ({o,
    reason: !SEASONS.includes(o.season) ? 'unknown' : (typesOwned.has(o.type) ? 'surplus' : 'noStruct')}));

  const total = rows.length * SEASONS.length;
  const per = {};
  for(const season of SEASONS){
    let a = 0, b = 0;
    for(const r of rows){ const st = r.cells[season].state; if(st === 'in') a++; else if(st === 'mv') b++; }
    per[season] = {inPlace:a, move:b, missing:rows.length - a - b};
  }
  const inPlace = SEASONS.reduce((x, s) => x + per[s].inPlace, 0);
  const after = inPlace + moves.length;

  // Shortage matrix by type × season
  const types = [...new Set(rows.map(r => r.s.type))].sort((a,b) => ORN_TYPES.indexOf(a) - ORN_TYPES.indexOf(b));
  const owned = groupBy(D.ornaments.filter(o => SEASONS.includes(o.season)), o => o.season + '|' + o.type);
  const matrix = types.map(type => {
    const n = rows.filter(r => r.s.type === type).length;
    return {type, n, cells: SEASONS.map(season => ({season, have:(owned.get(season + '|' + type) || []).length, need:n}))};
  });

  // Build ideas: types where spare ornaments cover several seasons
  const spareByType = groupBy(extras.filter(e => e.reason !== 'unknown').map(e => e.o), o => o.type);
  const build = [...spareByType].map(([type, os]) => ({type, n:os.length, k:new Set(os.map(o => o.season)).size}))
    .filter(b => b.k >= 2).sort((a,b) => b.k - a.k || b.n - a.n);

  return {rows, moves, extras, per, total, inPlace, after, matrix, build, hasStructAt};
}

function renderNow(){
  const si = seasonInfo(), S = ui.nowSeason || si.target;
  let banner;
  if(si.active) banner = `<b>${esc(t('active', {s:si.active}))}</b> — ${esc(t('endsIn', {d:fmtDate(si.end), n:days(si.now, si.end)}))}`;
  else banner = `<b>${esc(t('windowNow'))}</b> — ${esc(t('startsIn', {s:si.next, d:fmtDate(si.nextStart), n:days(si.now, si.nextStart)}))}`;
  const groups = {done:[], apply:[], move:[], missing:[]};
  for(const r of PLAN.rows){
    const c = r.cells[S];
    if(r.applied && r.applied.season === S) groups.done.push(r);
    else if(c.state === 'in') groups.apply.push(r);
    else if(c.state === 'mv') groups.move.push(r);
    else groups.missing.push(r);
  }
  const line = r => {
    const c = r.cells[S], o = c.o;
    const cur = r.applied ? t('nowApplied', {x:`${r.applied.name} (${r.applied.season || '?'})`}) : t('nowNothing');
    const where = `<b>${esc(r.s.address)}</b>, ${esc(r.s.city || '')} · ${esc(r.s.type)}${r.s.inferred ? ' ' + esc(t('inferred')) : ''}`;
    let act = '', title = o ? `${esc(o.name)} <span class="muted">#${esc(o.mint)}</span>` : `<span class="muted">${esc(t('stMissing'))}</span>`;
    if(o && c.state === 'in' && !(r.applied && r.applied.season === S)) act = actBtn(o, r.s, t('apply'), true);

    <div class="row small muted" style="margin-bottom:6px">${esc(t('pickSeason'))}</div>${seasonChips(S)}`;
  const todo = groups.apply.length + groups.move.length;
  if(!todo && !groups.missing.length) html += `<div class="card empty">${esc(t('allDone', {s:S}))}</div>`;
  html += sect('apply', t('stApply'), groups.apply) + sect('move', t('stMove'), groups.move) + sect('missing', t('stMissing'), groups.missing);
  if(groups.done.length){
    html += ui.showDone ? sect('done', t('stDone'), groups.done)
      : `<div style="margin-top:14px"><button class="btn small wrap" id="showDone">${esc(t('showDone', {n:groups.done.length}))}</button></div>`;
  }
  $('#panel').innerHTML = html;
}

function renderPlan(){
  const P = PLAN, S = ui.planSeason;
  const list = P.moves.filter(m => S === 'all' || m.season === S);
  let html = `<p class="note">${esc(t('planNote'))}</p>${seasonChips(S, true)}`;
  if(!list.length) html += `<div class="card empty">${esc(t('noMoves'))}</div>`;
  for(const season of SEASONS){
    const ms = list.filter(m => m.season === season);
    if(!ms.length) continue;
    html += `<div class="group-h"><h3>${pill(season)} </h3><span class="muted small">${ms.length}</span></div><div class="list">` + ms.map(m => {
      const op = opened.has(String(m.o.id)) ? ' opened' : '';
      return `<div class="item${op}">${thumb(m.o)}<div><div class="t">${esc(m.o.name)} <span class="muted">#${esc(m.o.mint)}</span></div>
        <div class="s">${esc(t('from'))} ${esc(m.o.address)}, ${esc(m.o.city || '')} → ${esc(t('to'))} <b>${esc(m.to.address)}</b>, ${esc(m.to.city || '')} · ${esc(m.to.type)}</div></div>
        ${actBtn(m.o, m.to, DATA.live ? t('moveApply') : t('open'), true)}</div>`;
    }).join('') + `</div>`;
  }
  $('#panel').innerHTML = html;
}

function renderStructs(){
  const q = ui.q.trim().toLowerCase();
  const rows = PLAN.rows.filter(r => {
    if(ui.onlyGaps && SEASONS.every(s => r.cells[s].state === 'in')) return false;
    if(!q) return true;
    const hay = [r.s.address, r.s.city, r.s.type, ...SEASONS.map(s => r.cells[s].o && r.cells[s].o.name)].join(' ').toLowerCase();
    return hay.includes(q);
  });
  const cell = (r, s) => {
    const c = r.cells[s], o = c.o;
    const app = r.applied && o && r.applied.id === o.id ? ' app' : '';
    const tip = o ? `${o.name} #${o.mint}${c.state === 'mv' ? ` — ${t('from')} ${o.address}` : ''}` : t('lgNo');
    const sym = c.state === 'in' ? '✓' : c.state === 'mv' ? '→' : '·';
    return `<td class="c"><span class="cell ${c.state}${app}" style="--c:var(--${s})" title="${esc(tip)}">${sym}</span></td>`;
  };
  $('#panel').innerHTML = `<div class="row" style="margin-bottom:8px">
      <input type="search" id="q" class="grow" placeholder="${esc(t('search'))}" value="${esc(ui.q)}">
      <label class="small row" style="gap:6px"><input type="checkbox" id="onlyGaps" ${ui.onlyGaps ? 'checked' : ''}>${esc(t('onlyIncomplete'))}</label></div>
    <div class="legend">
      <span><span class="cell in" style="--c:var(--accent)">✓</span>${esc(t('lgIn'))}</span>
      <span><span class="cell in app" style="--c:var(--accent)">✓</span>${esc(t('lgApp'))}</span>
      <span><span class="cell mv" style="--c:var(--accent)">→</span>${esc(t('lgMv'))}</span>
      <span><span class="cell no">·</span>${esc(t('lgNo'))}</span></div>
    <div class="tablewrap"><table><thead><tr><th>${esc(t('colAddress'))}</th><th>${esc(t('colCity'))}</th><th>${esc(t('colType'))}</th>${SEASONS.map(s => `<th class="c">${pill(s)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr><td>${esc(r.s.address)}</td><td>${esc(r.s.city || '')}</td><td>${esc(r.s.type)}</td>${SEASONS.map(s => cell(r, s)).join('')}</tr>`).join('') || `<tr><td colspan="9" class="empty">–</td></tr>`}</tbody></table></div>`;
}

function renderGaps(){
  const P = PLAN;
  let totalShort = 0;
  const body = P.matrix.map(m => `<tr><td>${esc(m.type)}</td><td class="num">${m.n}</td>${m.cells.map(c => {
      const short = Math.max(0, c.need - c.have); totalShort += short;
      return `<td class="num ${short ? 'short' : 'okc'}" title="${short ? '-' + short : ''}">${c.have}/${c.need}${short ? ` <small>(−${short})</small>` : ''}</td>`;
    }).join('')}</tr>`).join('');
  const ex = groupBy(P.extras, e => e.o.name + '|' + e.reason);
  const exRows = [...ex.values()].sort((a,b) => b.length - a.length).map(g => {
    const o = g[0].o;
    const reason = {noStruct:t('reasonNoStruct'), surplus:t('reasonSurplus'), unknown:t('reasonUnknown')}[g[0].reason];
    const mints = g.map(e => '#' + e.o.mint).slice(0, 12).join(' ') + (g.length > 12 ? ' …' : '');
    return `<div class="item">${thumb(o)}<div><div class="t">${esc(t('count', {n:g.length}))} ${esc(o.name)}</div>
      <div class="s">${pill(o.season)} · ${esc(o.type)} · ${esc(reason)}</div><div class="s">${esc(mints)}</div></div><span></span></div>`;
  }).join('');
  const build = P.build.map(b => `<li>${esc(t('buildRow', {t:b.type, k:b.k, n:b.n}))}</li>`).join('');
  $('#panel').innerHTML = `<h2>${esc(t('shortTitle'))}</h2><p class="note">${esc(t('shortNote'))}</p>
    <div class="tablewrap"><table><thead><tr><th>${esc(t('colType'))}</th><th class="num">#</th>${SEASONS.map(s => `<th class="num">${pill(s)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
    <p class="small" style="margin-top:8px">${esc(t('totalShort'))}: <span class="${totalShort ? 'short' : 'okc'}">${totalShort}</span></p>
    ${build ? `<h3>${esc(t('buildTitle'))}</h3><p class="note">${esc(t('buildNote'))}</p><ul class="small">${build}</ul>` : ''}
    <h3>${esc(t('extrasTitle'))} <span class="muted small">${P.extras.length}</span></h3><p class="note">${esc(t('extrasNote'))}</p>
    <div class="list">${exRows || `<div class="card empty">–</div>`}</div>`;
}

function renderStorage(){
  const P = PLAN;
  const dest = new Map(P.moves.map(m => [m.o.id, m]));
  const stuck = DATA.ornaments.filter(o => !P.hasStructAt.has(o.propId + '|' + o.type));
  const byProp = [...groupBy(stuck, o => o.propId)].sort((a,b) => b[1].length - a[1].length);
  const structsAt = groupBy(DATA.structures, s => s.propId);
  $('#panel').innerHTML = `<p class="note">${esc(t('storageNote'))}</p>` + (byProp.map(([pid, os]) => {
    const o0 = os[0], here = [...new Set((structsAt.get(pid) || []).map(s => s.type))].join(', ') || t('none');
    const items = os.sort((a,b) => (dest.has(b.id) - dest.has(a.id)) || a.name.localeCompare(b.name)).map(o => {
      const m = dest.get(o.id), op = opened.has(String(o.id)) ? ' opened' : '';
      return `<div class="item${op}">${thumb(o)}<div><div class="t">${esc(o.name)} <span class="muted">#${esc(o.mint)}</span> ${pill(o.season)}</div>
        <div class="s">${m ? `${esc(t('goesTo'))} <b>${esc(m.to.address)}</b>, ${esc(m.to.city || '')}` : esc(t('isExtra'))} · ${esc(o.type)}</div></div>
        ${m ? actBtn(o, m.to, DATA.live ? t('moveApply') : t('open'), true) : '<span></span>'}</div>`;
    }).join('');
    return `<div class="prop"><div class="head"><h3 style="margin:0">${esc(o0.address)}, ${esc(o0.city || '')}</h3>
      <span class="badge">${esc(t('structsHere', {x:here}))} · ${os.length}</span></div><div class="list">${items}</div></div>`;
  }).join('') || `<div class="card empty">–</div>`);
}

// ---------- wiring ----------
function show(D){
  DATA = D; PLAN = buildPlan(D);
  const key = 'uop:last:' + (D.live ? D.user.toLowerCase() : 'csv');
  const last = store.get(key, null);
  store.set(key, {after:PLAN.inPlace});
  const at = new Date(), gained = last && PLAN.inPlace > last.after ? PLAN.inPlace - last.after : 0;
  setStatus(() => {
    const time = at.toLocaleTimeString(Site.locale(), {hour:'2-digit', minute:'2-digit'});
    return t(D.live ? 'loaded' : 'loadedFiles', {o:D.ornaments.length, s:PLAN.rows.length, u:D.user, t:time}) + (gained ? ' ' + t('since', {d:gained}) : '');
  });
  $('#app').classList.remove('hidden');
  $('#refreshBtn').classList.toggle('hidden', !D.live);
  render();
}

async function runLive(){
  const user = $('#username').value.trim();
  if(!user) return;
  store.set('uop:user', user);
  $('#loadBtn').disabled = $('#refreshBtn').disabled = true;
  try{
    const D = await loadLive(user);
    if(!D.ornaments.length && !D.structures.length) throw Object.assign(new Error('empty'), {status:404});
    show(D);
  }catch(e){
    setStatus(e.status === 404 || e.status === 400 ? t('errUser', {u:user}) : t('errNet', {e:e.message}), true);
  }finally{ $('#loadBtn').disabled = $('#refreshBtn').disabled = false; }
}

$('#userForm').addEventListener('submit', e => { e.preventDefault(); runLive(); });
$('#refreshBtn').addEventListener('click', () => { opened.clear(); store.set('uop:opened', []); runLive(); });
$('#csvBtn').addEventListener('click', async () => {
  try{ setStatus(t('loading')); show(await loadFiles()); }catch(e){ setStatus(e.message, true); }
});
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; ui.tab = b.dataset.tab; store.set('uop:tab', ui.tab); render(); });
$('#panel').addEventListener('click', e => {
  const chip = e.target.closest('[data-season]');
  if(chip){ if(ui.tab === 'now'){ ui.nowSeason = chip.dataset.season; ui.showDone = false; } else ui.planSeason = chip.dataset.season; render(); return; }
  if(e.target.id === 'showDone'){ ui.showDone = true; render(); return; }
  const cp = e.target.closest('button[data-copy]');
  if(cp){ copyText(cp.dataset.copy).then(ok => { if(!ok){ window.prompt(t('copy'), cp.dataset.copy); return; } cp.textContent = t('copied'); setTimeout(() => { cp.textContent = t('copy'); }, 1600); });
    opened.add(cp.dataset.oid); store.set('uop:opened', [...opened]); cp.closest('.item') && cp.closest('.item').classList.add('opened'); return; }
  const a = e.target.closest('a[data-open]');
  if(a){ opened.add(a.dataset.open); store.set('uop:opened', [...opened]); a.closest('.item') && a.closest('.item').classList.add('opened'); }
});
$('#panel').addEventListener('input', e => {
  if(e.target.id === 'q'){ ui.q = e.target.value; const pos = e.target.selectionStart; renderStructs(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
});
$('#panel').addEventListener('change', e => { if(e.target.id === 'onlyGaps'){ ui.onlyGaps = e.target.checked; renderStructs(); } });

Site.mount({onChange: onSiteChange});
const params = new URLSearchParams(location.search);
const startUser = params.get('user') || store.get('uop:user', '');
if(startUser){ $('#username').value = startUser; if(params.get('user')) runLive(); }
</script>
</body>
</html>
