<!doctype html>

<meta charset="utf-8">

<title>Rockdrigo’s Troves</title>
<meta name="description" content="Upland troves: what to find first, what you can craft right now, and what to bank without running out of what you need. Load your own troves file; it never leaves your browser.">
<link rel="stylesheet" href="../shared/theme.css">
<style>
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.875rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:.75rem;color:var(--muted);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:.6875rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.good{background:var(--accent);color:var(--accent-ink)}
.tag.warn{background:var(--warn);color:#fff}
.tag.bad{background:var(--bad);color:#fff}
.boxtabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px;margin:0 0 14px}
.boxtab{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;min-width:0}
.boxtab:hover{border-color:var(--muted)}
.boxtab .ic{font-size:1.15rem;line-height:1}
.boxtab .nm{font-weight:700;font-size:.9375rem;overflow-wrap:anywhere}
.boxtab .ct{font-size:.75rem;color:var(--muted);min-height:1em}
.boxtab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.boxtab.on .ct{color:inherit;opacity:.85}
.src{display:grid;gap:10px}
.src .row{align-items:flex-end}
.drop{border:2px dashed var(--border);border-radius:10px;padding:12px 14px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--text)}
.places{font-size:.8125rem;color:var(--muted);overflow-wrap:anywhere}
.sec{margin:18px 0 6px}
.sec p{margin:0 0 8px;color:var(--muted);font-size:.8125rem}
details.more summary{cursor:pointer;color:var(--accent);font-size:.8125rem}
.hint{font-size:.8125rem;color:var(--muted)}
.howto{margin-top:14px;font-size:.8125rem}
</style>

const FORMAT = 'upland-troves-v1';
// Same patterns as the cleaning script: a login token anywhere in the text means the file is declined.
const TOKEN = /eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{5,}|[Bb]earer\s+[A-Za-z0-9._~+\/=-]{20,}|"(?:access_?token|refresh_?token|id_?token|authorization|cookie|set-cookie|secret|password)"\s*:\s*"[^"]{12,}"/i;
const MAX_BYTES = 5 * 1024 * 1024, MAX_HAR = 150 * 1024 * 1024;
const MINE_KEY = 'rut:troves:mine';
const n0 = x => Number(x).toLocaleString(Site.locale());
const norm = s => String(s).normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

let PLACES = null, WORLD = null, DATA = null, SRC = store.get('rut:troves:src', 'rock'), MINE = null, STATUS = '', STATUS_ERR = false;
let onlyMine = store.get('rut:troves:onlyMine', true);
let tab = store.get('rut:troves:tab', 'overview'), mode = store.get('rut:troves:mode', 'careful'), query = '';

// ---------- reading a file ----------
function fromBalance(b){
  const items = b.categories.flatMap(c => c.items.map(i => [i.name, c.name, i.quantity, i.bankedLevel || 0, (i.bankingLevels || []).map(l => l.requiredTrovesCount)]));
  const recipes = b.discoveredRecipes.map(r => [r.name, r.ingredients.filter(g => (g.assetType || 'trove') === 'trove').map(g => [g.name, g.required])]);
  return {format:FORMAT, date:new Date().toISOString().slice(0, 10), troves:{found:b.totalCount, max:b.maxCount}, items, recipes};
}
function checkShape(j){
  const num = x => typeof x === 'number' && isFinite(x);
  if(!j || j.format !== FORMAT || !Array.isArray(j.items) || !Array.isArray(j.recipes)) return null;
  if(j.items.length > 1500 || j.recipes.length > 3000) return null;
  const items = j.items.filter(i => Array.isArray(i) && typeof i[0] === 'string' && num(i[2])).map(i => [String(i[0]).slice(0, 80), String(i[1] || '').slice(0, 40), i[2], num(i[3]) ? i[3] : 0, (Array.isArray(i[4]) ? i[4] : []).filter(num).slice(0, 5)]);
  const recipes = j.recipes.filter(r => Array.isArray(r) && typeof r[0] === 'string' && Array.isArray(r[1])).map(r => [String(r[0]).slice(0, 80), r[1].filter(g => Array.isArray(g) && typeof g[0] === 'string' && num(g[1])).map(g => [String(g[0]).slice(0, 80), g[1]])]);
  if(!items.length || !recipes.length) return null;
  const st = j.stamina && num(j.stamina.current) ? {current:j.stamina.current, max:num(j.stamina.max) ? j.stamina.max : null} : null;
  return {format:FORMAT, date:String(j.date || '').slice(0, 10), troves:{found:num(j.troves && j.troves.found) ? j.troves.found : items.length, max:num(j.troves && j.troves.max) ? j.troves.max : null}, items, recipes, stamina:st};
}
// A HAR holds your login, so the page never keeps it: it reads the HAR here, takes only the trove inventory out of it, and drops the rest.
function fromHar(har){
  let bal = null, stamina = null;
  for(const e of (har.log.entries || [])){
    const c = e && e.response && e.response.content; if(!c || !c.text) continue;
    let body; try{ body = JSON.parse(c.encoding === 'base64' ? atob(c.text) : c.text); }catch{ continue; }
    const url = String((e.request && e.request.url) || '').split('?')[0];
    if(body && body.discoveredRecipes && body.categories) bal = body;
    else if(url.endsWith('/stamina/total') && body && typeof body.current === 'number') stamina = body;
  }
  if(!bal) return null;
  const d = fromBalance(bal); if(stamina) d.stamina = {current:stamina.current, max:stamina.max};
  return d;
}
// Returns {data} or {err}. A HAR is read here and reduced to the inventory. Any other file with a token in it is declined.
function readText(text){
  const looksHar = /^\s*\{\s*"log"\s*:/.test(text.slice(0, 300));
  if(!looksHar){
    if(text.length > MAX_BYTES) return {err:'upErrBig'};
    if(TOKEN.test(text)) return {err:'upErrToken'};
  }
  let j; try{ j = JSON.parse(text); }catch{ return {err:'upErrJson'}; }
  if(j && j.log && j.log.entries){ const d = fromHar(j); const c = d && checkShape(d); return c ? {data:c} : {err:'upErrNoInv'}; }
  if(j && j.format === FORMAT){ const d = checkShape(j); return d ? {data:d} : {err:'upErrShape'}; }
  const bal = j && j.discoveredRecipes ? j : (j && Array.isArray(j.responses) ? j.responses.map(r => r && r.body).find(b => b && b.discoveredRecipes) : null);
  if(bal && bal.categories){ try{ const d = checkShape(fromBalance(bal)); if(d) return {data:d}; }catch{} }
  return {err:'upErrShape'};
}
async function takeFile(file){
  if(!file) return;
  if(file.size > MAX_HAR){ STATUS = t('upErrBig'); STATUS_ERR = true; return draw(); }
  const r = readText(await file.text());
  if(r.err){ STATUS = t(r.err); STATUS_ERR = true; return draw(); }
  MINE = r.data; store.set(MINE_KEY, MINE); SRC = 'mine'; store.set('rut:troves:src', SRC);
  STATUS = t('loaded', {n:MINE.items.length, r:MINE.recipes.length, d:MINE.date || '?'}); STATUS_ERR = false;
  use(); draw();
}

// ---------- analysis ----------
let A = null;
function use(){
  DATA = SRC === 'mine' && MINE ? MINE : ROCK;
  A = DATA && PLACES ? analyse(DATA) : null;
}
function analyse(d){
  const items = new Map(d.items.map(i => [i[0], {name:i[0], cat:i[1], q:i[2], lvl:i[3], th:i[4]}]));
  const have = n => (items.get(n) || {q:0}).q;
  const recs = d.recipes.map(([name, ings]) => {
    const g = ings.map(([n, req]) => ({n, req, have:have(n)}));
    const short = g.filter(x => x.have < x.req);
    return {name, ings:g, ok:!short.length, short};
  });
  const need = new Map();   // trove -> {max needed in one recipe, recipes that use it}
  recs.forEach(r => r.ings.forEach(g => { const e = need.get(g.n) || {max:0, uses:0}; e.max = Math.max(e.max, g.req); e.uses++; need.set(g.n, e); }));
  const block = new Map();
  recs.filter(r => !r.ok).forEach(r => r.short.forEach(s => {
    const e = block.get(s.n) || {n:s.n, recipes:0, alone:0, gap:0}; e.recipes++; if(r.short.length === 1) e.alone++; e.gap = Math.max(e.gap, s.req - s.have); block.set(s.n, e);
  }));
  const blockers = [...block.values()].sort((a, b) => b.recipes - a.recipes || b.alone - a.alone);
  const sites = n => { const p = PLACES.get(n); return p ? p.structures.length + p.plants.length : null; };
  const [mS, mR] = mode === 'careful' ? [5, 2] : [3, 1];
  const prot = new Set();
  const rows = [];
  items.forEach(i => {
    const nd = need.get(i.name), s = sites(i.name);
    const scarce = !!nd && ((s != null && s > 0 && s <= 10) || i.q < nd.max * 3);
    if(scarce) prot.add(i.name);
    const keep = nd ? nd.max * (scarce ? mS : mR) : 0;
    const nxt = i.th[i.lvl];
    rows.push({...i, keep, scarce, uses:nd ? nd.uses : 0, max:nd ? nd.max : 0, sites:s, nxt, toGold:i.th.slice(i.lvl).reduce((a, b) => a + b, 0), canBank:nxt != null && i.q - keep >= nxt});
  });
  const byRecipe = new Map();
  recs.forEach(r => { (byRecipe.get(r.name) || byRecipe.set(r.name, []).get(r.name)).push(r); });
  // How many copies of a recipe the stock allows (all stock, no reserve), and which ingredient runs out first.
  const maxOf = v => { let n = Infinity, limit = ''; v.ings.forEach(g => { const c = Math.floor(g.have / g.req); if(c < n){ n = c; limit = g.n; } }); return {n, limit}; };
  const reachOf = (it, copies) => { let lv = it.lvl, tot = it.q + copies; while(lv < it.th.length && tot >= it.th[lv]){ tot -= it.th[lv]; lv++; } return {lv, left:tot}; };
  const craftable = [...byRecipe.entries()].filter(([, v]) => v.some(r => r.ok)).map(([name, v]) => {
    const vs = v.filter(r => r.ok), best = vs.map(r => ({r, ...maxOf(r)})).sort((a, b) => b.n - a.n)[0], item = items.get(name);
    return {name, versions:vs, isNew:!item, item, copies:best.n, limit:best.limit, reach:item ? reachOf(item, best.n) : null};
  });
  // Bulk crafting for the bank: copies you can make from unprotected ingredients, and the banking levels they would reach.
  const bulk = [];
  byRecipe.forEach((vs, name) => {
    const it = items.get(name); if(!it || it.lvl >= it.th.length) return;
    let best = 0;
    vs.forEach(r => { if(r.ings.some(g => prot.has(g.n))) return; best = Math.max(best, Math.min(...r.ings.map(g => Math.floor(g.have / g.req)))); });
    let lv = it.lvl, tot = it.q + best; while(lv < it.th.length && tot >= it.th[lv]){ tot -= it.th[lv]; lv++; }
    if(lv > it.lvl) bulk.push({name, from:it.lvl, to:lv, held:it.q, copies:best, toGold:it.th.slice(it.lvl).reduce((a, b) => a + b, 0)});
  });
  bulk.sort((a, b) => (b.to - b.from) - (a.to - a.from) || a.toGold - b.toGold);
  // The plan: take the cheapest next banking step anywhere (bank now, or craft a few and bank), spend the ingredients, repeat.
  // Reserves are respected and protected ingredients are never used, so the plan can be done in full, in one go.
  const keepOf = new Map(rows.map(r => [r.name, r.keep]));
  const stock = new Map([...items].map(([n, i]) => [n, i.q]));
  const lvl = new Map([...items].map(([n, i]) => [n, i.lvl]));
  const plan = new Map();
  for(let guard = 0; guard < 4000; guard++){
    let best = null;
    for(const [name, it] of items){
      const L = lvl.get(name), nxt = it.th[L]; if(nxt == null) continue;
      const need = Math.max(0, nxt + (keepOf.get(name) || 0) - stock.get(name));
      let pick = null;
      if(need > 0){
        for(const v of (byRecipe.get(name) || [])){
          if(v.ings.some(g => prot.has(g.n))) continue;
          if(v.ings.every(g => (stock.get(g.n) || 0) - (keepOf.get(g.n) || 0) >= g.req * need)){ pick = v; break; }
        }
        if(!pick) continue;
      }
      if(!best || need < best.need || (need === best.need && nxt < best.nxt)) best = {name, it, need, nxt, pick, L};
    }
    if(!best) break;
    const e = plan.get(best.name) || {name:best.name, from:best.L, q0:items.get(best.name).q, crafts:0, steps:[], uses:new Map(), gold:items.get(best.name).th.reduce((a, b) => a + b, 0)};
    if(best.need > 0) best.pick.ings.forEach(g => { stock.set(g.n, (stock.get(g.n) || 0) - g.req * best.need); e.uses.set(g.n, (e.uses.get(g.n) || 0) + g.req * best.need); });
    stock.set(best.name, stock.get(best.name) + best.need - best.nxt);
    lvl.set(best.name, best.L + 1);
    e.crafts += best.need; e.to = best.L + 1; e.steps.push({to:best.L + 1, craft:best.need, cost:best.nxt});
    plan.set(best.name, e);
  }
  const easy = [...plan.values()].sort((a, b) => (b.to - b.from) - (a.to - a.from) || a.crafts - b.crafts);
  const oneShort = recs.filter(r => r.short.length === 1).length;
  return {items, recs, blockers, rows, craftable, bulk, easy, craftN:recs.filter(r => r.ok).length, oneShort, prot};
}

// ---------- drawing ----------
const levelName = l => l ? t(['', 'bronze', 'silver', 'gold'][l] || 'gold') : '—';
const placeList = (p, all) => {
  if(!p) return '';
  const st = p.structures, pl = p.plants, shown = all ? st : st.slice(0, 6);
  const head = esc(shown.join(', ')) + (!all && st.length > 6 ? ` <span class="muted">+${st.length - 6}</span>` : '') + (pl.length ? ` · ${esc(t('plantsLbl'))}: ${esc(pl.join(', '))}` : '');
  return head;
};
const whereCell = n => {
  const p = PLACES.get(n); if(!p) return '<span class="muted">—</span>';
  const total = p.structures.length + p.plants.length;
  return `<div class="places">${placeList(p, false)}</div>${p.structures.length > 6 ? `<details class="more"><summary>${esc(t('more', {n:total}))}</summary><div class="places">${placeList(p, true)}</div></details>` : ''}`;
};
function tbl(head, rows){
  return `<div class="tablewrap"><table><thead><tr>${head.map(h => `<th class="${h[1] || ''}">${esc(h[0])}</th>`).join('')}</tr></thead><tbody>${rows.join('') || `<tr><td colspan="${head.length}" class="muted">${esc(t('cNone'))}</td></tr>`}</tbody></table></div>`;
}
const sec = (title, note, body) => `<div class="sec"><h2>${esc(title)}</h2>${note ? `<p>${esc(note)}</p>` : ''}</div>${body}`;

function viewOverview(){
  const top = A.blockers.slice(0, 10);
  return sec(t('ovFirst'), t('ovFirstN'), tbl([[t('colTrove')], [t('colBlocks'), 'n'], [t('colAlone'), 'n'], [t('colHave'), 'n'], [t('colWhere')]],
    top.map(b => `<tr><td><b>${esc(b.n)}</b></td><td class="n">${b.recipes}</td><td class="n">${b.alone}</td><td class="n">${n0((A.items.get(b.n) || {q:0}).q)}</td><td>${whereCell(b.n)}</td></tr>`)));
}
function viewMissing(){
  return sec(t('tMissing'), t('ovFirstN'), tbl([[t('colTrove')], [t('colBlocks'), 'n'], [t('colAlone'), 'n'], [t('colHave'), 'n'], [t('colNeed'), 'n'], [t('colWhere')]],
    A.blockers.map(b => `<tr><td><b>${esc(b.n)}</b></td><td class="n">${b.recipes}</td><td class="n">${b.alone}</td><td class="n">${n0((A.items.get(b.n) || {q:0}).q)}</td><td class="n">+${b.gap}</td><td>${whereCell(b.n)}</td></tr>`)));
}
function craftRow(c){
  const ing = c.versions.map(v => v.ings.map(g => `${esc(g.n)} ×${g.req}`).join(', ')).join('<br><span class="muted">or</span> ');
  const p = PLACES.get(c.name), at = p ? p.craftAt : [];
  const many = c.copies > 1 && c.copies !== Infinity;
  const reach = c.reach && c.reach.lv > c.item.lvl ? `<span class="tag good">${esc(levelName(c.reach.lv))}</span> <span class="muted">${esc(t('cLeft', {n:n0(c.reach.left)}))}</span>` : (c.isNew ? `<span class="muted">${esc(t('cAfter'))}</span>` : '');
  return `<tr><td><b>${esc(c.name)}</b>${c.isNew ? ` <span class="tag good">${esc(t('newTag'))}</span>` : ''}</td>
    <td class="n"><b>${n0(c.copies)}</b><div class="muted small">${esc(t('cLimit', {x:c.limit}))}</div></td><td>${reach}</td><td>${ing}</td>
    <td><div class="places">${esc(at.slice(0, 6).join(', '))}${at.length > 6 ? ` <span class="muted">+${at.length - 6}</span>` : ''}</div></td></tr>`;
}
function viewCraft(){
  const head = [[t('colTrove')], [t('cUpTo'), 'n'], [t('cReach')], [t('colIng')], [t('colCraftAt')]];
  const nw = A.craftable.filter(c => c.isNew).sort((a, b) => a.name.localeCompare(b.name));
  const old = A.craftable.filter(c => !c.isNew).sort((a, b) => a.name.localeCompare(b.name));
  return sec(t('cNew'), t('cNewN'), tbl(head, nw.map(craftRow))) + sec(t('cAgain'), t('cAgainN'), tbl(head, old.map(craftRow)));
}
function viewBank(){
  const now = A.rows.filter(r => r.canBank).sort((a, b) => a.nxt - b.nxt || a.toGold - b.toGold);
  const prot = A.rows.filter(r => r.scarce && r.nxt != null).sort((a, b) => b.uses - a.uses);
  const modeSel = `<div class="row" style="margin:6px 0"><span class="small muted">${esc(t('bMode'))}</span><div class="seg" id="mode"><button type="button" data-mode="careful" class="${mode === 'careful' ? 'on' : ''}">${esc(t('bCareful'))}</button><button type="button" data-mode="relaxed" class="${mode === 'relaxed' ? 'on' : ''}">${esc(t('bRelaxed'))}</button></div></div><p class="hint">${esc(t('bModeN'))}</p>`;
  return modeSel
    + sec(t('bNow'), t('bNowN'), tbl([[t('colTrove')], [t('colLevel')], [t('colCost'), 'n'], [t('colHeld'), 'n'], [t('colKeep'), 'n'], [t('colToGold'), 'n']],
        now.map(r => `<tr><td><b>${esc(r.name)}</b></td><td>${esc(levelName(r.lvl + 1))}</td><td class="n">${n0(r.nxt)}</td><td class="n">${n0(r.q)}</td><td class="n">${n0(r.keep)}</td><td class="n">${n0(r.toGold)}</td></tr>`)))
    + sec(t('bCraft'), t('bCraftN'), tbl([[t('colTrove')], [t('colReach')], [t('colHeld'), 'n'], [t('colCopies'), 'n'], [t('colToGold'), 'n']],
        A.bulk.slice(0, 40).map(b => `<tr><td><b>${esc(b.name)}</b></td><td>${esc(levelName(b.from))} → ${esc(levelName(b.to))}</td><td class="n">${n0(b.held)}</td><td class="n">${n0(b.copies)}</td><td class="n">${n0(b.toGold)}</td></tr>`)))
    + sec(t('bProtect'), t('bProtectN'), tbl([[t('colTrove')], [t('colHeld'), 'n'], [t('colNeed'), 'n'], [t('colUsed'), 'n'], [t('colSites'), 'n']],
        prot.map(r => `<tr><td><b>${esc(r.name)}</b></td><td class="n">${n0(r.q)}</td><td class="n">${n0(r.max)}</td><td class="n">${r.uses}</td><td class="n">${r.sites == null ? '—' : r.sites}</td></tr>`)));
}
function viewEasy(){
  const levels = A.easy.reduce((a, e) => a + (e.to - e.from), 0), crafts = A.easy.reduce((a, e) => a + e.crafts, 0);
  const just = A.easy.filter(e => e.crafts === 0), work = A.easy.filter(e => e.crafts > 0);
  const uses = e => [...e.uses.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4).map(([n, q]) => `${esc(n)} ×${n0(q)}`).join(', ') + (e.uses.size > 4 ? ` <span class="muted">+${e.uses.size - 4}</span>` : '');
  const steps = e => e.steps.map(s => `→ <span class="tag">${esc(levelName(s.to))}</span> ${s.craft ? esc(t('eCraftVerb', {n:n0(s.craft)})) + ', ' : ''}${esc(t('eBankVerb', {n:n0(s.cost)}))}`).join('<br>');
  const now = e => `${esc(levelName(e.from))} · ${esc(t('eHold', {n:n0(e.q0)}))}`;
  const h1 = [[t('colTrove')], [t('colNow')], [t('colEnds')], [t('colSteps')], [t('colToGold'), 'n']];
  const h2 = [[t('colTrove')], [t('colNow')], [t('colCraftTot'), 'n'], [t('colEnds')], [t('colSteps')], [t('colUses')]];
  return `<div class="card" style="margin:0 0 6px">${esc(t('eSum', {c:n0(crafts), b:n0(levels)}))}</div>`
    + sec(t('ePlan'), t('ePlanN'), tbl(h2, work.map(e => `<tr><td><b>${esc(e.name)}</b></td><td>${now(e)}</td><td class="n"><b>${n0(e.crafts)}</b></td><td><span class="tag good">${esc(levelName(e.to))}</span></td><td class="small">${steps(e)}</td><td class="places">${uses(e)}</td></tr>`)))
    + sec(t('eJust'), t('eJustN'), tbl(h1, just.map(e => `<tr><td><b>${esc(e.name)}</b></td><td>${now(e)}</td><td><span class="tag good">${esc(levelName(e.to))}</span></td><td class="small">${steps(e)}</td><td class="n">${n0(e.gold)}</td></tr>`)));
}
// Which scanned cities hold a trove: cities where at least one of its structures is built, with the structures found there.
const presence = (() => { const memo = new Map(); return name => {
  if(memo.has(name)) return memo.get(name);
  const out = new Map(), p = PLACES.get(name);
  if(p && WORLD) p.structures.forEach(sn => { const e = WORLD.structures[norm(sn).replace(/ 1$/, '')]; if(!e) return; Object.entries(e.c).forEach(([cid, c]) => { if(c > 0){ const o = out.get(cid) || {n:0, s:[]}; o.n += c; o.s.push(sn); out.set(cid, o); } }); });
  memo.set(name, out); return out; }; })();
function viewWorld(){
  if(!WORLD || !WORLD.cities.length) return `<div class="card muted">${esc(t('wNone'))}</div>`;
  const cname = id => (WORLD.cities.find(c => String(c.id) === String(id)) || {name:'#' + id}).name;
  const cover = `<div class="card" style="margin-bottom:6px">${esc(t('wCover', {list:WORLD.cities.map(c => c.name + (c.done ? '' : ' ' + n0(c.read) + '/' + n0(c.total))).join(', ')}))}</div>`;
  const best = WORLD.cities.map(c => {
    const got = A.blockers.filter(b => presence(b.n).has(String(c.id))), miss = A.blockers.filter(b => !presence(b.n).has(String(c.id)));
    return {c, got, miss, w:got.reduce((a, b) => a + b.recipes, 0)};
  }).sort((a, b) => b.w - a.w);
  const bestT = tbl([[t('wCity')], [t('wGives'), 'n'], [t('wUnlock'), 'n'], [t('wMissing')]],
    best.map(r => `<tr><td><b>${esc(r.c.name)}</b></td><td class="n">${r.got.length} / ${A.blockers.length}</td><td class="n">${r.w}</td><td class="places">${esc(r.miss.map(b => b.n).join(', '))}</td></tr>`));
  const mine = new Set([...A.items.values()].filter(i => i.q > 0).map(i => i.name));
  const rows = [];
  PLACES.forEach((p, name) => {
    if(!p.structures.length) return;
    const pr = presence(name), have = mine.has(name);
    if(onlyMine && have) return;
    if(pr.size <= 2) rows.push({name, pr, have, w:(A.blockers.find(b => b.n === name) || {recipes:0}).recipes});
  });
  rows.sort((a, b) => (b.w - a.w) || (a.pr.size - b.pr.size) || a.name.localeCompare(b.name));
  const grind = tbl([[t('colTrove')], [t('wCities')], [t('wStructs')]], rows.map(r => `<tr><td><b>${esc(r.name)}</b>${r.w ? ` <span class="tag bad">${r.w}</span>` : ''}</td>
    <td>${r.pr.size ? esc([...r.pr.keys()].map(cname).join(', ')) : `<span class="muted">${esc(t('wNoCity'))}</span>`}</td>
    <td class="places">${esc([...new Set([...r.pr.values()].flatMap(v => v.s))].slice(0, 6).join(', ') || PLACES.get(r.name).structures.slice(0, 4).join(', '))}</td></tr>`));
  return cover + sec(t('wBestH'), t('wBestN'), bestT)
    + sec(t('wGrindH'), t('wGrindN'), `<label class="row small" style="margin-bottom:6px"><input type="checkbox" id="onlyMine" ${onlyMine ? 'checked' : ''}> ${esc(t('wOnlyMine'))}</label>` + grind);
}
function viewFind(){
  const q = norm(query);
  const names = new Set([...PLACES.keys(), ...A.items.keys()]);
  const hits = q ? [...names].filter(n => norm(n).includes(q)).sort((a, b) => (norm(a).startsWith(q) ? 0 : 1) - (norm(b).startsWith(q) ? 0 : 1) || a.localeCompare(b)).slice(0, 15) : [];
  const usedIn = n => [...new Set(A.recs.filter(r => r.ings.some(g => g.n === n)).map(r => r.name))].sort();
  const body = hits.map(n => {
    const p = PLACES.get(n), it = A.items.get(n), u = usedIn(n);
    return `<div class="card" style="margin-bottom:10px"><h2 style="margin:0 0 4px">${esc(n)} <span class="tag">${esc(it ? t('fHeld', {n:n0(it.q)}) : t('fNotOwned'))}</span></h2>
      ${p && (p.structures.length || p.plants.length) ? `<p class="places"><b>${esc(t('fFound'))}:</b> ${placeList(p, true)}</p>` : ''}
      ${p && p.craftAt.length ? `<p class="places"><b>${esc(t('fCraftedAt'))}:</b> ${esc(p.craftAt.join(', '))}</p>` : ''}
      ${u.length ? `<p class="places"><b>${esc(t('fUsedIn'))}:</b> ${esc(u.join(', '))}</p>` : ''}</div>`;
  }).join('');
  return `<div class="row" style="margin-bottom:10px"><input type="search" id="q" class="grow" placeholder="${esc(t('fHint'))}" value="${esc(query)}" autocomplete="off"></div><div id="hits">${q && !hits.length ? `<div class="card muted">${esc(t('fNothing'))}</div>` : body}</div>`;
}

function srcCard(){
  const el = document.getElementById('src');
  el.innerHTML = `<div class="row"><b>${esc(t('srcTitle'))}</b>
      <div class="seg" id="srcSeg"><button type="button" data-src="rock" class="${SRC === 'rock' ? 'on' : ''}">${esc(t('srcRock'))}</button><button type="button" data-src="mine" class="${SRC === 'mine' ? 'on' : ''}" ${MINE ? '' : 'disabled'}>${esc(t('srcMine'))}</button></div>
      ${MINE ? `<button type="button" class="btn small" id="forget">${esc(t('forget'))}</button>` : ''}</div>
    <label class="drop" id="drop" for="file">${esc(t('drop'))}<input type="file" id="file" accept=".har,.json,application/json" hidden></label>
    <div class="hint">${esc(t('private'))}</div>
    <div class="status ${STATUS_ERR ? 'err' : ''}" role="status">${esc(STATUS)}</div>`;
  document.getElementById('howto').textContent = t('howto');
}
function draw(){
  srcCard();
  const app = document.getElementById('app');
  if(!A){ app.innerHTML = `<div class="card muted" style="margin-top:12px">${esc(t('loading'))}</div>`; return; }
  const st = DATA.stamina;
  const kpi = (v, l) => `<div class="kpi"><div class="v">${v}</div><div class="l">${esc(l)}</div></div>`;
  const tabs = [['overview', '📋', t('tOverview'), ''], ['missing', '🔎', t('tMissing'), A.blockers.length], ['craft', '🛠', t('tCraft'), t('cTabN', {n:A.craftable.filter(c => c.isNew).length})], ['easy', '⭐', t('tEasy'), t('eTabN', {n:A.easy.length})], ['bank', '🏦', t('tBank'), ''], ['world', '🌍', t('tWorld'), WORLD ? t('wScanned', {n:WORLD.cities.length}) : ''], ['find', '🧭', t('tFind'), '']];
  const view = {overview:viewOverview, missing:viewMissing, craft:viewCraft, easy:viewEasy, bank:viewBank, world:viewWorld, find:viewFind}[tab] || viewOverview;
  app.innerHTML = `<div class="kpis">${kpi(`${n0(DATA.troves.found)}${DATA.troves.max ? ' / ' + n0(DATA.troves.max) : ''}`, t('kFound'))}${kpi(n0(A.craftN), t('kCraft'))}${kpi(n0(A.oneShort), t('kOne'))}${kpi(n0(A.blockers.length), t('kBlock'))}${st ? kpi(`${n0(st.current)}${st.max ? ' / ' + n0(st.max) : ''}`, t('kStamina')) : ''}${kpi(esc(DATA.date || '—'), t('kDate'))}</div>
    <nav class="boxtabs" id="tabs">${tabs.map(([id, ic, name, ct]) => `<button type="button" class="boxtab ${tab === id ? 'on' : ''}" data-tab="${id}"><span class="ic" aria-hidden="true">${ic}</span><span class="nm">${esc(name)}</span><span class="ct">${esc(ct === '' ? '' : ct)}</span></button>`).join('')}</nav>
    <section>${view()}</section>`;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if(b){ tab = b.dataset.tab; store.set('rut:troves:tab', tab); draw(); return; }
  const m = e.target.closest('[data-mode]'); if(m){ mode = m.dataset.mode; store.set('rut:troves:mode', mode); use(); draw(); return; }
  const s = e.target.closest('[data-src]'); if(s && !s.disabled){ SRC = s.dataset.src; store.set('rut:troves:src', SRC); use(); draw(); return; }
  if(e.target.closest('#forget')){ MINE = null; try{ localStorage.removeItem(MINE_KEY); }catch{} SRC = 'rock'; store.set('rut:troves:src', SRC); STATUS = ''; use(); draw(); }
});
document.addEventListener('change', e => {
  if(e.target.id === 'file') takeFile(e.target.files[0]);
  if(e.target.id === 'onlyMine'){ onlyMine = e.target.checked; store.set('rut:troves:onlyMine', onlyMine); draw(); }
});
document.addEventListener('input', e => {
  if(e.target.id === 'q'){ query = e.target.value; const pos = e.target.selectionStart; draw(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos); }
});
['dragover', 'dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest('#drop'); if(!z) return;
  e.preventDefault(); z.classList.toggle('over', ev === 'dragover');
  if(ev === 'drop') takeFile(e.dataTransfer.files[0]);
}));

let ROCK = null;
async function boot(){
  Site.mount({onChange:draw});
  try{ MINE = store.get(MINE_KEY, null); if(MINE){ const r = readText(JSON.stringify(MINE)); MINE = r.data || null; } }catch{ MINE = null; }
  if(SRC === 'mine' && !MINE) SRC = 'rock';
  draw();
  try{
    const [p, r] = await Promise.all([fetch('../data/troves/places.json').then(x => x.json()), fetch('../data/troves/rockdrigo/latest.json').then(x => x.json())]);
    PLACES = new Map(p.troves.map(([name, cat, structures, plants, craftAt]) => [name, {cat, structures, plants, craftAt}]));
    ROCK = checkShape(r);
  }catch(e){ document.getElementById('app').innerHTML = `<div class="card status err">${esc(String(e))}</div>`; return; }
  try{ WORLD = await fetch('../data/troves/world.json').then(x => x.ok ? x.json() : null); }catch{ WORLD = null; }
  use(); draw();
}
boot();
</script>
