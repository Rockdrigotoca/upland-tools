<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rockdrigo’s Troves</title>
<meta name="description" content="Upland troves: what to find first, what you can craft right now, and what to bank without running out of what you need. Load your own troves file; it never leaves your browser.">
<link rel="stylesheet" href="../shared/theme.css">
<style>
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.875rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:.75rem;color:var(--muted);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:.6875rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.good{background:var(--accent);color:var(--accent-ink)}
.tag.warn{background:var(--warn);color:#fff}
.tag.bad{background:var(--bad);color:#fff}
.cw{font-size:1.02rem}
.cl-stop{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:0 0 10px;background:var(--surface)}
.cl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.cl-i{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.85rem}
.cl-struct h4{margin:8px 0 2px;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.sthumb{width:40px;height:40px;object-fit:contain;border-radius:8px;background:var(--surface-2)}
.cl-list{list-style:none;margin:0;padding:0}
.cl-list li{padding:6px 0;border-top:1px solid var(--border);line-height:1.45}
.cl-list li:first-child{border-top:0}
.cl-n{display:inline-flex;align-items:center;gap:6px}
.cl-q{font-weight:800;font-size:1.15rem;margin:0 4px}
.cl-go{font-weight:600}
.cl-rec{color:var(--muted);font-size:.9rem;margin-top:2px}
.cl-sum{margin:0 0 6px;font-size:1.05rem}
.cl-bad{background:rgba(179,38,30,.12);border:1px solid var(--bad);border-radius:10px;padding:8px 10px;margin:4px 0}
.cl-alt{margin:4px 0;font-size:.92rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cl-mark{margin-top:4px;font-size:.9rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cl-warn{color:var(--warn);font-weight:700;font-size:.92rem;margin-top:2px}
.ra-ok{color:var(--ok);font-weight:600}.ra-no{color:var(--bad);font-weight:600}
.chip2{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border-radius:10px;padding:4px 9px;font-size:.92rem}
.boxtabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px;margin:0 0 14px}
.boxtab{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;min-width:0}
.boxtab:hover{border-color:var(--muted)}
.boxtab .ic{font-size:1.15rem;line-height:1}
.boxtab .nm{font-weight:700;font-size:.9375rem;overflow-wrap:anywhere}
.boxtab .ct{font-size:.75rem;color:var(--muted);min-height:1em}
.boxtab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.boxtab.on .ct{color:inherit;opacity:.85}
.src{display:grid;gap:10px}
.src .row{align-items:flex-end}
.drop{border:2px dashed var(--border);border-radius:10px;padding:12px 14px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--text)}
.places{font-size:.8125rem;color:var(--muted);overflow-wrap:anywhere}
.fold{margin:10px 0}
.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.0625rem;padding:8px 0}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:'▸';color:var(--accent);transition:transform .15s}
.fold[open]>summary::before{transform:rotate(90deg)}
.fold>summary .fc{font-weight:400;font-size:.8125rem;color:var(--muted)}
details.fold.card{padding:6px 14px}
details.fold.card>summary{padding:6px 0}
.foldbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.foldbar button,.foldbar a{font:inherit;font-size:.8125rem;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:inherit;cursor:pointer;text-decoration:none}
.foldbar a{color:var(--accent)}
.sec{margin:18px 0 6px}
.sec p{margin:0 0 8px;color:var(--muted);font-size:.8125rem}
details.more summary{cursor:pointer;color:var(--accent);font-size:.8125rem}
.hint{font-size:.8125rem;color:var(--muted)}
.howto{margin-top:14px;font-size:.8125rem}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-bottom:12px}
.dash .card h2{margin:0 0 4px;font-size:1rem}
.dash .big{font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2);margin:8px 0 0}
.stack i{display:block;height:100%}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.8125rem;margin:6px 0 0;color:var(--muted)}
.legend b.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend b{color:var(--text)}
.move{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);font-size:.875rem}
.move:last-child{border-bottom:0}
.move .ic{font-size:1.1rem}
.help summary{cursor:pointer;font-weight:600}
.help dl{margin:8px 0 0;display:grid;gap:8px}
.help dt{font-weight:700}.help dd{margin:0;color:var(--muted);font-size:.875rem}
.thumb{width:28px;height:28px;border-radius:6px;object-fit:contain;background:var(--surface-2);vertical-align:middle;margin-right:6px;flex:none}
.need{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:8px}
.need .it{display:flex;gap:8px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:6px 8px;background:var(--surface)}
.need .thumb{width:40px;height:40px;margin:0}
.spots{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.btn.cool{opacity:.45;filter:grayscale(1)}
.cd{font-weight:700;margin-left:4px}
.spots .btn{font-size:.75rem;padding:5px 9px;white-space:normal;text-align:left}
details.more summary{cursor:pointer}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chips2 button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:.8125rem}
.chips2 button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sel{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}

</style>
</head>
<body>

  <section class="card src" id="src"></section>
  <div id="app"></div>
  <p class="howto"><a href="howto/" id="howto"></a></p>
  <footer id="site-footer"></footer>
</div>
<script src="../shared/site.js"></script>

// ---------- reading a file ----------
function fromBalance(b){
  const items = b.categories.flatMap(c => c.items.map(i => [i.name, c.name, i.quantity, i.bankedLevel || 0, (i.bankingLevels || []).map(l => l.requiredTrovesCount)]));
  const recipes = b.discoveredRecipes.map(r => [r.name, r.ingredients.filter(g => (g.assetType || 'trove') === 'trove').map(g => [g.name, g.required])]);
  return {format:FORMAT, date:new Date().toISOString().slice(0, 10), troves:{found:b.totalCount, max:b.maxCount}, items, recipes};
}
function checkShape(j){
  const num = x => typeof x === 'number' && isFinite(x);
  if(!j || j.format !== FORMAT || !Array.isArray(j.items) || !Array.isArray(j.recipes)) return null;
  if(j.items.length > 1500 || j.recipes.length > 3000) return null;
  const items = j.items.filter(i => Array.isArray(i) && typeof i[0] === 'string' && num(i[2])).map(i => [String(i[0]).slice(0, 80), String(i[1] || '').slice(0, 40), i[2], num(i[3]) ? i[3] : 0, (Array.isArray(i[4]) ? i[4] : []).filter(num).slice(0, 5)]);
  const recipes = j.recipes.filter(r => Array.isArray(r) && typeof r[0] === 'string' && Array.isArray(r[1])).map(r => [String(r[0]).slice(0, 80), r[1].filter(g => Array.isArray(g) && typeof g[0] === 'string' && num(g[1])).map(g => [String(g[0]).slice(0, 80), g[1]])]);
  if(!items.length || !recipes.length) return null;
  const st = j.stamina && num(j.stamina.current) ? {current:j.stamina.current, max:num(j.stamina.max) ? j.stamina.max : null} : null;
  const nt = (Array.isArray(j.newTroves) ? j.newTroves : []).filter(x => x && typeof x.name === 'string').slice(0, 60).map(x => ({name:x.name.slice(0, 80), category:String(x.category || '').slice(0, 30), structures:(x.structures || []).slice(0, 80).map(v => String(v).slice(0, 80)), plants:(x.plants || []).slice(0, 40).map(v => String(v).slice(0, 80)), craftAt:(x.craftAt || []).slice(0, 60).map(v => String(v).slice(0, 80))}));
  return {format:FORMAT, date:String(j.date || '').slice(0, 10), troves:{found:num(j.troves && j.troves.found) ? j.troves.found : items.length, max:num(j.troves && j.troves.max) ? j.troves.max : null}, items, recipes, stamina:st, newTroves:nt};
}
// A HAR holds your login, so the page never keeps it: it reads the HAR here, takes only the trove inventory out of it, and drops the rest.
function fromHar(har){
  let bal = null, stamina = null, search = null;
  for(const e of (har.log.entries || [])){
    const c = e && e.response && e.response.content; if(!c || !c.text) continue;
    let body; try{ body = JSON.parse(c.encoding === 'base64' ? atob(c.text) : c.text); }catch{ continue; }
    const url = String((e.request && e.request.url) || '').split('?')[0];
    if(Array.isArray(body) && body.length && body[0] && body[0].locations && body[0].name) search = body;
    else if(body && body.discoveredRecipes && body.categories) bal = body;
    else if(url.endsWith('/stamina/total') && body && typeof body.current === 'number') stamina = body;
  }
  if(!bal) return null;
  const d = fromBalance(bal); if(stamina) d.stamina = {current:stamina.current, max:stamina.max};
  if(search && PLACES){   // troves this player can see that our list does not have
    d.newTroves = search.filter(x => !PLACES.has(x.name) && ((x.locations && (x.locations.structures || []).length) || (x.locations && (x.locations.plants || []).length) || (x.recipe || []).length)).slice(0, 60)
      .map(x => ({name:String(x.name).slice(0, 80), category:String(x.category || '').slice(0, 30), structures:((x.locations || {}).structures || []).slice(0, 80).map(v => String(v).slice(0, 80)), plants:((x.locations || {}).plants || []).slice(0, 40).map(v => String(v).slice(0, 80)), craftAt:[...new Set((x.recipe || []).map(r => String(r.location).slice(0, 80)))].slice(0, 60)}));
  }
  return d;
}
// Returns {data} or {err}. A HAR is read here and reduced to the inventory. Any other file with a token in it is declined.
function readText(text){
  const looksHar = /^\s*\{\s*"log"\s*:/.test(text.slice(0, 300));
  if(!looksHar){
    if(text.length > MAX_BYTES) return {err:'upErrBig'};
    if(TOKEN.test(text)) return {err:'upErrToken'};
  }
  let j; try{ j = JSON.parse(text); }catch{ return {err:'upErrJson'}; }
  if(j && j.log && j.log.entries){ const d = fromHar(j); const c = d && checkShape(d); return c ? {data:c} : {err:'upErrNoInv'}; }
  if(j && j.format === FORMAT){ const d = checkShape(j); return d ? {data:d} : {err:'upErrShape'}; }
  const bal = j && j.discoveredRecipes ? j : (j && Array.isArray(j.responses) ? j.responses.map(r => r && r.body).find(b => b && b.discoveredRecipes) : null);
  if(bal && bal.categories){ try{ const d = checkShape(fromBalance(bal)); if(d) return {data:d}; }catch{} }
  return {err:'upErrShape'};
}
async function takeFile(file){
  if(!file) return;
  if(file.size > MAX_HAR){ STATUS = t('upErrBig'); STATUS_ERR = true; return draw(); }
  const r = readText(await file.text());
  if(r.err){ STATUS = t(r.err); STATUS_ERR = true; return draw(); }
  MINE = r.data; store.set(MINE_KEY, MINE); SRC = 'mine'; store.set('rut:troves:src', SRC);
  STATUS = t('loaded', {n:MINE.items.length, r:MINE.recipes.length, d:MINE.date || '?'}); STATUS_ERR = false;
  use(); draw();
}

let A = null;
function use(){
  DATA = SRC === 'mine' && MINE ? MINE : ROCK;
  A = DATA && PLACES ? analyse(DATA) : null;
  EXTRA = (DATA && DATA.newTroves) || [];
}
function analyse(d){
  // Gold is the manual goal: Platinum and Diamond need automation, so they are kept apart (th5) and never count as unfinished.
  const items = new Map(d.items.map(i => [i[0], {name:i[0], cat:i[1], q:i[2], lvl:Math.min(i[3], 3), th:i[4].slice(0, 3), th5:i[4], lvl5:i[3]}]));
  const have = n => (items.get(n) || {q:0}).q;
  const recs = d.recipes.map(([name, ings]) => {
    const g = ings.map(([n, req]) => ({n, req, have:have(n)}));
    const short = g.filter(x => x.have < x.req);
    return {name, ings:g, ok:!short.length, short};
  });
  const need = new Map();   // trove -> {max needed in one recipe, recipes that use it}
  recs.forEach(r => r.ings.forEach(g => { const e = need.get(g.n) || {max:0, uses:0}; e.max = Math.max(e.max, g.req); e.uses++; need.set(g.n, e); }));
  const okName = new Set(recs.filter(r => r.ok).map(r => r.name));
  const block = new Map();
  recs.filter(r => !r.ok).forEach(r => r.short.forEach(s => {
    const e = block.get(s.n) || {n:s.n, recipes:0, alone:0, gap:0, newT:new Set(), stuck:new Set(), alt:0}; e.recipes++; if(r.short.length === 1) e.alone++; e.gap = Math.max(e.gap, s.req - s.have);
    // what it really unlocks: a trove never found, a trove found but not craftable now, or only an alternative recipe of one you can already craft
    if(okName.has(r.name)) e.alt++; else if(!items.has(r.name)) e.newT.add(r.name); else e.stuck.add(r.name);
    block.set(s.n, e);
  }));
  const blockers = [...block.values()].filter(e => findable(e.n)).map(e => ({...e, newT:[...e.newT], stuck:[...e.stuck]})).sort((a, b) => b.newT.length - a.newT.length || b.stuck.length - a.stuck.length || b.recipes - a.recipes || b.alone - a.alone);
  const sites = n => { const p = PLACES.get(n); return p ? p.structures.length + p.plants.length : null; };
  const [mS, mR] = mode === 'careful' ? [5, 2] : [3, 1];
  const prot = new Set();
  const rows = [];
  items.forEach(i => {
    const nd = need.get(i.name), s = sites(i.name);
    const scarce = !!nd && ((s != null && s > 0 && s <= 10) || i.q < nd.max * 3);
    if(scarce) prot.add(i.name);
    const keep = nd ? nd.max * (scarce ? mS : mR) : 0;
    const nxt = i.th[i.lvl];
    rows.push({...i, keep, scarce, uses:nd ? nd.uses : 0, max:nd ? nd.max : 0, sites:s, nxt, toGold:i.th.slice(i.lvl).reduce((a, b) => a + b, 0), canBank:nxt != null && i.q - keep >= nxt});
  });
  const byRecipe = new Map();
  recs.forEach(r => { (byRecipe.get(r.name) || byRecipe.set(r.name, []).get(r.name)).push(r); });
  // How many copies of a recipe the stock allows (all stock, no reserve), and which ingredient runs out first.
  const maxOf = v => { let n = Infinity, limit = ''; v.ings.forEach(g => { const c = Math.floor(g.have / g.req); if(c < n){ n = c; limit = g.n; } }); return {n, limit}; };
  const reachOf = (it, copies) => { let lv = it.lvl, tot = it.q + copies; while(lv < it.th.length && tot >= it.th[lv]){ tot -= it.th[lv]; lv++; } return {lv, left:tot}; };
  const craftable = [...byRecipe.entries()].filter(([, v]) => v.some(r => r.ok)).map(([name, v]) => {
    const vs = v.filter(r => r.ok), best = vs.map(r => ({r, ...maxOf(r)})).sort((a, b) => b.n - a.n)[0], item = items.get(name);
    return {name, versions:vs, isNew:!item, item, copies:best.n, limit:best.limit, reach:item ? reachOf(item, best.n) : null};
  });
  // Bulk crafting for the bank: copies you can make from unprotected ingredients, and the banking levels they would reach.
  const bulk = [];
  byRecipe.forEach((vs, name) => {
    const it = items.get(name); if(!it || it.lvl >= it.th.length) return;
    let best = 0;
    vs.forEach(r => { if(r.ings.some(g => prot.has(g.n))) return; best = Math.max(best, Math.min(...r.ings.map(g => Math.floor(g.have / g.req)))); });
    let lv = it.lvl, tot = it.q + best; while(lv < it.th.length && tot >= it.th[lv]){ tot -= it.th[lv]; lv++; }
    if(lv > it.lvl) bulk.push({name, from:it.lvl, to:lv, held:it.q, copies:best, toGold:it.th.slice(it.lvl).reduce((a, b) => a + b, 0)});
  });
  bulk.sort((a, b) => (b.to - b.from) - (a.to - a.from) || a.toGold - b.toGold);
  // The plan: take the cheapest next banking step anywhere (bank now, or craft a few and bank), spend the ingredients, repeat.
  // Reserves are respected and protected ingredients are never used, so the plan can be done in full, in one go.
  const keepOf = new Map(rows.map(r => [r.name, r.keep]));
  const stock = new Map([...items].map(([n, i]) => [n, i.q]));
  const lvl = new Map([...items].map(([n, i]) => [n, i.lvl]));
  const plan = new Map();
  for(let guard = 0; guard < 4000; guard++){
    let best = null;
    for(const [name, it] of items){
      const L = lvl.get(name), nxt = it.th[L]; if(nxt == null) continue;
      const need = Math.max(0, nxt + (keepOf.get(name) || 0) - stock.get(name));
      let pick = null;
      if(need > 0){
        for(const v of (byRecipe.get(name) || [])){
          if(v.ings.some(g => prot.has(g.n))) continue;
          if(v.ings.every(g => (stock.get(g.n) || 0) - (keepOf.get(g.n) || 0) >= g.req * need)){ pick = v; break; }
        }
        if(!pick) continue;
      }
      if(!best || need < best.need || (need === best.need && nxt < best.nxt)) best = {name, it, need, nxt, pick, L};
    }
    if(!best) break;
    const e = plan.get(best.name) || {name:best.name, from:best.L, q0:items.get(best.name).q, crafts:0, steps:[], uses:new Map(), gold:items.get(best.name).th.reduce((a, b) => a + b, 0)};
    if(best.need > 0){
      best.pick.ings.forEach(g => { stock.set(g.n, (stock.get(g.n) || 0) - g.req * best.need); e.uses.set(g.n, (e.uses.get(g.n) || 0) + g.req * best.need); });
      // which version of the recipe, how many times: some steps use one version and some another
      const sig = best.pick.ings.map(g => g.n + ':' + g.req).join('|'), vv = e.vers || (e.vers = new Map()), cur = vv.get(sig);
      vv.set(sig, {ings:best.pick.ings, k:(cur ? cur.k : 0) + best.need});
    }
    stock.set(best.name, stock.get(best.name) + best.need - best.nxt);
    lvl.set(best.name, best.L + 1);
    e.crafts += best.need; e.to = best.L + 1; e.steps.push({to:best.L + 1, craft:best.need, cost:best.nxt});
    plan.set(best.name, e);
  }
  const easy = [...plan.values()].sort((a, b) => (b.to - b.from) - (a.to - a.from) || a.crafts - b.crafts);
  // The gold road: what each trove still costs to reach gold (banking uses the troves up), what is spare above that, and what can be
  // crafted from spare stock alone, fewest places first.
  const gold = [...items.values()].filter(i => i.th.length).map(i => {
    const need = i.th.slice(i.lvl).reduce((a, b) => a + b, 0), p = PLACES.get(i.name);
    return {name:i.name, cat:i.cat, q:i.q, lvl:i.lvl, th:i.th, need, gap:Math.max(0, need - i.q), spare:Math.max(0, i.q - need), sites:p ? p.structures.length + p.plants.length : null, canCraft:byRecipe.has(i.name)};
  });
  const goldSpare = new Map(gold.map(r => [r.name, r.spare]));
  const goldCraft = [];
  gold.filter(r => r.gap > 0 && r.canCraft).sort((a, b) => (a.sites == null ? 99 : a.sites) - (b.sites == null ? 99 : b.sites) || b.gap - a.gap).forEach(r => {
    const per = byRecipe.get(r.name).map(v => ({v, n:Math.min(...v.ings.map(g => Math.floor((goldSpare.get(g.n) || 0) / g.req)))})).sort((a, b) => b.n - a.n)[0];
    const k = Math.min(r.gap, per.n); if(k <= 0) return;
    per.v.ings.forEach(g => goldSpare.set(g.n, goldSpare.get(g.n) - g.req * k));
    goldCraft.push({name:r.name, k, gap:r.gap, sites:r.sites, ings:per.v.ings});
  });
  // Crafting many of one trove raises the chance of a bonus item, so: for a target of T crafts each, which troves can reach it using only
  // the stock above the reserve and never a protected ingredient, one trove after another so shared ingredients are spent only once.
  const bonusFor = T => {
    const spare = new Map([...items].map(([n, i]) => [n, Math.max(0, i.q - (keepOf.get(n) || 0))]));
    const cands = [];
    byRecipe.forEach((vs, name) => {
      const ok = vs.filter(v => !v.ings.some(g => prot.has(g.n)));
      if(!ok.length) return;
      const cost = Math.min(...ok.map(v => v.ings.reduce((a, g) => a + g.req / Math.max(1, spare.get(g.n) || 0), 0)));
      cands.push({name, vs:ok, cost});
    });
    cands.sort((a, b) => a.cost - b.cost);
    const out = [];
    cands.forEach(c => {
      const per = c.vs.map(v => ({v, n:Math.min(...v.ings.map(g => Math.floor((spare.get(g.n) || 0) / g.req)))})).sort((a, b) => b.n - a.n)[0];
      const k = Math.min(T, per.n);
      const lack = per.v.ings.map(g => ({n:g.n, miss:Math.max(0, g.req * T - (spare.get(g.n) || 0))})).filter(x => x.miss > 0).sort((a, b) => b.miss - a.miss);
      if(k > 0) per.v.ings.forEach(g => spare.set(g.n, spare.get(g.n) - g.req * k));
      const it = items.get(c.name);
      out.push({name:c.name, k, T, total:per.n, held:it ? it.q : null, isNew:!it, ings:per.v.ings, lack});
    });
    return out.sort((a, b) => (b.k >= b.T) - (a.k >= a.T) || b.k - a.k || a.name.localeCompare(b.name));
  };
  // Craft-now recipes compete for the same ingredients. Give each one a version it can still afford (the most constrained first), and
  // warn only about crafts left with no affordable version.
  const left = new Map(), usedBy = new Map(), clashMap = new Map();
  const stockOf = n => left.has(n) ? left.get(n) : have(n);
  craftable.filter(c => c.isNew).sort((a, b) => a.versions.length - b.versions.length || a.name.localeCompare(b.name)).forEach(c => {
    const fits = c.versions.filter(v => v.ings.every(g => stockOf(g.n) >= g.req));
    if(fits.length){
      const v = fits.sort((x, y) => Math.min(...y.ings.map(g => stockOf(g.n) - g.req)) - Math.min(...x.ings.map(g => stockOf(g.n) - g.req)))[0];
      v.ings.forEach(g => { left.set(g.n, stockOf(g.n) - g.req); usedBy.set(g.n, [...(usedBy.get(g.n) || []), c.name]); });
      return;
    }
    c.versions[0].ings.filter(g => stockOf(g.n) < g.req).forEach(g => {
      const e = clashMap.get(g.n) || {n:g.n, need:have(g.n) - stockOf(g.n), have:have(g.n), by:[...(usedBy.get(g.n) || [])]};
      e.need += g.req; e.by.push(c.name); clashMap.set(g.n, e);
    });
  });
  const clash = [...clashMap.values()].sort((a, b) => (b.need - b.have) - (a.need - a.have));
  const oneShort = recs.filter(r => r.short.length === 1).length;
  // How hard a trove is to find: the fewer times the hunting log has seen it, the scarcer. Recipes that eat scarce troves are the last choice.
  const hc = new Map(); let hN = 0;
  if(HUNTS) HUNTS.finds.forEach(f => { if(HUNTS.src[f[2]][1] === 'balloon') return; hc.set(HUNTS.troves[f[3]], (hc.get(HUNTS.troves[f[3]]) || 0) + f[4]); hN += f[4]; });
  const scarce = n => { if(!hN){ const p = PLACES.get(n); return p ? 1 / (1 + p.structures.length + p.plants.length) : 0.5; } const c = hc.get(n) || 0; return c > 0 ? 1 / (1 + c / hN * 1000) : 0.9; };
  const verCost = v => v.ings.reduce((a, g) => a + g.req * scarce(g.n), 0);
  // How many of each to craft: first one of every new trove (that is what discovers it), then the copies that bank levels,
  // all out of the same stock so the plan can be done in full, in this order.
  const qrest = new Map(), craftQty = new Map();
  const left2 = n => qrest.has(n) ? qrest.get(n) : have(n);
  const take = (n, k) => qrest.set(n, left2(n) - k);
  const entry = n => craftQty.get(n) || craftQty.set(n, {nw:0, bank:0, vers:[]}).get(n);
  const addVer = (en, ings, k) => { if(k <= 0) return; const sig = ings.map(g => g.n + ':' + g.req).join('|'), f = en.vers.find(v => v.sig === sig); if(f) f.k += k; else en.vers.push({sig, ings, k}); };
  craftable.filter(c => c.isNew).sort((a, b) => a.versions.length - b.versions.length || a.name.localeCompare(b.name)).forEach(c => {
    const v = c.versions.filter(x => x.ings.every(g => left2(g.n) >= g.req)).sort((x, y) => verCost(x) - verCost(y))[0];
    if(!v) return;
    v.ings.forEach(g => take(g.n, g.req)); const en = entry(c.name); en.nw = 1; addVer(en, v.ings, 1);
  });
  // What to craft to reach the NEXT banking level of each trove, in one visit: the copies still missing, version by version, out of the
  // stock left after the new crafts (smallest gaps first, so as many levels as possible are reached).
  const nrest = new Map(qrest), nextQty = new Map(), nleft = n => nrest.has(n) ? nrest.get(n) : have(n);
  [...items.values()].filter(i => i.th.length && i.lvl < i.th.length && byRecipe.has(i.name)).map(i => ({i, gap:i.th[i.lvl] - i.q})).sort((a, b) => a.gap - b.gap || a.i.name.localeCompare(b.i.name)).forEach(({i, gap}) => {
    if(gap <= 0){ nextQty.set(i.name, {need:0, doNow:0, q:i.q, lvl:i.lvl, thr:i.th[i.lvl], vers:[]}); return; }
    let todo = gap; const vers = [];
    byRecipe.get(i.name).map(v => ({v, cost:verCost(v)})).sort((a, b) => a.cost - b.cost).forEach(({v}) => {
      const k = Math.min(todo, ...v.ings.map(g => Math.floor(nleft(g.n) / g.req)));
      if(k > 0){ v.ings.forEach(g => nrest.set(g.n, nleft(g.n) - g.req * k)); vers.push({ings:v.ings, k}); todo -= k; }
    });
    nextQty.set(i.name, {need:gap, doNow:gap - todo, q:i.q, lvl:i.lvl, thr:i.th[i.lvl], vers});
  });
  // banking copies: the easy plan, version by version, as far as the stock left after the new crafts allows
  easy.filter(e => e.crafts > 0 && e.vers).forEach(e => {
    let todo = e.crafts;
    [...e.vers.values()].sort((a, b) => b.k - a.k).forEach(v => {
      const k = Math.min(v.k, todo, ...v.ings.map(g => Math.floor(left2(g.n) / g.req)));
      if(k > 0){ v.ings.forEach(g => take(g.n, g.req * k)); const en = entry(e.name); en.bank += k; addVer(en, v.ings, k); todo -= k; }
    });
  });
  goldCraft.forEach(gc => {
    const have0 = (craftQty.get(gc.name) || {bank:0}).bank, want = gc.k - have0; if(want <= 0) return;
    const k = Math.min(want, ...gc.ings.map(g => Math.floor(left2(g.n) / g.req)));
    if(k > 0){ gc.ings.forEach(g => take(g.n, g.req * k)); const en = entry(gc.name); en.bank += k; addVer(en, gc.ings, k); }
  });
  const craftMax = new Map(craftable.map(c => [c.name, c.copies]));
  // every recipe of a trove and how many copies the stock allows of each (a structure offers just one of them)
  const recipeCap = new Map([...byRecipe.entries()].map(([name, vs]) => [name, vs.map(v => ({ings:v.ings, cost:verCost(v), can:Math.min(...v.ings.map(g => Math.floor(have(g.n) / g.req)))})).sort((a, b) => a.cost - b.cost)]));
  const scarceOf = n => ({s:scarce(n), seen:hc.get(n) || 0});
  return {items, recs, blockers, rows, craftable, bulk, easy, bonusFor, gold, goldCraft, clash, craftQty, craftMax, nextQty, recipeCap, scarceOf, craftN:recs.filter(r => r.ok).length, oneShort, prot};
}

const levelName = l => l ? t(['', 'bronze', 'silver', 'gold'][l] || 'gold') : '—';
const placeList = (p, all) => {

function ensureCity(){
  if(!WORLD) return;
  const ok = WORLD.cities.some(c => c.kind === 'scan' && c.done && String(c.id) === String(CITY));
  if(!ok) CITY = String((WORLD.cities.find(c => c.id === 32) || WORLD.cities.find(c => c.kind === 'scan' && c.done) || {id:''}).id);
  loadCity(CITY);
}
// Buttons that open in Upland the properties of the chosen city that carry any of these structures, most structures first.
const spotMemo = new Map();
function spots(names, k){
  ensureCity();
  const cd = CITYDATA[CITY]; if(!cd) return cd === false ? [] : null;
  const key = CITY + '|' + names.join('|');
  if(!spotMemo.has(key)){
    const want = new Set(names.map(x => norm(x).replace(/ 1$/, ''))), sn = cd.structs.map(x => norm(x).replace(/ 1$/, '')), out = [];
    cd.props.forEach(pr => { const hit = new Set(pr[5].filter(i => want.has(sn[i]))); if(hit.size) out.push([pr, hit.size]); });
    // most of the wanted structures first, and among those the cheapest place to stand (a cheaper property within reach counts)
    const eff = pr => { const h = hop(pr[0]); return h ? h.fee : FEES && FEES[pr[0]] != null ? FEES[pr[0]] : 999; };
    out.sort((a, b) => b[1] - a[1] || eff(a[0]) - eff(b[0]));
    spotMemo.set(key, out.slice(0, 10).map(x => x[0]));
  }
  return spotMemo.get(key).slice(0, k);
}
const feeTxt = pid => { const h = hop(pid); return h ? ` · ${h.fee} UPX` + (h.was != null ? ` (${t('rcWas', {n:h.was, m:h.m})})` : '') : FEES && FEES[pid] != null ? ` · ${FEES[pid]} UPX` : ''; };
const selfBtn = pid => hop(pid) ? ` <a class="btn small" target="_blank" rel="noopener" data-pid="${pid}" href="${UPLAND(pid)}" title="${esc(t('cqSelf'))}">${esc(t('cqSelf'))} ↗</a>` : '';
const spotBtn = pr => `<a class="btn small" target="_blank" rel="noopener" data-pid="${pr[0]}" href="${go(pr[0])}">📍 ${esc(pr[1])}${feeTxt(pr[0])} ↗</a>${selfBtn(pr[0])}`;
function spotBtns(names, k = 3){

  if(!r.length) return `<span class="muted small">${esc(t('spNone'))}</span>`;

}

function sharedBox(){
  const names = EXTRA.length ? EXTRA : [];
  if(!names.length) return '';
  const body = JSON.stringify(names);

    g.el.parentNode.insertBefore(d, g.el);

    else { if(note) d.appendChild(note); g.el.remove(); g.body.forEach(b => d.appendChild(b)); }
  });
  if(groups.length >= 3){
    const bar = document.createElement('div'); bar.className = 'foldbar';
    bar.innerHTML = `<button type="button" data-fold-all="0">${esc(t('foCollapse'))}</button><button type="button" data-fold-all="1">${esc(t('foExpand'))}</button>` + [...root.querySelectorAll(':scope > details.fold')].map(d => `<a href="#${d.id}" data-fold-to="${d.id}">${esc(d.querySelector('summary').textContent.trim().replace(/\s+\d+$/, '').slice(0, 28))}</a>`).join('');
    root.insertBefore(bar, root.firstChild);
  }
}
document.addEventListener('click', e => { const sm = e.target.closest('details.fold > summary'); if(!sm) return; const d = sm.parentNode; setTimeout(() => { FOLD[d.dataset.fold] = d.open; store.set('rut:troves:fold', FOLD); }, 0); });
document.addEventListener('click', e => {
  const all = e.target.closest('[data-fold-all]'); if(all){ document.querySelectorAll('details.fold').forEach(d => { d.open = all.dataset.foldAll === '1'; }); return; }
  const to = e.target.closest('[data-fold-to]'); if(to){ e.preventDefault(); const d = document.getElementById(to.dataset.foldTo); if(d){ d.open = true; d.scrollIntoView({behavior:'smooth', block:'start'}); } }
});
function draw(){
  srcCard();
  const app = document.getElementById('app');
  if(!A){ app.innerHTML = `<div class="card muted" style="margin-top:12px">${esc(t('loading'))}</div>`; return; }
  const st = DATA.stamina;
  const kpi = (v, l) => `<div class="kpi"><div class="v">${v}</div><div class="l">${esc(l)}</div></div>`;
  const tabs = [['overview', '📋', t('tOverview'), ''], ['missing', '🔎', t('tMissing'), A.blockers.length], ['craft', '🛠', t('tCraft'), t('cTabN', {n:A.craftable.filter(c => c.isNew).length})], ['bank', '🏦', t('tBank'), t('eTabN', {n:A.easy.length})], ['cities', '🌍', t('tCities'), WORLD ? t('wScanned', {n:WORLD.cities.length}) : ''], ['find', '🧭', t('tFind'), '']].concat(HUNTS ? [['hunt', '📊', t('tHunt'), n0(HUNTS.finds.length)]] : []);
  const hide = {craft:!GOAL.discover && !GOAL.bank && !GOAL.bonus, bank:!GOAL.bank && !GOAL.bonus && !GOAL.gold};
  tab = {easy:'bank', gold:'bank', world:'cities', special:'cities'}[tab] || tab;
  for(let i = tabs.length - 1; i >= 0; i--) if(hide[tabs[i][0]]) tabs.splice(i, 1);
  if(!tabs.some(x => x[0] === tab)) tab = 'overview';
  const view = {overview:viewOverview, missing:viewMissing, craft:viewCraft, bank:viewBank, cities:viewCities, find:viewFind, hunt:viewHunt}[tab] || viewOverview;
  app.innerHTML = `<div class="kpis">${kpi(`${n0(DATA.troves.found)}${DATA.troves.max ? ' / ' + n0(DATA.troves.max) : ''}`, t('kFound'))}${kpi(n0(A.craftN), t('kCraft'))}${kpi(n0(A.oneShort), t('kOne'))}${kpi(n0(A.blockers.length), t('kBlock'))}${st ? kpi(`${n0(st.current)}${st.max ? ' / ' + n0(st.max) : ''}`, t('kStamina')) : ''}${kpi(esc(DATA.date || '—'), t('kDate'))}</div>
    <nav class="boxtabs" id="tabs">${tabs.map(([id, ic, name, ct]) => `<button type="button" class="boxtab ${tab === id ? 'on' : ''}" data-tab="${id}"><span class="ic" aria-hidden="true">${ic}</span><span class="nm">${esc(name)}</span><span class="ct">${esc(ct === '' ? '' : ct)}</span></button>`).join('')}</nav>
    <section>${view()}</section>`;
  foldify(app.querySelector('section'));
  paintCool();
}

// Opening a property starts a 60-minute timer on its button: troves can be searched there again an hour later.
// Opening a property also covers the structures within reach of where you stand, so the properties within 80 m of it count as done too.
function coolAround(pid){
  const cd = CITYDATA[CITY]; if(!NEIGH || !cd) return;
  const me = cd.props.find(p => String(p[0]) === String(pid)); if(!me) return;
  const h = hop(pid), lat = h && h.lat != null ? h.lat : me[2], lng = h && h.lng != null ? h.lng : me[3], now = Date.now(), c = Math.cos(lat * Math.PI / 180);
  cd.props.forEach(p => {
    if(Math.hypot((p[2] - lat) * 111320, (p[3] - lng) * 111320 * c) <= 80 && !(COOL[p[0]] && COOL[p[0]] + 36e5 > now)) COOL[p[0]] = now;
  });
}
function paintCool(){
  const now = Date.now();
  document.querySelectorAll('a[data-pid]').forEach(a => {
    const at = COOL[a.dataset.pid], left = at ? Math.ceil((at + 36e5 - now) / 6e4) : 0;
    let cd = a.querySelector('.cd');
    a.classList.toggle('cool', left > 0);
    if(left > 0){ if(!cd){ cd = document.createElement('span'); cd.className = 'cd'; a.appendChild(cd); } cd.textContent = ' ⏱ ' + t('coolLeft', {n:left}); }
    else if(cd) cd.remove();
  });
}
setInterval(paintCool, 30000);
document.addEventListener('click', e => {
  const mk = e.target.closest('[data-mark]'); if(mk){ const [st, n, i] = mk.dataset.mark.split('||'); const v = (A.recipeCap.get(n) || [])[Number(i)]; if(v){ const k = Object.keys(LOCALREC).find(x => norm(x) === norm(st)) || st; (LOCALREC[k] = LOCALREC[k] || {})[n] = v.ings.map(g => g.n); store.set('rut:troves:srec', LOCALREC); draw(); } return; }
  const um = e.target.closest('[data-unmark]'); if(um){ const [st, n] = um.dataset.unmark.split('||'); const k = Object.keys(LOCALREC).find(x => norm(x) === norm(st)); if(k){ delete LOCALREC[k][n]; if(!Object.keys(LOCALREC[k]).length) delete LOCALREC[k]; store.set('rut:troves:srec', LOCALREC); draw(); } return; }
  if(e.target.closest('#copyRec')){ const txt = JSON.stringify({structures:LOCALREC}); (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { e.target.textContent = t('cmCopied'); }).catch(() => { prompt(t('cmCopy'), txt); }); return; }
  const op = e.target.closest('a[data-pid]'); if(op){ coolAround(op.dataset.pid); COOL[op.dataset.pid] = Date.now(); LAST = op.dataset.pid; store.set('rut:troves:cool', COOL); store.set('rut:troves:last', LAST); setTimeout(paintCool, 50); }
  if(e.target.closest('#clearCool')){ COOL = {}; store.set('rut:troves:cool', COOL); paintCool(); return; }
  const go = e.target.closest('[data-go]'); if(go){ e.preventDefault(); tab = go.dataset.go; store.set('rut:troves:tab', tab); draw(); window.scrollTo({top:0, behavior:'smooth'}); return; }
  const gc = e.target.closest('[data-gocity]'); if(gc){ CITY = gc.dataset.gocity; store.set('rut:troves:city', CITY); HOOD = -1; tab = 'gold'; store.set('rut:troves:tab', tab); draw(); window.scrollTo({top:0, behavior:'smooth'}); return; }
  const tp = e.target.closest('[data-trip]'); if(tp){
    const [a, b] = tp.dataset.trip.split(':'), l = tripList().slice(), i = Number(b);
    if(a === 'up' && i > 0) [l[i - 1], l[i]] = [l[i], l[i - 1]]; else if(a === 'rm') l.splice(i, 1);
    TRIP = a === 'reset' || !l.length ? null : l; store.set('rut:troves:trip', TRIP); draw(); return;
  }
  const pm = e.target.closest('[data-plan]'); if(pm){ const [k, v] = pm.dataset.plan.split(':'); PLAN[k] = v; savePlan(); draw(); return; }
  const pg = e.target.closest('[data-plango]'); if(pg){ VGOAL = 'plan'; store.set('rut:troves:vgoal', VGOAL); tab = 'missing'; store.set('rut:troves:tab', tab); draw(); window.scrollTo({top:0, behavior:'smooth'}); return; }
  const vg = e.target.closest('[data-vgoal]'); if(vg){ VGOAL = vg.dataset.vgoal; store.set('rut:troves:vgoal', VGOAL); draw(); return; }
  const vs = e.target.closest('[data-vsort]'); if(vs){ VSORT = vs.dataset.vsort; store.set('rut:troves:vsort', VSORT); draw(); return; }
  const hd = e.target.closest('[data-hood]'); if(hd){ HOOD = Number(hd.dataset.hood); draw(); return; }
  const cp = e.target.closest('[data-copy]'); if(cp){ try{ navigator.clipboard.writeText(cp.dataset.copy); cp.textContent = t('xDone'); }catch{} return; }
  if(e.target.closest('#copyNew')){ try{ navigator.clipboard.writeText(JSON.stringify(EXTRA)); e.target.textContent = t('xDone'); }catch{} return; }
  const b = e.target.closest('[data-tab]'); if(b){ tab = b.dataset.tab; store.set('rut:troves:tab', tab); draw(); return; }
  const m = e.target.closest('[data-mode]'); if(m){ mode = m.dataset.mode; store.set('rut:troves:mode', mode); use(); draw(); return; }
  const s = e.target.closest('[data-src]'); if(s && !s.disabled){ SRC = s.dataset.src; store.set('rut:troves:src', SRC); use(); draw(); return; }
  if(e.target.closest('#dlclean') && MINE){ const text = JSON.stringify(MINE); if(TOKEN.test(text)) return; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:'application/json'})); a.download = 'trove_balance-' + (MINE.date || new Date().toISOString().slice(0, 10)) + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); return; }
  if(e.target.closest('#forget')){ MINE = null; try{ localStorage.removeItem(MINE_KEY); }catch{} SRC = 'rock'; store.set('rut:troves:src', SRC); STATUS = ''; use(); draw(); }
});
document.addEventListener('toggle', e => { const d = e.target; if(d && d.dataset && d.dataset.sp){ SPOPEN[d.dataset.sp] = d.open; store.set('rut:troves:spOpen', SPOPEN); } }, true);
document.addEventListener('change', e => {
  if(e.target.id === 'file') takeFile(e.target.files[0]);
  const gk = {'g-bank':'bank', 'g-bonus':'bonus', 'g-discover':'discover', 'g-gold':'gold'}[e.target.id]; if(gk){ GOAL[gk] = e.target.checked; store.set('rut:troves:goal', GOAL); draw(); return; }
  if(e.target.id === 'bonusT'){ BONUS_T = Math.max(1, Math.min(500, Math.round(Number(e.target.value)) || 20)); store.set('rut:troves:bonusT', BONUS_T); draw(); return; }
  if(e.target.id === 'neigh'){ NEIGH = e.target.checked; store.set('rut:troves:neigh', NEIGH); return; }
  if(e.target.id === 'reachm'){ REACHM = Number(e.target.value); store.set('rut:troves:reachm', REACHM); spotMemo.clear(); draw(); return; }
  if(e.target.id === 'planN'){ PLAN.n = Math.max(1, Math.round(Number(e.target.value)) || 60); savePlan(); draw(); return; }
  if(e.target.id === 'planReserve'){ PLAN.reserve = e.target.checked; savePlan(); draw(); return; }
  if(e.target.id === 'planFam'){ PLAN.fam = e.target.value; PLAN.rec = ''; savePlan(); draw(); return; }
  if(e.target.id === 'planRec'){ PLAN.rec = e.target.value; savePlan(); draw(); return; }
  if(e.target.id === 'planT'){ BONUS_T = Math.max(1, Math.min(500, Math.round(Number(e.target.value)) || 20)); store.set('rut:troves:bonusT', BONUS_T); PLANV++; draw(); return; }
  if(e.target.id === 'tripadd'){ if(e.target.value){ TRIP = tripList().concat(e.target.value); store.set('rut:troves:trip', TRIP); draw(); } return; }
  if(e.target.id === 'cityq'){ CITY = e.target.value; store.set('rut:troves:city', CITY); HOOD = -1; draw(); return; }
  if(e.target.id === 'city'){ CITY = e.target.value; store.set('rut:troves:city', CITY); HOOD = -1; draw(); }
  if(e.target.id === 'radius'){ RADIUS = e.target.checked; store.set('rut:troves:radius', RADIUS); draw(); return; }
  if(e.target.id === 'target'){ TARGET = e.target.value; draw(); }
  if(e.target.id === 'onlyMine'){ onlyMine = e.target.checked; store.set('rut:troves:onlyMine', onlyMine); draw(); }
});
document.addEventListener('input', e => {
  if(e.target.id === 'q'){ query = e.target.value; const pos = e.target.selectionStart; draw(); const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos); }
});
['dragover', 'dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest && e.target.closest('#drop'); if(!z) return;
  e.preventDefault(); z.classList.toggle('over', ev === 'dragover');
  if(ev === 'drop') takeFile(e.dataTransfer.files[0]);
}));

let ROCK = null;
async function boot(){
  Site.mount({onChange:draw});
  try{ MINE = store.get(MINE_KEY, null); if(MINE){ const r = readText(JSON.stringify(MINE)); MINE = r.data || null; } }catch{ MINE = null; }
  if(SRC === 'mine' && !MINE) SRC = 'rock';
  draw();
  try{
    const [p, r] = await Promise.all([fetch('../data/troves/places.json').then(x => x.json()), fetch('../data/troves/rockdrigo/latest.json').then(x => x.json())]);
    PLACES = new Map(p.troves.map(([name, cat, structures, plants, craftAt, bonus]) => [name, {cat, structures, plants, craftAt, bonus:bonus || []}]));
    ROCK = checkShape(r);
  }catch(e){ document.getElementById('app').innerHTML = `<div class="card status err">${esc(String(e))}</div>`; return; }
  try{ IMG = await fetch('../data/troves/images.json').then(x => x.ok ? x.json() : null); }catch{ IMG = null; }
  try{ WIB = await fetch('../data/troves/wibenji.json').then(x => x.ok ? x.json() : null); }catch{ WIB = null; }
  try{
    const [m, g] = await Promise.all(['master.json', 'up2-suggestions.json'].map(f => fetch('../data/structures/' + f).then(x => x.ok ? x.json() : null).catch(() => null)));
    ((m || {}).structures || []).forEach(x => { if(x.up2) SIZE.set(x.name.trim().toLowerCase(), {up2:x.up2}); });
    Object.values((g || {}).structures || {}).forEach(x => { const k = x.name.trim().toLowerCase(); if(!SIZE.has(k)) SIZE.set(k, {sug:x.min}); });
  }catch{}
  try{ const o = await fetch('../data/structures/players/rockdrigo.json').then(x => x.ok ? x.json() : null); OWN = o ? o.rows : null; }catch{ OWN = null; }
  try{ const f = await fetch('../data/troves/fees.json').then(x => x.ok ? x.json() : null); FEES = f ? f.fees : null; }catch{ FEES = null; }
  try{ SPECIAL = await fetch('../data/troves/city-specific.json').then(x => x.ok ? x.json() : null); }catch{ SPECIAL = null; }
  try{ RESULTS = await fetch('../data/troves/special-results.json').then(x => x.ok ? x.json() : null); }catch{ RESULTS = null; }
  try{ SREC = await fetch('../data/troves/structure-recipes.json').then(x => x.ok ? x.json() : null); }catch{ SREC = null; }
  try{ STIMG = await fetch('../data/structures/images.json').then(x => x.ok ? x.json() : null); }catch{ STIMG = null; }
  try{ REACH = await fetch('../data/troves/reach-best.json').then(x => x.ok ? x.json() : null); }catch{ REACH = null; }
  try{ HARDF = await fetch('../data/helper/hard.json').then(x => x.ok ? x.json() : null); }catch{ HARDF = null; }
  try{ HUNTS = await fetch('../data/troves/rockdrigo/hunts.json').then(x => x.ok ? x.json() : null); }catch{ HUNTS = null; }
  try{ WORLD = await fetch('../data/troves/world.json').then(x => x.ok ? x.json() : null); }catch{ WORLD = null; }
  use(); draw();
}
boot();
