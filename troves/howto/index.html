<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to get your troves file</title>
<meta name="description" content="How to turn your Upland Troves page into a small, token-free file you can load into Rockdrigo's Troves.">
<link rel="stylesheet" href="../../shared/theme.css">
<style>
ol.steps{padding-left:1.2rem;display:grid;gap:14px}
ol.steps li{padding-left:4px}
code,pre{background:var(--surface-2);border-radius:6px;font-size:.8125rem}
code{padding:1px 5px}
pre{padding:10px 12px;overflow-x:auto;margin:6px 0}
.dl{margin:8px 0 2px}
.safe{border-left:5px solid var(--accent)}
.safe h2{margin-top:0}
</style>
</head>
<body>
<div class="wrap">
  <header id="site-header"></header>
  <main>
    <p><a href="../">← Back to Rockdrigo’s Troves</a></p>
    <section class="card">
      <h2 data-i="h">How to get your troves file</h2>
      <p data-i="intro"></p>
    </section>
    <section class="card" style="margin-top:12px">
      <ol class="steps">
        <li id="s1"></li><li id="s2"></li><li id="s3"></li><li id="s4"></li>
      </ol>
    </section>
    <section class="card safe" style="margin-top:12px">
      <h2 data-i="safeH">Is this safe?</h2>
      <ul id="safe"></ul>
    </section>
  </main>
  <footer id="site-footer"></footer>
</div>
<script src="../../shared/site.js"></script>
<script>
"use strict";
const {t, esc} = Site;
Site.register({
  en:{
    title:'Rockdrigo’s Troves: your file', subtitle:'Save your Troves page as a HAR file and drop it on the Troves page.',
    h:'How to get your troves in',
    intro:'The Troves page can’t read your inventory from Upland for you, so you save it from your own browser and drop it on the page. It takes about two minutes and works on a computer (a phone can’t record it).',
    s1:'<b>Open your Troves page in Upland</b> in your browser, then open the developer tools: <code>Safari:</code> Develop → Show Web Inspector (turn on the Develop menu in Safari Settings → Advanced first). <code>Chrome, Brave or Edge:</code> press F12 (or Cmd+Option+I on a Mac). Click the <b>Network</b> tab.',
    s2:'<b>Reload the page</b> with the Network tab open, and wait for your troves to appear.',
    s3:'<b>Save what the tab recorded as a HAR file:</b> <code>Safari:</code> the Export button at the top right of the Network tab. <code>Chrome, Brave or Edge:</code> the download arrow (“Export HAR”).',
    s4:'<b>Drop the HAR file</b> on the box at the top of <a href="../">Rockdrigo’s Troves</a>. It shows what to find first, what you can craft and what to bank.',
    safeH:'What happens to my file?',
    safe1:'A HAR is a recording of your whole browser session, and it includes your Upland login. <b>Never send a HAR to anyone, and delete it when you are done.</b>',
    safe2:'The Troves page reads the HAR inside your browser. It takes out only your trove names, how many you hold, your banking levels and your discovered recipes, and throws the rest away. The HAR is never uploaded and never stored.',
    safe3:'What the page remembers in your browser, so it is there next time, is only that short list. “Forget my file” on the page removes it.',
    safe4:'The page has no server and sends nothing anywhere. You can check with your browser’s Network tab while you drop the file.'
  },
  es:{
    title:'Los Troves de Rockdrigo: tu archivo', subtitle:'Guarda tu página de Troves como archivo HAR y suéltalo en la página de Troves.',
    h:'Cómo meter tus troves',
    intro:'La página de Troves no puede leer tu inventario de Upland por ti, así que lo guardas desde tu navegador y lo sueltas en la página. Toma unos dos minutos y funciona en una computadora (un teléfono no puede grabarlo).',
    s1:'<b>Abre tu página de Troves en Upland</b> en el navegador y abre las herramientas de desarrollo: <code>Safari:</code> Desarrollo → Mostrar inspector web (activa antes el menú Desarrollo en Ajustes de Safari → Avanzado). <code>Chrome, Brave o Edge:</code> F12 (o Cmd+Opción+I en Mac). Haz clic en la pestaña <b>Network</b> (Red).',
    s2:'<b>Recarga la página</b> con la pestaña Network abierta y espera a que aparezcan tus troves.',
    s3:'<b>Guarda lo que grabó la pestaña como archivo HAR:</b> <code>Safari:</code> el botón Exportar arriba a la derecha de Network. <code>Chrome, Brave o Edge:</code> la flecha de descarga (“Export HAR”).',
    s4:'<b>Suelta el archivo HAR</b> en la caja de arriba de <a href="../">Los Troves de Rockdrigo</a>. Te muestra qué buscar primero, qué puedes craftear y qué mandar al banco.',
    safeH:'¿Qué pasa con mi archivo?',
    safe1:'Un HAR es una grabación de toda tu sesión del navegador e incluye tu sesión de Upland. <b>Nunca mandes un HAR a nadie y bórralo cuando termines.</b>',
    safe2:'La página de Troves lee el HAR dentro de tu navegador. Saca solo los nombres de tus troves, cuántos tienes, tus niveles de banco y tus recetas descubiertas, y tira el resto. El HAR nunca se sube ni se guarda.',
    safe3:'Lo que la página recuerda en tu navegador, para la próxima vez, es solo esa lista corta. “Olvidar mi archivo” en la página la quita.',
    safe4:'La página no tiene servidor y no manda nada a ningún lado. Puedes comprobarlo con la pestaña Network de tu navegador mientras sueltas el archivo.'
  }
});
function draw(){
  ['s1', 's2', 's3', 's4'].forEach(k => document.getElementById(k).innerHTML = t(k));
  document.getElementById('safe').innerHTML = [1, 2, 3, 4].map(i => `<li>${t('safe' + i)}</li>`).join('');
  document.querySelectorAll('[data-i]').forEach(el => { const v = t(el.dataset.i); if(v !== el.dataset.i) el.textContent = v; });
}
Site.mount({onChange:draw});
draw();
</script>
</body>
</html>
