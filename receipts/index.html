<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rockdrigo’s Receipts</title>
<meta name="description" content="What a player has sold on Upland, by week, month, year and all time, by asset type.">
<link rel="stylesheet" href="../shared/theme.css">
<style>
.bars{width:100%;max-width:560px;height:auto;display:block;margin:6px 0}
.bars rect{fill:var(--accent)}
.bars text{fill:var(--muted);font-size:9px}
.share{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:60px}
.share i{display:block;height:100%;background:var(--accent)}
.period{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.period .label{font-weight:700;min-width:9em;text-align:center}
td a{white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header id="site-header"></header>
  <section class="card">
    <div class="row" style="gap:10px;flex-wrap:wrap">
      <label class="small row" style="gap:6px"><span data-i="who"></span> <select id="who"></select></label>
    </div>
    <div class="status" id="status"></div>
  </section>
  <main id="app" class="hidden">
    <nav class="tabs" id="roles"></nav>
    <div class="chips" id="kinds"></div>
    <div class="period" id="period"></div>
    <div class="kpis" id="kpis"></div>
    <section id="panel"></section>
  </main>
  <footer id="site-footer"></footer>
</div>
<script src="../shared/site.js"></script>
<script src="../shared/upland.js"></script>
<script>
"use strict";
const {t, esc, store} = Site;
const $ = s => document.querySelector(s);

Site.register({
  en:{
    title:'Rockdrigo’s Receipts', subtitle:'What you’ve sold, by week, month, year and all time, and what kind of thing it was.',
    who:'Player:', everyone:'Everyone in the group', loading:'Reading the receipts…', errLoad:'The sales data isn’t available yet. It’s collected every 12 hours from Upland’s public chain history.',
    notTracked:'{u} isn’t tracked yet. Only the group’s players are.',
    covers:'Sales from {a} to {b}. Older history arrives about 10 days at a time, back to April 2025. Only UPX sales are tracked: USD sales leave no price on the chain.', updated:'Last updated {t}.',
    rSold:'Sold', rBought:'Bought', rShop:'Shop fees earned',
    pWeek:'Week', pMonth:'Month', pYear:'Year', pAll:'All time', allKinds:'All asset types',
    kSales:'Sales', kGross:'Sold for', kFees:'Upland and shop fees', kNet:'You received', kAvg:'Average sale', kBest:'Biggest sale',
    kPaid:'Spent', kBought:'Purchases', kFeeIncome:'Fees earned', kFeeSales:'Sales in your shops', none:'Nothing in this period.',
    byKind:'By asset type', byMonth:'Month by month', top:'Best sellers', recent:'Latest sales', colKind:'Asset type', colSales:'Sales', colGross:'Sold for', colNet:'Received', colAvg:'Average', colShare:'Share', colMonth:'Month',
    colWhen:'When', colItem:'Item', colMint:'Mint', colPrice:'Price', colNet2:'Received', colBuyer:'Buyer', colSeller:'Seller', colPlayer:'Player', colCount:'Count', colTotal:'Total', viewNft:'NFT',
    prev:'Previous', next:'Next', thisWeek:'This week', thisMonth:'This month', thisYear:'This year', weekOf:'Week of {d}', allTime:'All time', bucketLegend:'UPX received per {u}',
    foot:'Sales come from Upland’s public chain history, updated every 12 hours.'
  },
  es:{
    title:'Los Recibos de Rockdrigo', subtitle:'Lo que has vendido, por semana, mes, año y en total, y de qué tipo era.',
    who:'Jugador:', everyone:'Todos en el grupo', loading:'Leyendo los recibos…', errLoad:'Los datos de ventas todavía no están disponibles. Se recolectan cada 12 horas del historial público de la cadena de Upland.',
    notTracked:'{u} todavía no está en el seguimiento. Solo los jugadores del grupo.',
    covers:'Ventas de {a} a {b}. El historial anterior llega unos 10 días a la vez, hasta abril de 2025. Solo se registran ventas en UPX: las ventas en USD no dejan precio en la cadena.', updated:'Última actualización {t}.',
    rSold:'Vendido', rBought:'Comprado', rShop:'Comisiones de tienda',
    pWeek:'Semana', pMonth:'Mes', pYear:'Año', pAll:'Todo', allKinds:'Todos los tipos de activo',
    kSales:'Ventas', kGross:'Vendido por', kFees:'Comisiones de Upland y tienda', kNet:'Recibiste', kAvg:'Venta promedio', kBest:'Mayor venta',
    kPaid:'Gastaste', kBought:'Compras', kFeeIncome:'Comisiones ganadas', kFeeSales:'Ventas en tus tiendas', none:'Nada en este periodo.',
    byKind:'Por tipo de activo', byMonth:'Mes por mes', top:'Lo más vendido', recent:'Últimas ventas', colKind:'Tipo de activo', colSales:'Ventas', colGross:'Vendido por', colNet:'Recibido', colAvg:'Promedio', colShare:'Parte', colMonth:'Mes',
    colWhen:'Cuándo', colItem:'Artículo', colMint:'Mint', colPrice:'Precio', colNet2:'Recibido', colBuyer:'Comprador', colSeller:'Vendedor', colPlayer:'Jugador', colCount:'Cantidad', colTotal:'Total', viewNft:'NFT',
    prev:'Anterior', next:'Siguiente', thisWeek:'Esta semana', thisMonth:'Este mes', thisYear:'Este año', weekOf:'Semana del {d}', allTime:'Todo el historial', bucketLegend:'UPX recibidos por {u}',
    foot:'Las ventas vienen del historial público de la cadena de Upland, actualizado cada 12 horas.'
  },
  en_cunk:{
    title:'Rockdrigo’s Receipts: A History of Selling Things', subtitle:'Since the invention of trade, people have wondered what they sold. Now you can know, which is worse.',
    loading:'Counting the money…', rSold:'Things you let go of', rBought:'Things you acquired', rShop:'Money for doing nothing', notTracked:'{u} isn’t being watched yet. Only the group is, which is flattering.',
    kNet:'What actually reached you', none:'Nothing. A quiet period. Possibly a nap.', byKind:'What kind of thing', top:'The things people wanted', recent:'The most recent betrayals of inventory'
  },
  es_cunk:{
    title:'Los Recibos de Rockdrigo: una historia de vender cosas', subtitle:'Desde que se inventó el comercio, la gente se pregunta qué vendió. Ahora puedes saberlo, que es peor.',
    loading:'Contando el dinero…', rSold:'Cosas de las que te desprendiste', rBought:'Cosas que adquiriste', rShop:'Dinero por no hacer nada', notTracked:'A {u} todavía no lo vigilamos. Solo al grupo, lo cual es halagador.',
    kNet:'Lo que de verdad te llegó', none:'Nada. Un periodo tranquilo. Posiblemente una siesta.', byKind:'Qué tipo de cosa', top:'Las cosas que la gente quiso', recent:'Las traiciones más recientes al inventario'
  }
});

// ---------- data ----------
let S = null, ROWS = [], NAMES = {}, MEMBERS = {};
const ui = {who: '', role: store.get('rc:role', 'sold'), kind: 'all', period: store.get('rc:period', 'month'), offset: 0};

async function load(){
  const v = Date.now();
  S = await Upland.getJSON('../data/ledger/state.json?t=' + v);
  const [m, n] = await Promise.all([Upland.getJSON('../data/ledger/members.json?t=' + v), Upland.getJSON('../data/ledger/names.json?t=' + v).catch(() => ({}))]);
  MEMBERS = m.users || {}; NAMES = n;
  const a = new Date(S.from + 'Z'), b = new Date(S.to + 'Z'), months = [];
  for(let d = new Date(Date.UTC(a.getUTCFullYear(), a.getUTCMonth(), 1)); d <= b; d.setUTCMonth(d.getUTCMonth() + 1)) months.push(d.toISOString().slice(0, 7));
  const files = await Promise.all(months.map(mo => Upland.getJSON(`../data/ledger/${mo}.json?t=${v}`).then(x => x.rows).catch(() => [])));
  ROWS = files.flat();
}

// ---------- helpers ----------
const n0 = x => Math.round(x).toLocaleString(Site.locale());
const upx = x => n0(x) + ' UPX';
const who = acct => NAMES[acct] || acct || '–';
const accts = () => ui.who === '*' ? new Set(Object.values(MEMBERS)) : new Set([MEMBERS[ui.who]]);
const val = r => ui.role === 'sold' ? r[6] - r[7] - r[8] : ui.role === 'bought' ? r[6] : r[8];
function mine(){
  const A = accts(), col = ui.role === 'sold' ? 9 : ui.role === 'bought' ? 10 : 11;
  return ROWS.filter(r => A.has(r[col]) && (ui.role !== 'shop' || r[8] > 0));
}
function range(){
  const now = new Date(), day = new Date(now.getFullYear(), now.getMonth(), now.getDate()); let a, b, label;
  const f = (d, o) => d.toLocaleDateString(Site.locale(), o);
  if(ui.period === 'week'){ a = new Date(day); a.setDate(day.getDate() - ((day.getDay() + 6) % 7) + ui.offset * 7); b = new Date(a); b.setDate(a.getDate() + 7);
    label = ui.offset === 0 ? t('thisWeek') : t('weekOf', {d: f(a, {month:'short', day:'numeric'})}); }
  else if(ui.period === 'month'){ a = new Date(now.getFullYear(), now.getMonth() + ui.offset, 1); b = new Date(a.getFullYear(), a.getMonth() + 1, 1);
    label = ui.offset === 0 ? t('thisMonth') : f(a, {month:'long', year:'numeric'}); }
  else if(ui.period === 'year'){ a = new Date(now.getFullYear() + ui.offset, 0, 1); b = new Date(a.getFullYear() + 1, 0, 1); label = ui.offset === 0 ? t('thisYear') : String(a.getFullYear()); }
  else { a = new Date(Date.parse(S.from + 'Z')); b = new Date(now.getTime() + 864e5); label = t('allTime'); }
  return {a: a.getTime() / 1000, b: b.getTime() / 1000, label, A: a, B: b};
}

function bars(rows, R){
  // Buckets: days for a week or month, months for a year or all time.
  const byDay = ui.period === 'week' || ui.period === 'month';
  const buckets = [], idx = new Map();
  const key = d => byDay ? `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}` : `${d.getFullYear()}-${d.getMonth()}`;
  for(let d = new Date(R.A.getFullYear(), R.A.getMonth(), byDay ? R.A.getDate() : 1); d < R.B && buckets.length < 400; byDay ? d.setDate(d.getDate() + 1) : d.setMonth(d.getMonth() + 1)){
    const dd = new Date(d); idx.set(key(dd), buckets.length);
    buckets.push({d: dd, v: 0, label: byDay ? String(dd.getDate()) : dd.toLocaleDateString(Site.locale(), {month:'short'})});
  }
  for(const r of rows){ const i = idx.get(key(new Date(r[0] * 1000))); if(i != null) buckets[i].v += val(r); }
  if(buckets.length < 2 || !buckets.some(b => b.v > 0)) return '';
  const W = 560, H = 120, P = 16, max = Math.max(...buckets.map(b => b.v)), bw = (W - 2 * P) / buckets.length;
  const every = Math.ceil(buckets.length / 14);
  return `<svg viewBox="0 0 ${W} ${H}" class="bars" role="img">${buckets.map((b, i) => { const h = Math.max(b.v ? 2 : 0, (H - 2 * P - 10) * b.v / max), x = P + i * bw;
      return `<g><title>${esc(b.d.toLocaleDateString(Site.locale()))}: ${esc(upx(b.v))}</title><rect x="${(x + 1).toFixed(1)}" y="${(H - P - h).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5"/>${i % every === 0 ? `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle">${esc(b.label)}</text>` : ''}</g>`; }).join('')}</svg>
    <div class="small muted">${esc(t('bucketLegend', {u: byDay ? 'day' : 'month'}))} · max ${esc(upx(max))}</div>`;
}

const nftLink = r => r[3] === 'Structure Ornament' ? `<a target="_blank" rel="noopener" href="https://play.upland.me/nft/structure-ornaments/${r[2]}">${esc(t('viewNft'))} ↗</a>` : '';

// ---------- render ----------
function render(){
  if(!S) return;
  const R = range();
  const all = mine();
  const kinds = [...new Set(all.map(r => r[3]))].sort();
  const inR = all.filter(r => r[0] >= R.a && r[0] < R.b);
  const rows = inR.filter(r => ui.kind === 'all' || r[3] === ui.kind);

  $('#roles').innerHTML = [['sold', 'rSold'], ['bought', 'rBought'], ['shop', 'rShop']].map(([k, l]) => `<button data-role="${k}" class="${ui.role === k ? 'on' : ''}">${esc(t(l))}</button>`).join('');
  $('#kinds').innerHTML = [['all', t('allKinds')], ...kinds.map(k => [k, k])].map(([k, l]) => `<button class="chip${ui.kind === k ? ' on' : ''}" data-kind="${esc(k)}">${esc(l)}</button>`).join('');
  $('#period').innerHTML = `<div class="seg">${[['week', 'pWeek'], ['month', 'pMonth'], ['year', 'pYear'], ['all', 'pAll']].map(([k, l]) => `<button data-period="${k}" class="${ui.period === k ? 'on' : ''}">${esc(t(l))}</button>`).join('')}</div>
    ${ui.period === 'all' ? '' : `<button class="btn small" data-step="-1">‹ ${esc(t('prev'))}</button><span class="label">${esc(R.label)}</span><button class="btn small" data-step="1"${ui.offset >= 0 ? ' disabled' : ''}>${esc(t('next'))} ›</button>`}`;

  const gross = rows.reduce((a, r) => a + r[6], 0), fees = rows.reduce((a, r) => a + r[7] + r[8], 0), net = rows.reduce((a, r) => a + (r[6] - r[7] - r[8]), 0), shop = rows.reduce((a, r) => a + r[8], 0);
  const best = rows.slice().sort((a, b) => val(b) - val(a))[0];
  const kp = ui.role === 'sold' ? [[n0(rows.length), t('kSales')], [upx(gross), t('kGross')], [upx(fees), t('kFees')], [upx(net), t('kNet')], [rows.length ? upx(net / rows.length) : '–', t('kAvg')], [best ? `${upx(val(best))} · ${best.at ? '' : ''}${best[4]}` : '–', t('kBest')]]
    : ui.role === 'bought' ? [[n0(rows.length), t('kBought')], [upx(gross), t('kPaid')], [rows.length ? upx(gross / rows.length) : '–', t('kAvg')], [best ? `${upx(best[6])} · ${best[4]}` : '–', t('kBest')]]
    : [[n0(rows.length), t('kFeeSales')], [upx(shop), t('kFeeIncome')]];
  $('#kpis').innerHTML = kp.map(([v, l]) => `<div class="kpi"><div class="v" style="font-size:${String(v).length > 22 ? '1rem' : ''}">${esc(v)}</div><div class="l">${esc(l)}</div></div>`).join('');

  if(!rows.length){ $('#panel').innerHTML = `<div class="card empty">${esc(t('none'))}</div>${coverage()}`; return; }

  // by asset type
  const byKind = new Map();
  for(const r of rows){ const k = byKind.get(r[3]) || byKind.set(r[3], {n:0, gross:0, v:0}).get(r[3]); k.n++; k.gross += r[6]; k.v += val(r); }
  const total = rows.reduce((a, r) => a + val(r), 0) || 1;
  const kindRows = [...byKind].sort((a, b) => b[1].v - a[1].v).map(([k, x]) => `<tr><td>${esc(k)}</td><td class="num">${n0(x.n)}</td><td class="num">${n0(x.gross)}</td><td class="num">${n0(x.v)}</td><td class="num">${n0(x.v / x.n)}</td><td><div class="share"><i style="width:${(x.v * 100 / total).toFixed(1)}%"></i></div></td></tr>`).join('');
  // best sellers
  const items = new Map();
  for(const r of rows){ const k = r[3] + '|' + r[4]; const x = items.get(k) || items.set(k, {kind:r[3], name:r[4], n:0, v:0}).get(k); x.n++; x.v += val(r); }
  const topRows = [...items.values()].sort((a, b) => b.v - a.v).slice(0, 15).map(x => `<tr><td>${esc(x.name)} <span class="muted small">${esc(x.kind)}</span></td><td class="num">${n0(x.n)}</td><td class="num">${n0(x.v)}</td></tr>`).join('');
  // month by month (for the longer views)
  let monthly = '';
  if(ui.period === 'year' || ui.period === 'all'){
    const m = new Map();
    for(const r of rows){ const k = new Date(r[0] * 1000).toISOString().slice(0, 7); const x = m.get(k) || m.set(k, {n:0, v:0}).get(k); x.n++; x.v += val(r); }
    monthly = `<h2 style="margin-top:18px">${esc(t('byMonth'))}</h2><div class="tablewrap"><table><thead><tr><th>${esc(t('colMonth'))}</th><th class="num">${esc(t('colSales'))}</th><th class="num">${esc(t('colTotal'))}</th></tr></thead><tbody>
      ${[...m].sort((a, b) => b[0].localeCompare(a[0])).map(([k, x]) => `<tr><td>${esc(k)}</td><td class="num">${n0(x.n)}</td><td class="num">${n0(x.v)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  const recent = rows.slice().sort((a, b) => b[0] - a[0]).slice(0, 60).map(r => `<tr><td>${esc(new Date(r[0] * 1000).toLocaleString(Site.locale(), {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}))}</td>
    <td>${esc(r[4])} <span class="muted small">${esc(r[3])}</span></td><td class="num">${r[5] ? '#' + esc(r[5]) : ''}</td><td class="num">${n0(ui.role === 'sold' ? r[6] : val(r))}</td>
    <td>${esc(ui.role === 'bought' ? who(r[9]) : who(r[10]))}</td><td>${nftLink(r)}</td></tr>`).join('');
  $('#panel').innerHTML = `${bars(rows, R)}
    <h2 style="margin-top:14px">${esc(t('byKind'))}</h2><div class="tablewrap"><table><thead><tr><th>${esc(t('colKind'))}</th><th class="num">${esc(t('colSales'))}</th><th class="num">${esc(t('colGross'))}</th><th class="num">${esc(t('colNet'))}</th><th class="num">${esc(t('colAvg'))}</th><th>${esc(t('colShare'))}</th></tr></thead><tbody>${kindRows}</tbody></table></div>
    ${monthly}
    <h2 style="margin-top:18px">${esc(t('top'))}</h2><div class="tablewrap"><table><thead><tr><th>${esc(t('colItem'))}</th><th class="num">${esc(t('colCount'))}</th><th class="num">${esc(t('colTotal'))}</th></tr></thead><tbody>${topRows}</tbody></table></div>
    <h2 style="margin-top:18px">${esc(t('recent'))}</h2><div class="tablewrap"><table><thead><tr><th>${esc(t('colWhen'))}</th><th>${esc(t('colItem'))}</th><th class="num">${esc(t('colMint'))}</th><th class="num">${esc(ui.role === 'sold' ? t('colPrice') : t('colNet2'))}</th><th>${esc(ui.role === 'bought' ? t('colSeller') : t('colBuyer'))}</th><th></th></tr></thead><tbody>${recent}</tbody></table></div>${coverage()}`;
}
function coverage(){
  const f = x => new Date(x + 'Z').toLocaleDateString(Site.locale(), {year:'numeric', month:'short', day:'numeric'});
  return `<p class="note" style="margin-top:16px">${esc(t('covers', {a:f(S.from), b:f(S.to)}))} ${S.updatedAt ? esc(t('updated', {t:new Date(S.updatedAt).toLocaleString(Site.locale(), {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})})) : ''}</p>`;
}

// ---------- wiring ----------
function fillWho(){
  const names = Object.keys(MEMBERS);
  const sel = $('#who');
  sel.innerHTML = names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('') + `<option value="*">${esc(t('everyone'))}</option>`;
  const want = ui.who || Site.user().toLowerCase();
  ui.who = names.includes(want) || want === '*' ? want : names[0];
  sel.value = ui.who;
}
$('#who').addEventListener('change', e => { ui.who = e.target.value; ui.kind = 'all'; if(ui.who !== '*') Site.setUser(ui.who); render(); });
$('#roles').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; ui.role = b.dataset.role; ui.kind = 'all'; store.set('rc:role', ui.role); render(); });
$('#kinds').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; ui.kind = b.dataset.kind; render(); });
$('#period').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || b.disabled) return;
  if(b.dataset.period){ ui.period = b.dataset.period; ui.offset = 0; store.set('rc:period', ui.period); }
  if(b.dataset.step) ui.offset += Number(b.dataset.step);
  render();
});
Site.mount({onChange: () => { if(S){ fillWho(); render(); } }});
load().then(() => { fillWho(); $('#app').classList.remove('hidden'); $('#status').textContent = ''; render(); })
  .catch(() => { $('#status').textContent = t('errLoad'); $('#status').classList.add('err'); });
</script>
</body>
</html>
