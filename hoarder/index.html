<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rockdrigo’s Collection Hoarder</title>
<meta name="description" content="Upland collections: what you have and are missing, where each property should sit for the highest monthly yield, and what to borrow from friends.">
<link rel="stylesheet" href="../shared/theme.css">
<style>
:root{--r1:#2f5bd8;--r2:#7c3fc6;--r3:#e89400;--r4:#d9262c;--r5:#c9a800}
.rar{display:inline-block;font-size:.6875rem;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;background:var(--c);white-space:nowrap}
.coll{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--c);border-radius:10px;margin-bottom:8px}
.coll > summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px}
.coll > summary::-webkit-details-marker{display:none}
.coll .nm{font-weight:700;flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
.coll .gain{font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.coll .body{padding:0 12px 12px;overflow-wrap:anywhere;min-width:0}
.coll .body td,.coll .body th{overflow-wrap:normal;word-break:normal}
.coll{min-width:0;overflow:hidden}
.st{font-size:.75rem;border-radius:6px;padding:1px 7px;border:1px solid var(--border);white-space:nowrap}
.st.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.st.new{background:var(--Harvest);color:#fff;border-color:var(--Harvest)}
.req{font-size:.8125rem;color:var(--muted);margin:2px 0 8px}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent);width:0}
td a{white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header id="site-header"></header>
  <section class="card">
    <form class="row" id="userForm">
      <input type="text" id="username" data-i-ph="userPh" class="grow" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn primary" id="loadBtn" type="submit" data-i="load"></button>
    </form>
    <div class="row hidden" id="viewRow" style="margin-top:8px"><label class="small row" style="gap:6px"><span data-i="viewAs"></span> <select id="viewAs"></select></label></div>
    <div class="status" id="status"></div>
    <div class="progress hidden" id="progress"><i></i></div>
  </section>
  <main id="app" class="hidden">
    <div class="kpis" id="kpis"></div>
    <p class="note" data-i="estimateNote"></p>
    <nav class="tabs" id="tabs"></nav>
    <section id="panel"></section>
  </main>
  <footer id="site-footer"></footer>
</div>
<script src="../shared/site.js"></script>
<script src="../shared/upland.js"></script>

// ---------- data ----------
const CACHE_DAYS = 30;
function cachedProp(id){ const v = store.get('fl:p:' + id, null); return v && Date.now() - v.at < CACHE_DAYS * 864e5 ? v : null; }

const PAUSE = 1100;   // Upland tolerates about one request per second; faster gets the whole connection blocked
const wait = ms => new Promise(r => setTimeout(r, ms));
async function polite(fn){
  for(let i = 0; i < 4; i++){
    await wait(PAUSE);
    try{ return await fn(); }catch(e){ if(e.status === 404) return null; await wait(60000); }   // blocked: back off a minute
  }
  throw new Error('rate limited');
}
async function loadProperty(id){
  const hit = cachedProp(id);
  if(hit) return hit;
  const p = await polite(() => Upland.property(id));
  const m = await polite(() => Upland.propertyCollections(id));
  if(!p) return null;
  const v = {at:Date.now(), a:p.full_address, c:p.city && p.city.id, cn:p.city && p.city.name, s:p.street && p.street.id, st:p.state && p.state.name,
    y:p.yield_per_hour || 0, m:(m || []).map(x => x.id)};
  store.set('fl:p:' + id, v);
  return v;
}

// The group's data is collected on GitHub every 12 hours; anyone else is read live, politely.
async function precomputed(user){
  try{
    const st = await Upland.getJSON('../data/collections/state.json?t=' + Date.now());
    if(!(st.group || []).includes(user.toLowerCase())) return null;
    const v = encodeURIComponent(st.updatedAt);
    const [u, props, colls] = await Promise.all([Upland.getJSON(`../data/collections/users/${user.toLowerCase()}.json?v=${v}`),
      Upland.getJSON(`../data/collections/props.json?v=${v}`), Upland.getJSON(`../data/collections/collections.json?v=${v}`)]);
    for(const [id, p] of Object.entries(props)) if(!cachedProp(id)) store.set('fl:p:' + id, {...p, at: p.at * 1000});
    return {u, colls: colls.rows, st, v, props};
  }catch(e){ return null; }
}
// Every group member's properties, active and collected collections, plus their own best arrangement.
async function loadGroup(pre, user){
  const members = await Promise.all(pre.st.group.map(async m => {
    const u = m === user.toLowerCase() ? pre.u : await Upland.getJSON(`../data/collections/users/${m}.json?v=${pre.v}`).catch(() => null);
    if(!u) return null;
    const props = u.props.filter(id => pre.props[id]).map(id => ({id, ...pre.props[id], base: pre.props[id].y * MONTH}));
    const me = {user:m, props, colls:pre.colls, total:u.props.length, active:new Set(u.active), collected:new Set(u.collected)};
    me.ar = arrange(me);
    me.ar.where = new Map(me.ar.picks.flatMap(x => x.set.map(p => [p.id, x])));   // property → collection it holds up
    me.byColl = new Map();
    for(const p of props) for(const cid of p.m){ (me.byColl.get(cid) || me.byColl.set(cid, []).get(cid)).push(p); }
    return me;
  }));
  return members.filter(Boolean);
}
async function loadUser(user, progress, auto){
  progress(t('readingProfile', {u:user}), 0);
  const pre = await precomputed(user);
  if(!pre && auto) throw new Error('auto-skip');   // a remembered name only auto-loads for the group; others wait for the button
  let prof, colls;
  if(pre){ prof = {ids: pre.u.props, active: pre.u.active, collected: pre.u.collected}; colls = pre.colls; }
  else{
    const [p, c] = await Promise.all([Upland.profile(user), Upland.collections()]);
    prof = {ids: (p.properties || []).map(x => x.property_id), active: (p.collections || []).map(x => x.id), collected: (p.previouslyCompletedCollections || []).map(x => x.id)};
    colls = c;
  }
  // The group's missing properties arrive with later collector runs instead of being read live.
  const ids = pre ? prof.ids.filter(id => cachedProp(id)) : prof.ids, props = [];
  const todo = ids.filter(id => !cachedProp(id)).length;
  let done = 0, fetched = 0;
  for(const id of ids){
    const cached = cachedProp(id);
    const v = cached || await loadProperty(id);
    if(!cached){ fetched++; }
    done++;
    if(v) props.push({id, ...v, base: v.y * MONTH});
    if(!cached && (fetched % 5 === 0 || done === ids.length)){
      const mins = Math.ceil((todo - fetched) * 2 * PAUSE / 60000);
      progress(t('reading', {n:fetched, t:todo}) + (mins > 1 ? ' ' + t('eta', {m:mins}) : ''), fetched / Math.max(1, todo));
    }
  }
  const group = pre ? await loadGroup(pre, user) : null;
  return {user, props, colls, live: !pre, group, total: prof.ids.length, active: new Set(prof.active), collected: new Set(prof.collected)};
}

// ---------- optimizer ----------
// Countries for the "different countries" rule; US states fall back to "US".
const COUNTRY = {Rome:'IT', Florence:'IT', Paris:'FR', 'Saint Denis':'FR', London:'GB', Slough:'GB', Berlin:'DE', Madrid:'ES', Porto:'PT', 'Rio de Janeiro':'BR', 'Sao Paulo':'BR',
  Tokyo:'JP', 'Hong Kong':'HK', Sydney:'AU', Bermuda:'BM', Amsterdam:'NL', Medellin:'CO', 'Buenos Aires':'AR', 'Mexico City':'MX', Toronto:'CA', Vancouver:'CA', Lisbon:'PT', Barcelona:'ES', Dublin:'IE'};
const country = p => COUNTRY[p.cn] || (p.st && p.st.length === 2 ? 'US' : p.cn);
function ruleOf(req){
  const r = (req || '').toLowerCase();
  if(/same street/.test(r)) return {k:'same', key:p => p.s};
  if(/same city/.test(r)) return {k:'same', key:p => p.c};
  if(/different countries/.test(r)) return {k:'diff', key:country};
  if(/different .*cit/.test(r)) return {k:'diff', key:p => p.c};
  return {k:'any'};
}

// Best set of available properties for a collection, or null if it can't be filled.
function bestSet(c, elig, used){
  const pool = elig.filter(p => !used.has(p.id));
  if(pool.length < c.amount) return null;
  if(c.rule.k === 'any') return pool.slice(0, c.amount);
  if(c.rule.k === 'diff'){
    const seen = new Set(), out = [];
    for(const p of pool){ const k = c.rule.key(p); if(!seen.has(k)){ seen.add(k); out.push(p); if(out.length === c.amount) return out; } }
    return null;
  }
  let best = null, bestV = -1;
  const groups = new Map();
  for(const p of pool){ const k = c.rule.key(p); (groups.get(k) || groups.set(k, []).get(k)).push(p); }
  for(const g of groups.values()) if(g.length >= c.amount){ const s = g.slice(0, c.amount), v = s.reduce((a, p) => a + p.base, 0); if(v > bestV){ bestV = v; best = s; } }
  return best;
}

// Greedy: repeatedly take the collection whose best available set adds the most monthly yield.
function arrange(D, only){
  const byColl = new Map();
  for(const p of D.props) for(const cid of p.m){ (byColl.get(cid) || byColl.set(cid, []).get(cid)).push(p); }
  for(const arr of byColl.values()) arr.sort((a, b) => b.base - a.base);
  const colls = D.colls.filter(c => byColl.has(c.id) && (!only || only.has(c.id)))
    .map(c => ({...c, rule:ruleOf(c.requirements)}));
  const used = new Set(), picks = [];
  let open = colls.slice();
  while(open.length){
    let top = null;
    const next = [];
    for(const c of open){
      const s = bestSet(c, byColl.get(c.id), used);
      if(!s) continue;
      const g = s.reduce((a, p) => a + p.base, 0) * (c.yield_boost - 1);
      next.push(c);
      if(!top || g > top.gain) top = {c, set:s, gain:g};
    }
    if(!top || top.gain <= 0) break;
    picks.push(top);
    for(const p of top.set) used.add(p.id);
    open = next.filter(c => c !== top.c);
  }
  return {picks, used, byColl, colls};
}

function analyse(D){
  const ideal = arrange(D);
  const now = arrange(D, D.active);
  const base = D.props.reduce((a, p) => a + p.base, 0);
  const sum = r => r.picks.reduce((a, x) => a + x.gain, 0);
  const idealIds = new Set(ideal.picks.map(x => x.c.id));
  // Almost there: eligible but short, using properties left over after the best arrangement.
  const almost = ideal.colls.filter(c => !idealIds.has(c.id)).map(c => {
    const all = ideal.byColl.get(c.id), free = all.filter(p => !ideal.used.has(p.id));
    const have = Math.min(all.length, c.amount), short = c.amount - have;
    const avg = all.reduce((a, p) => a + p.base, 0) / all.length;
    return {c, have, short, all, potential: avg * c.amount * (c.yield_boost - 1), free};
  }).filter(x => x.short >= 1 && x.short <= 3).sort((a, b) => b.potential - a.potential);
  return {base, ideal, now, idealGain:sum(ideal), nowGain:sum(now), almost,
    newRewards: ideal.picks.filter(x => status(x.c.id) === 'new').reduce((a, x) => a + (x.c.one_time_reward || 0), 0)};
}
// ---------- borrowing ----------
// Pick a set for a collection from own properties first, then friends' spare ones.
function mixedSet(c, own, spare){
  const pool = [...own, ...spare];
  if(pool.length < c.amount) return null;
  if(c.rule.k === 'any') return pool.slice(0, c.amount);
  if(c.rule.k === 'diff'){
    const seen = new Set(), out = [];
    for(const p of pool){ const k = c.rule.key(p); if(!seen.has(k)){ seen.add(k); out.push(p); if(out.length === c.amount) return out; } }
    return null;
  }
  let best = null, score = -1;
  const groups = new Map();
  for(const p of pool){ const k = c.rule.key(p); (groups.get(k) || groups.set(k, []).get(k)).push(p); }
  for(const g of groups.values()) if(g.length >= c.amount){
    const s = g.slice(0, c.amount), sc = s.filter(p => p.own).length * 1e9 + s.reduce((a, p) => a + p.base, 0);
    if(sc > score){ score = sc; best = s; }
  }
  return best;
}
// ---------- loan economics ----------
// Upland's cooldown before a property can leave a collection, by rarity (days).
const COOLDOWN = {1:0, 2:3, 3:7, 4:14, 5:14};
const MINT_K = 5.6713e-6;                       // yield per hour = mint price × this
const loan = {days: Number(store.get('fl:days', 0)) || 0, tax: store.get('fl:tax', 5) === '' ? 5 : Number(store.get('fl:tax', 5)),
  base: store.get('fl:taxBase', 'mint'), fixed: Number(store.get('fl:taxFixed', 1000)) || 1000};
// The price Upland's tax is charged on for each transfer: the mint price, or a price the two players agree on.
const priceOf = p => loan.base === 'fixed' ? loan.fixed : p.y / MINT_K;
let BURN = new Set();                           // properties the viewer marked as "fine to lend"
const isBurner = (L, p) => L.user === (D.user || '').toLowerCase() && BURN.has(p.id);
// One loan, shared fairly. Yields here are per 30 days and scaled by the earning percentage; rewards are real UPX.
//   pot     = one-time reward + the collection bonus the borrower earns during the loan
//   costs   = the bonus the lender loses for that time + Upland's tax on lending and returning each property
//   net     = pot - costs, split 50/50; the borrower pays the lender "settle" so both end up with net/2
function terms(x){
  const days = loan.days > 0 ? loan.days : (COOLDOWN[x.c.category] || 0);
  const f = days / 30, ep = earn.pct / 100;
  const bonus = x.gain * f * ep;
  const base = x.borrowed.reduce((a, p) => a + p.base, 0) * f * ep;
  const broken = [...new Set(x.borrowed.map(p => p.holds).filter(Boolean))].reduce((a, h) => a + h.gain, 0) * f * ep;
  const tax = x.borrowed.reduce((a, p) => a + priceOf(p), 0) * (loan.tax / 100) * 2;
  const pot = x.reward + bonus, net = pot - broken - tax;
  return {days, bonus, base, broken, tax, pot, net, half: net / 2, settle: net / 2 + base + broken + tax / 2};
}
// Collections a member has never collected that they could finish with a few borrowed properties.
function borrowFor(B, members, colls){
  const out = [];
  for(const c of colls){
    if(B.active.has(c.id) || B.collected.has(c.id)) continue;
    const own = (B.byColl.get(c.id) || []).slice().sort((a, b) => b.base - a.base).map(p => ({...p, owner:B.user, own:true}));
    if(own.length >= c.amount && bestSet(c, own, new Set())) continue;   // can do it alone: shown in the other tabs
    // Any friend's property can be lent. A burner (in none of the owner's best collections, or marked as one) costs
    // nothing extra; otherwise lending it breaks the collection it holds up for the loan. Cheapest first.
    const spare = members.filter(L => L !== B).flatMap(L => (L.byColl.get(c.id) || []).map(p => {
      const holds = isBurner(L, p) ? undefined : L.ar.where.get(p.id);
      return {...p, owner:L.user, own:false, holds, burner:!holds, cost:p.base + (holds ? holds.gain : 0)};
    })).sort((a, b) => a.cost - b.cost);
    const set = mixedSet(c, own, spare);
    if(!set) continue;
    const borrowed = set.filter(p => !p.own);
    if(!borrowed.length || borrowed.length > 3) continue;
    const x = {c, set, borrowed, borrower:B.user, reward:c.one_time_reward || 0, gain:set.reduce((a, p) => a + p.base, 0) * (c.yield_boost - 1)};
    x.tm = terms(x);
    if(x.tm.pot - x.tm.broken <= 0) continue;   // not worth it even before tax (the lender's loss is bigger than the gain)
    out.push(x);
  }
  return out.sort((a, b) => b.tm.net - a.tm.net || a.borrowed.length - b.borrowed.length);
}
let CR = null;   // collections with their rules, built once
function analyseGroup(){
  if(!D.group) return null;
  CR = CR || D.colls.map(c => ({...c, rule:ruleOf(c.requirements)}));
  const me = D.user.toLowerCase();
  BURN = new Set(store.get('fl:burn:' + me, []));
  const all = D.group.map(B => borrowFor(B, D.group, CR)).flat();
  const have = D.group.reduce((a, m) => a + m.props.length, 0), total = D.group.reduce((a, m) => a + m.total, 0);
  const mine = D.group.find(m => m.user === me);
  const lend = all.filter(x => x.borrower !== me && x.borrowed.some(p => p.owner === me));
  // Properties of the viewer that friends' collections would use, and whether they cost a collection bonus.
  const cand = new Map();
  for(const x of lend) for(const p of x.borrowed) if(p.owner === me){ const e = cand.get(p.id) || {p, n:0, holds:p.holds}; e.n++; cand.set(p.id, e); }
  return {borrow: all.filter(x => x.borrower === me), lend, all, have, total, names: D.group.map(m => m.user),
    burners: {auto: mine ? mine.props.filter(p => !mine.ar.where.has(p.id)).length : 0, cand: [...cand.values()].sort((a, b) => b.n - a.n)}};
}
function refreshGroup(){ if(D && D.group){ G = analyseGroup(); } }

function overviewHtml(){

  for(const p of (D.group ? D.group.flatMap(m => m.props) : D.props)) if(p.c) cityName.set(p.c, p.cn);
  const fill = new Set(A.ideal.picks.map(x => x.c.id)), borrow = new Set((G ? G.borrow : []).map(x => x.c.id)), almost = new Set(A.almost.map(x => x.c.id));
  const tally = list => {
    const r = {total:list.length, active:0, collected:0, never:0, reward:0, alone:0, borrow:0, almost:0};
    for(const c of list){
      const s = status(c.id);
      if(s === 'active') r.active++; else if(s === 'collected') r.collected++;
      else{ r.never++; r.reward += c.one_time_reward || 0; if(fill.has(c.id)) r.alone++; else if(borrow.has(c.id)) r.borrow++; else if(almost.has(c.id)) r.almost++; }

  const byRarity = [1, 2, 3, 4, 5].map(k => row(`<span class="rar" style="--c:var(--r${k})">${esc(RARITY[k])}</span>`, tally(D.colls.filter(c => c.category === k)))).join('') + row(`<b>${esc(t('ovAll'))}</b>`, all);

function ensureBuy(){

// For each collection the player is missing, the cheapest properties for sale that would complete it.
function buyPlan(){
  const me = D.user.toLowerCase(), avg = D.props.length ? A.base / D.props.length : 0;
  const rows = [];
  for(const c of D.colls){
    const s = status(c.id);
    if(s === 'active' || (bs.scope === 'never' && s !== 'new')) continue;
    const set = BUY.sets[c.id];
    if(!set) { rows.push({c, s, unpriced:true}); continue; }
    const free = D.props.filter(p => p.m.includes(c.id) && !A.ideal.used.has(p.id));
    const short = Math.max(0, c.amount - free.length);
    rows.push({c, s, set, short, ownFree:free.length, avg});
  }
  // Resolve overlaps cheapest-first so the same property isn't counted for two collections.
  for(const cur of ['upx', 'usd']){
    const used = new Set();
    const key = cur + 'Pick';
    for(const r of rows.filter(r => r.set && r.short > 0).sort((a, b) => (a.set[cur][0] ? a.set[cur][0].p * a.short : 1e18) - (b.set[cur][0] ? b.set[cur][0].p * b.short : 1e18))){
      const pick = [];
      for(const p of r.set[cur]){ if(p.o && p.o.toLowerCase() === me) continue; if(used.has(p.id)) continue; pick.push(p); if(pick.length === r.short) break; }
      if(pick.length === r.short){ r[key] = pick; pick.forEach(p => used.add(p.id)); r[cur + 'Cost'] = pick.reduce((a, p) => a + p.p, 0); }
    }
  }
  for(const r of rows){
    if(!r.set) continue;
    r.gain = r.avg * r.c.amount * (r.c.yield_boost - 1);            // estimated extra UPX per month
    r.reward = r.s === 'new' ? (r.c.one_time_reward || 0) : 0;
    const eq = []; if(r.upxCost != null) eq.push(r.upxCost); if(r.usdCost != null) eq.push(r.usdCost * bs.rate);
    r.cost = r.short === 0 ? 0 : (eq.length ? Math.min(...eq) : null);
    r.payback = r.cost != null && r.gain > 0 ? Math.max(0, (r.cost - r.reward) / r.gain) : null;
  }
  return rows;
}

function swapHtml(){
  if(!G) return `<div class="card empty">${esc(t('groupOnly'))}</div>`;
  const me = D.user.toLowerCase();
  const names = D.group.map(m => m.user).filter(u => u !== me);
  if(!names.length) return `<div class="card empty">${esc(t('nothing'))}</div>`;
  const partner = names.includes(sw.partner) ? sw.partner : names[0];
  const memA = D.group.find(m => m.user === me), memB = D.group.find(m => m.user === partner);
  const sel = `<div class="row" style="gap:8px;margin-bottom:8px"><label class="small row" style="gap:6px">${esc(t('swPartner'))} <select id="swPartner">${names.map(n => `<option value="${esc(n)}"${n === partner ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></label></div>`;
  if(!memA) return sel + `<div class="card empty">${esc(t('groupOnly'))}</div>`;
  const pair = [memA, memB];
  const mine = borrowFor(memA, pair, CR), theirs = borrowFor(memB, pair, CR);
  const ids = (x, owner) => x.set.filter(p => p.owner === owner).map(p => p.id);
  const used = new Set();
  const ok = (a, b) => { const all = [...ids(a, me), ...ids(b, me), ...ids(a, partner), ...ids(b, partner)]; return new Set(all).size === all.length && !all.some(i => used.has(i)); };
  const commit = x => ids(x, me).concat(ids(x, partner)).forEach(i => used.add(i));
  const pairs = []; let lm = mine.slice(), lt = theirs.slice();
  for(const same of [true, false]){
    for(;;){
      let best = null;
      for(const a of lm) for(const b of lt){
        if(same && a.c.category !== b.c.category) continue;
        if(!ok(a, b)) continue;
        const d = Math.abs(a.tm.net - b.tm.net);
        if(!best || d < best.d) best = {a, b, d};
      }
      if(!best) break;
      pairs.push({...best, tier: same ? 1 : 2}); commit(best.a); commit(best.b);
      lm = lm.filter(x => x !== best.a); lt = lt.filter(x => x !== best.b);
    }
  }
  const soloM = lm.filter(x => !ids(x, me).concat(ids(x, partner)).some(i => used.has(i)));
  const soloT = lt.filter(x => !ids(x, me).concat(ids(x, partner)).some(i => used.has(i)));
  const pairCard = p => {
    const pay = p.a.tm.settle - p.b.tm.settle;
    const bal = Math.abs(pay) < 1 ? t('swEven') : (pay > 0 ? t('swYouPay', {p:partner, n:n0(pay)}) : t('swTheyPay', {p:partner, n:n0(-pay)}));
    return `<details class="coll" style="--c:var(--r${p.a.c.category})"><summary><span class="nm">${esc(t('swCard', {a:p.a.c.name, p:partner, b:p.b.c.name}))}</span>${rar(p.a.c)}${rar(p.b.c)}<span class="gain">${esc(bal)}</span></summary>
      <div class="body"><h3 class="small">${esc(t('swBorrowH', {c:p.a.c.name}))}</h3>${setTableHtml(p.a)}${termsHtml(p.a, 'borrow')}
      <h3 class="small">${esc(t('swLendH', {p:partner, c:p.b.c.name}))}</h3>${setTableHtml(p.b)}${termsHtml(p.b, 'lend')}</div></details>`;
  };
  const tier = n => pairs.filter(p => p.tier === n);
  const sect = (title, note, html, n) => n ? `<h2 style="margin-top:18px">${esc(title)} <span class="muted small">${n}</span></h2><p class="note">${esc(note)}</p>${html}` : '';
  return `${sel}<p class="note">${esc(t('swNote'))}</p>${loanSettingsHtml()}${groupBanner()}${burnersHtml()}
    ${sect(t('swTier1'), t('swTier1n'), tier(1).map(pairCard).join(''), tier(1).length)}
    ${sect(t('swTier2'), t('swTier2n'), tier(2).map(pairCard).join(''), tier(2).length)}
    ${sect(t('swTier3'), t('swTier3n'), soloM.map(x => loanCard(x, 'borrow')).join('') + soloT.map(x => loanCard(x, 'lend')).join(''), soloM.length + soloT.length)}
    ${pairs.length || soloM.length || soloT.length ? '' : `<div class="card empty">${esc(t('swNone', {p:partner}))}</div>`}`;
}

    <div class="tablewrap"><table><thead><tr><th>${esc(t('ovRarity'))}</th><th class="num">${esc(t('you'))}</th><th class="num">${esc(partner)}</th><th class="num">${esc(t('cmpBoth'))}</th><th class="num">${esc(t('cmpOnlyYou'))}</th><th class="num">${esc(t('cmpOnlyThem'))}</th></tr></thead><tbody>${[1, 2, 3, 4, 5].map(row).join('')}</tbody></table></div>
    <p class="note">${esc(t('cmpCounts', {a:n0(mine.size), b:n0(theirs.size)}))} ${esc(P.inGroup ? t('cmpSwapHint') : t('cmpNeedGroup'))}</p>
    <h2 style="margin-top:16px">${esc(t('cmpListThem', {p:partner, n:onlyThem.length}))}</h2>${list(onlyThem, P)}
    <h2 style="margin-top:16px">${esc(t('cmpListYou', {p:partner, n:onlyMe.length}))}</h2>${list(onlyMe, {active:D.active})}`;
}

// ---------- earnings: what the properties make, with and without collection boosts ----------
const earn = {pct: Number(store.get('fl:pct', 14.7)) || 14.7, sort: store.get('fl:earnSort', 'upx')};
function earnHtml(){
  const ep = earn.pct, base = A.base, boosted = A.base + A.nowGain, best = A.base + A.idealGain;
  const cityName = new Map();
  for(const p of D.props) if(p.c) cityName.set(p.c, p.cn);
  const row = (label, v) => `<tr><td>${esc(label)}</td><td class="num">${n0(v)}</td><td class="num"><b>${n0(v * ep / 100)}</b></td></tr>`;
  const picks = A.now.picks.slice();
  const card = x => collCard({c:x.c, set:x.set, gain:x.gain});
  let list;
  if(earn.sort === 'city'){
    const groups = new Map();
    for(const x of picks){ const k = x.c.city_id || 0; (groups.get(k) || groups.set(k, []).get(k)).push(x); }
    list = [...groups].map(([k, xs]) => ({k, xs: xs.sort((a, b) => b.gain - a.gain), gain: xs.reduce((a, x) => a + x.gain, 0)})).sort((a, b) => b.gain - a.gain)
      .map(g => `<div class="group-h"><h3>${esc(g.k ? (cityName.get(g.k) || t('ovCity', {id:g.k})) : t('ovAnywhere'))}</h3><span class="muted small">${esc(t('perMonth', {x:n0(g.gain)}))} · ${g.xs.length}</span></div>${g.xs.map(card).join('')}`).join('');
  }else list = picks.sort((a, b) => b.gain - a.gain).map(card).join('');
  const opt = (v, l, cur) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(l)}</option>`;
  return `<p class="note">${esc(t('earnNote'))}</p>${D.props.length < D.total ? `<p class="note"><b>${esc(t('partial', {n:n0(D.props.length), t:n0(D.total)}))}</b></p>` : ''}
    <div class="row" style="gap:8px;margin-bottom:10px"><label class="small row" style="gap:6px">${esc(t('earnPct'))} <input type="number" id="earnPct" min="0" max="1000" step="0.01" value="${ep}" style="width:6em"> %</label></div>
    <div class="tablewrap"><table><thead><tr><th></th><th class="num">${esc(t('earnListed'))}</th><th class="num">${esc(t('earnAfter', {p:ep.toFixed(2)}))}</th></tr></thead><tbody>
      ${row(t('earnBase'), base)}${row(t('earnNow'), boosted)}${row(t('earnBest'), best)}</tbody></table></div>
    <p class="note">${esc(t('earnExplain'))}</p>
    <div class="row" style="gap:8px;margin:14px 0 8px"><h2 style="margin:0;flex:1 1 200px">${esc(t('earnList'))} (${A.now.picks.length})</h2>
      <select id="earnSort">${opt('upx', t('earnByUpx'), earn.sort)}${opt('city', t('earnByCity'), earn.sort)}</select></div>
    ${list || `<div class="card empty">${esc(t('nothing'))}</div>`}`;
}

let ui = {tab: store.get('fl:tab', 'overview')};
function render(){
  if(!A) return;
  const kp = [[t('perMonth', {x:n0(A.base)}), t('kBase')], [t('perMonth', {x:n0(A.base + A.idealGain)}), t('kIdeal')], [t('perMonth', {x:n0(A.idealGain)}), t('kGain')],
    [t('perMonth', {x:n0(A.nowGain)}), t('kNow')], [t('perMonth', {x:n0(Math.max(0, A.idealGain - A.nowGain))}), t('kUp')], [t('upx', {x:n0(A.newRewards)}), t('kNew')]];
  $('#kpis').innerHTML = kp.map(([v, l]) => `<div class="kpi"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`).join('');
  const picks = A.ideal.picks;
  const toActivate = picks.filter(x => status(x.c.id) !== 'active');
  const idealIds = new Set(picks.map(x => x.c.id));
  const release = D.colls.filter(c => D.active.has(c.id) && !idealIds.has(c.id));
  const shownRelease = D.props.length < D.total ? 0 : release.length;   // with partial data, active collections only look unfillable
  const tabs = [['overview', t('tOverview'), null], ['earn', t('tEarn'), null], ['best', t('tBest'), picks.length], ['changes', t('tChanges'), toActivate.length + shownRelease], ['almost', t('tAlmost'), A.almost.length]];
  tabs.push(['borrow', t('tBorrow'), G ? G.borrow.length : 0], ['lend', t('tLend'), G ? G.lend.length : 0], ['swap', t('tSwap'), null], ['compare', t('tCompare'), null], ['buy', t('tBuy'), null]);
  $('#tabs').innerHTML = tabs.map(([k, l, n]) => `<button data-tab="${k}" class="${ui.tab === k ? 'on' : ''}">${esc(l)}${n == null ? '' : `<span class="n">${n}</span>`}</button>`).join('');
  let html = '';
  if(ui.tab === 'overview') html = overviewHtml();
  if(ui.tab === 'earn') html = earnHtml();
  if(ui.tab === 'buy'){ ensureBuy(); html = buyHtml(); }
  if(ui.tab === 'best') html = picks.map(x => collCard(x)).join('') || `<div class="card empty">${esc(t('nothing'))}</div>`;
  if(ui.tab === 'changes'){
    html = `<h2>${esc(t('activateH'))}</h2><p class="note">${esc(t('activateNote'))}</p>${toActivate.map(x => collCard(x)).join('') || `<p class="note">${esc(t('nothing'))}</p>`}
      ${D.props.length < D.total ? '' : `<h2 style="margin-top:20px">${esc(t('releaseH'))}</h2><p class="note">${esc(t('releaseNote'))}</p>
      ${release.map(c => collCard({c:{...c}, gain:0}, ' ')).join('') || `<p class="note">${esc(t('nothing'))}</p>`}`}`;
  }
  if(ui.tab === 'almost'){
    html = `<p class="note">${esc(t('almostNote'))}</p>` + A.almost.map(x => collCard({c:x.c, set:x.all.slice(0, x.c.amount), body:`<p class="note">${esc(t('haveOf', {h:x.have, a:x.c.amount}))}</p>`},
      `${t('shortBy', {n:x.short})} · ${t('potential', {x:n0(x.potential)})}`)).join('');
  }
  if(ui.tab === 'borrow' || ui.tab === 'lend'){
    if(!G) html = `<div class="card empty">${esc(t('groupOnly'))}</div>`;
    else{
      const role = ui.tab === 'borrow' ? 'borrow' : 'lend';
      const list = (role === 'borrow' ? G.borrow : G.lend).slice(0, 80);
      html = `<p class="note">${esc(t(role === 'borrow' ? 'borrowNote' : 'lendNote'))}</p>${loanSettingsHtml()}${groupBanner()}${role === 'lend' ? burnersHtml() : ''}`
        + (list.map(x => loanCard(x, role)).join('') || `<div class="card empty">${esc(t('nothing'))}</div>`);
    }
  }
  if(ui.tab === 'swap') html = swapHtml();
  if(ui.tab === 'compare') html = compareHtml();
  $('#panel').innerHTML = html;
}

// ---------- wiring ----------
let statusFn = null;
function setStatus(fn, err){ statusFn = typeof fn === 'function' ? fn : null; const el = $('#status'); el.textContent = statusFn ? statusFn() : (fn || ''); el.classList.toggle('err', !!err); }
function fillViewAs(){
  const row = $('#viewRow'), sel = $('#viewAs');
  if(!D || !D.group || D.group.length < 2){ row.classList.add('hidden'); return; }
  sel.innerHTML = D.group.map(m => `<option value="${esc(m.user)}"${m.user === D.user.toLowerCase() ? ' selected' : ''}>${esc(m.user)}</option>`).join('');
  row.classList.remove('hidden');
}
$('#viewAs').addEventListener('change', e => { $('#username').value = e.target.value; run(e.target.value, false, true); });
async function run(user, auto, view){
  if(!view){ store.set('fl:user', user); Site.setUser(user); }   // looking at a friend's data doesn't change your remembered name
  $('#loadBtn').disabled = true; $('#progress').classList.remove('hidden');
  const bar = $('#progress i');
  try{
    D = await loadUser(user, (msg, f) => { setStatus(msg); bar.style.width = Math.round(f * 100) + '%'; }, auto);
    A = analyse(D);
    G = analyseGroup();
    const at = new Date();
    setStatus(() => t('loaded', {p:n0(D.props.length), c:n0(A.ideal.colls.length), t:at.toLocaleTimeString(Site.locale(), {hour:'2-digit', minute:'2-digit'})})
      + (D.props.length < D.total ? ' ' + t('partial', {n:n0(D.props.length), t:n0(D.total)}) : ''));
    $('#app').classList.remove('hidden'); fillViewAs(); render();
  }catch(e){ if(e.message === 'auto-skip') setStatus(t('pressGo', {u:user})); else setStatus(t('errUser', {u:user}), true); }
  $('#loadBtn').disabled = false; $('#progress').classList.add('hidden');
}
$('#userForm').addEventListener('submit', e => { e.preventDefault(); const u = $('#username').value.trim(); if(u) run(u); });
$('#panel').addEventListener('change', e => {
  const id = e.target.id;
  if(id === 'buyScope'){ bs.scope = e.target.value; store.set('fl:buyScope', bs.scope); }
  else if(id === 'buyRarity') bs.rarity = e.target.value;
  else if(id === 'buySort'){ bs.sort = e.target.value; store.set('fl:buySort', bs.sort); }
  else if(id === 'earnPct'){ earn.pct = Math.max(0, Number(e.target.value) || 0); store.set('fl:pct', earn.pct); refreshGroup(); }
  else if(id === 'earnSort'){ earn.sort = e.target.value; store.set('fl:earnSort', earn.sort); }
  else if(id === 'buyRate'){ bs.rate = Math.max(1, Number(e.target.value) || 1000); store.set('fl:rate', bs.rate); }
  else if(id === 'swPartner'){ sw.partner = e.target.value; store.set('fl:partner', sw.partner); }
  else if(id === 'cmpPartner'){ cmp.partner = e.target.value; store.set('fl:cmpPartner', cmp.partner); }
  else if(id === 'cmpOther'){ const v = e.target.value.trim().toLowerCase(); if(v) cmpLoad(v); return; }
  else if(id === 'loanDays'){ loan.days = Math.max(0, Number(e.target.value) || 0); store.set('fl:days', loan.days); refreshGroup(); }
  else if(id === 'loanBase'){ loan.base = e.target.value; store.set('fl:taxBase', loan.base); refreshGroup(); }
  else if(id === 'loanFixed'){ loan.fixed = Math.max(0, Number(e.target.value) || 0); store.set('fl:taxFixed', loan.fixed); refreshGroup(); }
  else if(id === 'loanTax'){ loan.tax = Math.max(0, Number(e.target.value) || 0); store.set('fl:tax', loan.tax); refreshGroup(); }
  else if(e.target.dataset && e.target.dataset.burn){
    const i = Number(e.target.dataset.burn); if(BURN.has(i)) BURN.delete(i); else BURN.add(i);
    store.set('fl:burn:' + D.user.toLowerCase(), [...BURN]); ui.burnOpen = true; refreshGroup();
  }
  else return;
  render();
});
$('#panel').addEventListener('toggle', e => { if(e.target.id === 'burnBox') ui.burnOpen = e.target.open; }, true);
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; ui.tab = b.dataset.tab; store.set('fl:tab', ui.tab); render(); });
Site.mount({onChange: () => { if(statusFn) $('#status').textContent = statusFn(); render(); }});
const params = new URLSearchParams(location.search);
const start = params.get('user') || Site.user() || store.get('fl:user', '');
if(start){ $('#username').value = start; run(start, !params.get('user')); }
</script>
