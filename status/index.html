<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rockdrigo’s Backstage</title>
<meta name="description" content="Which data jobs are running, when each last ran, and how far the long ones have got.">
<link rel="stylesheet" href="../shared/theme.css">
<style>
.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.job h2{margin:0 0 4px;font-size:1.1rem}
.job .when{font-size:0.9rem;margin:6px 0}
.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:6px;background:var(--muted)}
.dot.ok{background:var(--accent)}.dot.old{background:#d4a017}.dot.run{background:#3b82f6}
.hero{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero b{font-size:1.05rem}
.dot.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.55)}50%{box-shadow:0 0 0 7px rgba(59,130,246,0)}}
@media (prefers-reduced-motion:reduce){.dot.pulse{animation:none}}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header id="site-header"></header>
  <section class="card"><div class="hero" id="hero"></div><div id="run" class="small muted"></div></section>
  <main><div class="jobs" id="jobs"></div></main>
  <p class="note" id="note"></p>
  <footer id="site-footer"></footer>
</div>
<script src="../shared/site.js"></script>
<script src="../shared/upland.js"></script>
<script>
"use strict";
const {t, esc} = Site;
const $ = s => document.querySelector(s);
const REPO = 'Rockdrigotoca/upland-tools';

Site.register({
  en:{
    title:'Rockdrigo’s Backstage', subtitle:'Which data jobs are running, when each last ran, and how far the long ones have got.',
    jPrices:'Ornament prices', jBuy:'Properties for sale', jCollections:'Group collections', jLedger:'Sales ledger', jStruct:'Neighbourhood structures', jWorld:'World structure scan', jFees:'Teleport prices', dFees:'The teleport price of every property with a service structure, and of every property within reach of the costly ones, to find a cheaper place to stand while you trove. Feeds the Troves page.', cFees:'{n} of {m} structure properties read.', cReach:'Neighbours of costly ones: {p} of about {m} read, about {h} h to go.', cReachDone:'Neighbours of costly ones: all {p} read.',
    dStruct:'Which service structures each neighbourhood has and lacks.', dWorld:'Service structures of every Upland city. Feeds the Troves grind map.', cWorld:'{n} cities scanned.', cStruct:'{n} structure types listed.',
    jHoro:'Property Horoscope · Philomena at work', dHoro:'The stars, but for land. Entirely run by Philomena, who is very sure.',
    horo:['Reading star charts: 3 of 12 (two were upside down)','Asking Mercury about your corner lot: “it’s complicated”','Converting Mars retrograde into UPX: rate unknown, mood excellent','Checking whether Taurus owns property (Taurus declined to comment)','Drafting your reading: it begins “Beware of a tall building”'], horoPct:'{n}% done, give or take a planet', horoEta:'Expected: when the stars align. They have been told.',
    liveRun:'Running now', liveIdle:'All quiet, next run in {n}', liveSince:'since {t}', liveAuto:'This page refreshes by itself every minute.',
    dPrices:'Ornament sales and listings. Feeds Cheapskate and the Optimizer.', dBuy:'Cheapest properties for sale per collection. Feeds the Hoarder’s Buy tab.',
    dCollections:'Every group player’s properties and collections. Feeds the Hoarder.', dLedger:'Sales from the chain history. Feeds Receipts.',
    updated:'Updated {t} ({a})', never:'Hasn’t delivered data yet.', ago:'{n} ago', min:'{n} min', hr:'{n} h', day:'{n} d',
    cPrices:'Sales read up to {d}.', cBuy:'{n} of {m} collections priced.', cCollections:'{n} properties still to read.', cLedger:'Sales read from {a} to {b}. Goes back to April 2025.',
    runNow:'Running now since {t}.', runLast:'Last run: {r}, {t}.', runNone:'No run information available.', success:'succeeded', failure:'failed', cancelled:'was cancelled',
    note:'Jobs run one after another every 12 hours. Delivered data appears here once it has been saved to the site.'
  },
  es:{
    title:'Backstage de Rockdrigo', subtitle:'Qué trabajos de datos están corriendo, cuándo corrió cada uno y cuánto llevan los largos.',
    jPrices:'Precios de ornamentos', jBuy:'Propiedades en venta', jCollections:'Colecciones del grupo', jLedger:'Libro de ventas', jStruct:'Estructuras por barrio', jWorld:'Escaneo mundial de estructuras', jFees:'Precios de teletransporte', dFees:'El precio de teletransporte de cada propiedad con una estructura de servicio, y de cada propiedad al alcance de las caras, para encontrar un lugar más barato donde pararse a buscar troves. Alimenta la página de Troves.', cFees:'{n} de {m} propiedades con estructura leídas.', cReach:'Vecinas de las caras: {p} de unas {m} leídas, faltan unas {h} h.', cReachDone:'Vecinas de las caras: las {p} leídas.',
    dStruct:'Qué estructuras de servicio tiene y le faltan a cada barrio.', dWorld:'Estructuras de servicio de cada ciudad de Upland. Alimenta el mapa de grind de Troves.', cWorld:'{n} ciudades escaneadas.', cStruct:'{n} tipos de estructura listados.',
    jHoro:'Horóscopo de Propiedades · Philomena trabajando', dHoro:'Las estrellas, pero para terrenos. La lleva toda Philomena, que está muy segura.',
    horo:['Leyendo cartas astrales: 3 de 12 (dos estaban de cabeza)','Preguntándole a Mercurio por tu esquina: “es complicado”','Convirtiendo Marte retrógrado a UPX: tasa desconocida, ánimo excelente','Revisando si Tauro tiene propiedades (Tauro prefirió no opinar)','Redactando tu lectura: empieza con “Cuidado con un edificio alto”'], horoPct:'{n}% listo, más o menos un planeta', horoEta:'Se espera: cuando se alineen los astros. Ya se les avisó.',
    liveRun:'Corriendo ahora', liveIdle:'Todo en calma, próxima corrida en {n}', liveSince:'desde {t}', liveAuto:'Esta página se actualiza sola cada minuto.',
    dPrices:'Ventas y listados de ornamentos. Alimenta a Cheapskate y al Optimizador.', dBuy:'Las propiedades más baratas en venta por colección. Alimenta la pestaña Comprar del Acaparador.',
    dCollections:'Propiedades y colecciones de cada jugador del grupo. Alimenta al Acaparador.', dLedger:'Ventas del historial de la cadena. Alimenta a Recibos.',
    updated:'Actualizado {t} ({a})', never:'Todavía no ha entregado datos.', ago:'hace {n}', min:'{n} min', hr:'{n} h', day:'{n} d',
    cPrices:'Ventas leídas hasta {d}.', cBuy:'{n} de {m} colecciones con precio.', cCollections:'Faltan {n} propiedades por leer.', cLedger:'Ventas leídas de {a} a {b}. Llega hasta abril de 2025.',
    runNow:'Corriendo desde {t}.', runLast:'Última corrida: {r}, {t}.', runNone:'No hay información de corridas.', success:'terminó bien', failure:'falló', cancelled:'se canceló',
    note:'Los trabajos corren uno tras otro cada 12 horas. Los datos entregados aparecen aquí cuando ya se guardaron en el sitio.'
  },
  en_cunk:{
    jFees:'Teleport prices: Asking the Neighbours', dFees:'Somewhere in Los Angeles a man has set the price of visiting his lamp-post at 125 UPX. We are now knocking on every door nearby to ask what they would charge instead. It is, in the broadest sense, journalism.',
    title:'Rockdrigo’s Backstage: A History of Machines Working', subtitle:'Somewhere, a computer is doing this for free. Here is how that is going.',
    never:'Nothing yet. The machine is thinking, or has been told not to.', note:'The jobs run in a queue, as civilised people do.'
  },
  es_cunk:{
    jFees:'Precios de teletransporte: preguntando a los vecinos', dFees:'En algún lugar de Los Ángeles un señor puso en 125 UPX la visita a su farol. Ahora tocamos todas las puertas de alrededor para preguntar cuánto cobrarían ellos. Es, en el sentido más amplio, periodismo.',
    title:'Backstage de Rockdrigo: una historia de máquinas trabajando', subtitle:'En algún lugar, una computadora hace esto gratis. Así va.',
    never:'Nada todavía. La máquina está pensando, o le dijeron que no.', note:'Los trabajos hacen fila, como la gente civilizada.'
  }
});

const loc = () => Site.locale();
const fmt = x => new Date(x).toLocaleString(loc(), {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
function age(iso){
  const m = Math.max(0, (Date.now() - new Date(iso).getTime()) / 6e4);
  return {m, s: t('ago', {n: m < 90 ? t('min', {n: Math.round(m)}) : m < 2880 ? t('hr', {n: Math.round(m / 60)}) : t('day', {n: Math.round(m / 1440)})})};
}
const get = p => Upland.getJSON(`../data/${p}?t=${Date.now()}`).catch(() => null);
let D = null, RUN = null;

function job(name, desc, at, line, pct){
  const a = at ? age(at) : null;
  const cls = !a ? '' : a.m < 24 * 60 ? 'ok' : 'old';
  return `<section class="card job"><h2>${esc(name)}</h2><div class="small muted">${esc(desc)}</div>
    <div class="when"><span class="dot ${cls}"></span>${a ? esc(t('updated', {t: fmt(at), a: a.s})) : esc(t('never'))}</div>
    ${line ? `<div class="small">${esc(line)}</div>` : ''}
    ${pct != null ? `<div class="bar"><i style="width:${Math.max(1, Math.min(100, pct)).toFixed(0)}%"></i></div>` : ''}</section>`;
}
function nextRun(){
  const now = new Date(), c = [];
  for(let d = 0; d < 2; d++) for(const h of [3, 15]){ const x = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + d, h, 17)); if(x > now) c.push(x); }
  return Math.min(...c);
}
const span = ms => { const m = Math.round(ms / 6e4); return m < 90 ? t('min', {n:m}) : t('hr', {n:Math.round(m / 60)}); };
function hero(){
  const live = RUN && RUN.status !== 'completed';
  $('#hero').innerHTML = `<span class="dot ${live ? 'run pulse' : 'ok'}"></span><b>${esc(live ? t('liveRun') : t('liveIdle', {n:span(nextRun() - Date.now())}))}</b>${live ? `<span class="small muted">${esc(t('liveSince', {t:fmt(RUN.run_started_at)}))}</span>` : ''}`;
}
function render(){
  if(!D) return;
  const [pr, buy, col, led, st, wd, fe, rc] = D;
  const day = x => new Date(x + 'Z').toLocaleDateString(loc(), {month:'short', day:'numeric', year:'numeric'});
  const total = 12100; // roughly the group's properties
  $('#jobs').innerHTML = [
    job(t('jPrices'), t('dPrices'), pr && pr.updatedAt, pr && pr.chainCursor ? t('cPrices', {d: fmt(pr.chainCursor + 'Z')}) : ''),
    job(t('jBuy'), t('dBuy'), buy && buy.updatedAt, buy ? t('cBuy', {n: buy.priced, m: buy.priceable}) : '', buy && buy.priceable ? buy.priced * 100 / buy.priceable : null),
    job(t('jCollections'), t('dCollections'), col && col.updatedAt, col ? t('cCollections', {n: Number(col.remaining).toLocaleString(loc())}) : '', col ? 100 - col.remaining * 100 / total : null),
    job(t('jLedger'), t('dLedger'), led && led.updatedAt, led ? t('cLedger', {a: day(led.from), b: day(led.to)}) : ''),
    job(t('jStruct'), t('dStruct'), st && st.updatedAt, st ? t('cStruct', {n: (st.structures || []).length}) : ''),
    job(t('jWorld'), t('dWorld'), wd && wd.updatedAt, wd ? t('cWorld', {n: (wd.cities || []).filter(c => c.done).length}) : ''),
    job(t('jFees'), t('dFees'), (rc && rc.updatedAt) || (fe && fe.updatedAt), [fe ? t('cFees', {n: Number(fe.done).toLocaleString(loc()), m: Number(fe.total).toLocaleString(loc())}) : '', rc ? (rc.hoursLeft > 0 ? t('cReach', {p: Number(rc.priced).toLocaleString(loc()), m: Number(Math.max(rc.estProps, rc.candidates)).toLocaleString(loc()), h: rc.hoursLeft}) : t('cReachDone', {p: Number(rc.priced).toLocaleString(loc())})) : ''].filter(Boolean).join(' '), rc ? (rc.listed + rc.priced) * 100 / Math.max(1, rc.listed + rc.priced + rc.listRequests + rc.readsLeft) : (fe && fe.total ? fe.done * 100 / fe.total : null))
  ].join('');
  hero();
  // Philomena's progress: it moves a little every minute, never gets anywhere, and is never wrong.
  const m = Math.floor(Date.now() / 6e4), pct = 3 + ((m * 7) % 11) / 10 + (Math.floor(m / 11) % 3);
  const lines = t('horo');
  $('#jobs').insertAdjacentHTML('beforeend', `<section class="card job"><h2>${esc(t('jHoro'))}</h2><div class="small muted">${esc(t('dHoro'))}</div>
    <div class="when"><span class="dot run pulse"></span>${esc(Array.isArray(lines) ? lines[m % lines.length] : '')}</div>
    <div class="small">${esc(t('horoPct', {n:pct.toFixed(1)}))}</div><div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div><div class="small muted">${esc(t('horoEta'))}</div></section>`);
  $('#note').textContent = t('note') + ' ' + t('liveAuto');
  if(!RUN) $('#run').textContent = t('runNone');
  else if(RUN.status !== 'completed') $('#run').textContent = t('runNow', {t: fmt(RUN.run_started_at)});
  else $('#run').textContent = t('runLast', {r: t(RUN.conclusion === 'success' ? 'success' : RUN.conclusion === 'cancelled' ? 'cancelled' : 'failure'), t: fmt(RUN.updated_at)});
}
Site.mount({onChange: render});
function load(){
  Promise.all(['state.json', 'buy/state.json', 'collections/state.json', 'ledger/state.json', 'structures/master.json', 'troves/world.json', 'troves/fees-state.json', 'troves/reach-state.json'].map(get)).then(d => { D = d; render(); });
  Upland.getJSON(`https://api.github.com/repos/${REPO}/actions/workflows/collect.yml/runs?per_page=1`).then(r => { RUN = (r.workflow_runs || [])[0] || null; render(); }).catch(() => {});
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
