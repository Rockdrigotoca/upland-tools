<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rockdrigo’s Backstage</title>
<meta name="description" content="Which data jobs are running, when each last ran, and how far the long ones have got.">
<link rel="stylesheet" href="../shared/theme.css">
<style>
.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.job h2{margin:0 0 4px;font-size:1.1rem}
.job .when{font-size:0.9rem;margin:6px 0}
.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:6px;background:var(--muted)}
.dot.ok{background:var(--accent)}.dot.old{background:#d4a017}.dot.run{background:#3b82f6}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header id="site-header"></header>
  <section class="card"><div id="run" class="small"></div></section>
  <main><div class="jobs" id="jobs"></div></main>
  <p class="note" id="note"></p>
  <footer id="site-footer"></footer>
</div>
<script src="../shared/site.js"></script>
<script src="../shared/upland.js"></script>
<script>
"use strict";
const {t, esc} = Site;
const $ = s => document.querySelector(s);
const REPO = 'Rockdrigotoca/upland-tools';

Site.register({
  en:{
    title:'Rockdrigo’s Backstage', subtitle:'Which data jobs are running, when each last ran, and how far the long ones have got.',
    jPrices:'Ornament prices', jBuy:'Properties for sale', jCollections:'Group collections', jLedger:'Sales ledger',
    dPrices:'Ornament sales and listings. Feeds Cheapskate and the Optimizer.', dBuy:'Cheapest properties for sale per collection. Feeds the Hoarder’s Buy tab.',
    dCollections:'Every group player’s properties and collections. Feeds the Hoarder.', dLedger:'Sales from the chain history. Feeds Receipts.',
    updated:'Updated {t} ({a})', never:'Hasn’t delivered data yet.', ago:'{n} ago', min:'{n} min', hr:'{n} h', day:'{n} d',
    cPrices:'Sales read up to {d}.', cBuy:'{n} of {m} collections priced.', cCollections:'{n} properties still to read.', cLedger:'Sales read from {a} to {b}. Goes back to April 2025.',
    runNow:'Running now since {t}.', runLast:'Last run: {r}, {t}.', runNone:'No run information available.', success:'succeeded', failure:'failed', cancelled:'was cancelled',
    note:'Jobs run one after another every 12 hours. Delivered data appears here once it has been saved to the site.'
  },
  es:{
    title:'Backstage de Rockdrigo', subtitle:'Qué trabajos de datos están corriendo, cuándo corrió cada uno y cuánto llevan los largos.',
    jPrices:'Precios de ornamentos', jBuy:'Propiedades en venta', jCollections:'Colecciones del grupo', jLedger:'Libro de ventas',
    dPrices:'Ventas y listados de ornamentos. Alimenta a Cheapskate y al Optimizador.', dBuy:'Las propiedades más baratas en venta por colección. Alimenta la pestaña Comprar del Acaparador.',
    dCollections:'Propiedades y colecciones de cada jugador del grupo. Alimenta al Acaparador.', dLedger:'Ventas del historial de la cadena. Alimenta a Recibos.',
    updated:'Actualizado {t} ({a})', never:'Todavía no ha entregado datos.', ago:'hace {n}', min:'{n} min', hr:'{n} h', day:'{n} d',
    cPrices:'Ventas leídas hasta {d}.', cBuy:'{n} de {m} colecciones con precio.', cCollections:'Faltan {n} propiedades por leer.', cLedger:'Ventas leídas de {a} a {b}. Llega hasta abril de 2025.',
    runNow:'Corriendo desde {t}.', runLast:'Última corrida: {r}, {t}.', runNone:'No hay información de corridas.', success:'terminó bien', failure:'falló', cancelled:'se canceló',
    note:'Los trabajos corren uno tras otro cada 12 horas. Los datos entregados aparecen aquí cuando ya se guardaron en el sitio.'
  },
  en_cunk:{
    title:'Rockdrigo’s Backstage: A History of Machines Working', subtitle:'Somewhere, a computer is doing this for free. Here is how that is going.',
    never:'Nothing yet. The machine is thinking, or has been told not to.', note:'The jobs run in a queue, as civilised people do.'
  },
  es_cunk:{
    title:'Backstage de Rockdrigo: una historia de máquinas trabajando', subtitle:'En algún lugar, una computadora hace esto gratis. Así va.',
    never:'Nada todavía. La máquina está pensando, o le dijeron que no.', note:'Los trabajos hacen fila, como la gente civilizada.'
  }
});

const loc = () => Site.locale();
const fmt = x => new Date(x).toLocaleString(loc(), {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
function age(iso){
  const m = Math.max(0, (Date.now() - new Date(iso).getTime()) / 6e4);
  return {m, s: t('ago', {n: m < 90 ? t('min', {n: Math.round(m)}) : m < 2880 ? t('hr', {n: Math.round(m / 60)}) : t('day', {n: Math.round(m / 1440)})})};
}
const get = p => Upland.getJSON(`../data/${p}?t=${Date.now()}`).catch(() => null);
let D = null, RUN = null;

function job(name, desc, at, line, pct){
  const a = at ? age(at) : null;
  const cls = !a ? '' : a.m < 24 * 60 ? 'ok' : 'old';
  return `<section class="card job"><h2>${esc(name)}</h2><div class="small muted">${esc(desc)}</div>
    <div class="when"><span class="dot ${cls}"></span>${a ? esc(t('updated', {t: fmt(at), a: a.s})) : esc(t('never'))}</div>
    ${line ? `<div class="small">${esc(line)}</div>` : ''}
    ${pct != null ? `<div class="bar"><i style="width:${Math.max(1, Math.min(100, pct)).toFixed(0)}%"></i></div>` : ''}</section>`;
}
function render(){
  if(!D) return;
  const [pr, buy, col, led] = D;
  const day = x => new Date(x + 'Z').toLocaleDateString(loc(), {month:'short', day:'numeric', year:'numeric'});
  const total = 12100; // roughly the group's properties
  $('#jobs').innerHTML = [
    job(t('jPrices'), t('dPrices'), pr && pr.updatedAt, pr && pr.chainCursor ? t('cPrices', {d: fmt(pr.chainCursor + 'Z')}) : ''),
    job(t('jBuy'), t('dBuy'), buy && buy.updatedAt, buy ? t('cBuy', {n: buy.priced, m: buy.priceable}) : '', buy && buy.priceable ? buy.priced * 100 / buy.priceable : null),
    job(t('jCollections'), t('dCollections'), col && col.updatedAt, col ? t('cCollections', {n: Number(col.remaining).toLocaleString(loc())}) : '', col ? 100 - col.remaining * 100 / total : null),
    job(t('jLedger'), t('dLedger'), led && led.updatedAt, led ? t('cLedger', {a: day(led.from), b: day(led.to)}) : '')
  ].join('');
  $('#note').textContent = t('note');
  if(!RUN) $('#run').textContent = t('runNone');
  else if(RUN.status !== 'completed') $('#run').textContent = t('runNow', {t: fmt(RUN.run_started_at)});
  else $('#run').textContent = t('runLast', {r: t(RUN.conclusion === 'success' ? 'success' : RUN.conclusion === 'cancelled' ? 'cancelled' : 'failure'), t: fmt(RUN.updated_at)});
}
Site.mount({onChange: render});
Promise.all(['state.json', 'buy/state.json', 'collections/state.json', 'ledger/state.json'].map(get)).then(d => { D = d; render(); });
Upland.getJSON(`https://api.github.com/repos/${REPO}/actions/workflows/collect.yml/runs?per_page=1`).then(r => { RUN = (r.workflow_runs || [])[0] || null; render(); }).catch(() => {});
</script>
</body>
</html>
