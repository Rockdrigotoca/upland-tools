<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rockdrigo’s Sales</title>
<meta name="description" content="Everything Rockdrigo has sold on Upland: totals, trends, categories and items, from his own messages.">
<link rel="stylesheet" href="../shared/theme.css">
<style>
.filters{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .chips{margin:0}
.big{font-size:1.75rem}
.delta{font-size:.75rem;color:var(--muted);margin-top:2px}
.bars{width:100%;height:auto;display:block}
.bars rect.b{fill:var(--accent)}
.bars rect.b:hover{opacity:.75}
.bars text{fill:var(--muted);font-size:10px}
.bars line{stroke:var(--border)}
.share{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:70px}
.share i{display:block;height:100%;background:var(--accent)}
details.grp{margin-bottom:10px}
details.grp > summary{cursor:pointer;display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding:8px 2px;font-weight:700;list-style:none}
details.grp > summary::-webkit-details-marker{display:none}
details.grp > summary::before{content:"▸";margin-right:6px;color:var(--muted)}
details.grp[open] > summary::before{content:"▾"}
details.grp > summary .sub{font-weight:400;color:var(--muted);font-size:.8125rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.up{color:var(--ok)} .down{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <header id="site-header"></header>
  <div class="status" id="status"></div>
  <main id="app" class="hidden">
    <div class="filters">
      <div class="seg" id="period" role="group"></div>
      <div class="chips" id="groups"></div>
      <input type="search" id="q" class="grow" style="max-width:260px">
    </div>
    <div class="kpis" id="kpis"></div>
    <section class="card"><h2 id="hChart"></h2><svg id="chart" class="bars" role="img"></svg></section>
    <div class="cols" style="margin-top:16px">
      <section><h2 id="hGroups"></h2><div class="tablewrap" id="byGroup"></div></section>
      <section><h2 id="hGifts"></h2><p class="note" id="giftNote"></p><div class="tablewrap" id="gifts"></div></section>
    </div>
    <h2 id="hItems" style="margin-top:20px"></h2>
    <div id="items"></div>
    <h2 id="hRecent" style="margin-top:20px"></h2>
    <div class="tablewrap" id="recent"></div>
    <h2 id="hShops" style="margin-top:28px"></h2><p class="note" id="shopNote"></p>
    <div class="kpis" id="shopKpis"></div>
    <div class="cols">
      <section><h3 id="hVendors"></h3><div class="tablewrap" id="vendors"></div></section>
      <section><h3 id="hShopTab"></h3><div class="tablewrap" id="shops"></div></section>
    </div>
    <h3 id="hShopItems"></h3><div class="tablewrap" id="shopItems"></div>
    <h3 id="hShopRecent"></h3><div class="tablewrap" id="shopRecent"></div>
  </main>
  <footer id="site-footer"></footer>
</div>
<script src="../shared/site.js"></script>
<script src="../shared/sort.js"></script>
<script>
"use strict";
const {t, esc} = Site;
const $ = s => document.querySelector(s);

Site.register({
  en:{
    title:'Rockdrigo’s Sales', subtitle:'Everything sold, how much it made, and from what.',
    loading:'Counting the sales…', errLoad:'The sales data could not be loaded.',
    pYear:'This year', p1:'Last month', p2:'Last 2 months', p3:'Last 3 months', pAll:'All time',
    gAll:'Everything', gdeco:'Outdoor Decor', gorn:'Ornaments', gveh:'Vehicles / Go-karts', gseeds:'Seeds', gblk:'Block Explorers', gess:'Essentials', glegit:'Legits & Passes', guppie:'Uppies', gmemento:'Mementos', gother:'Other',
    search:'Find an item…', covers:'Messages from {a} to {b}; {n} sales in total. Data up to {u}.',
    kUpx:'UPX earned', kSales:'Paid sales (UPX and USD)', kAvg:'Average sale', kBest:'Biggest sale', kGifts:'Gifts (1 UPX)', kUsd:'Sold for USD',
    vsPrev:'{d} vs the previous period ({n} UPX)', same:'same as before', nothing:'Nothing in this period.',
    hChart:'UPX earned per {u}', unitDay:'day', unitWeek:'week', unitMonth:'month',
    hGroups:'By category', colGroup:'Category', colSold:'Sold', colUpx:'UPX', colShare:'Share', colGifts:'Gifts',
    hItems:'Item by item', colItem:'Item', colAvg:'Average', colMin:'Lowest', colMax:'Highest', colLast:'Last sold', colUsd:'USD sales',
    hGifts:'Sold for exactly 1 UPX', giftNote:'Counted as gifts: they are not in any total.', colCount:'Count',
    hShops:'Sold by other players in your shops', shopNote:'The sub-vendors’ own items, sold at their prices in your shops. They are not your sales, so they are in no total above. Follows the period, category and search filters.', colShop:'Shop', hVendors:'By sub-vendor', hShopTab:'By shop', hShopItems:'What sold', hShopRecent:'Latest sales in your shops', colVendor:'Sub-vendor', kShopSales:'Sales in your shops', kShopUpx:'UPX moved', kVendors:'Sub-vendors who sold', kShopBest:'Biggest sale', hRecent:'Latest sales', colWhen:'When', colPrice:'Price', items:'items', none:'none'
  },
  es:{
    title:'Las Ventas de Rockdrigo', subtitle:'Todo lo vendido, cuánto dejó y de qué.',
    loading:'Contando las ventas…', errLoad:'No se pudieron cargar los datos de ventas.',
    pYear:'Este año', p1:'Último mes', p2:'Últimos 2 meses', p3:'Últimos 3 meses', pAll:'Todo',
    gAll:'Todo', gdeco:'Decoración exterior', gorn:'Ornamentos', gveh:'Vehículos / Go-karts', gseeds:'Semillas', gblk:'Block Explorers', gess:'Esenciales', glegit:'Legits y Pases', guppie:'Uppies', gmemento:'Recuerdos', gother:'Otros',
    search:'Buscar un artículo…', covers:'Mensajes de {a} a {b}; {n} ventas en total. Datos hasta {u}.',
    kUpx:'UPX ganados', kSales:'Ventas pagadas (UPX y USD)', kAvg:'Venta promedio', kBest:'Mayor venta', kGifts:'Regalos (1 UPX)', kUsd:'Vendido en USD',
    vsPrev:'{d} frente al periodo anterior ({n} UPX)', same:'igual que antes', nothing:'Nada en este periodo.',
    hChart:'UPX ganados por {u}', unitDay:'día', unitWeek:'semana', unitMonth:'mes',
    hGroups:'Por categoría', colGroup:'Categoría', colSold:'Vendidos', colUpx:'UPX', colShare:'Parte', colGifts:'Regalos',
    hItems:'Artículo por artículo', colItem:'Artículo', colAvg:'Promedio', colMin:'Más bajo', colMax:'Más alto', colLast:'Última venta', colUsd:'Ventas en USD',
    hGifts:'Vendidos por exactamente 1 UPX', giftNote:'Se cuentan como regalos: no están en ningún total.', colCount:'Cantidad',
    hShops:'Vendido por otros jugadores en tus tiendas', shopNote:'Artículos de los sub-vendedores, vendidos a su precio en tus tiendas. No son ventas tuyas, así que no están en ningún total de arriba. Sigue los filtros de periodo, categoría y búsqueda.', colShop:'Tienda', hVendors:'Por sub-vendedor', hShopTab:'Por tienda', hShopItems:'Qué se vendió', hShopRecent:'Últimas ventas en tus tiendas', colVendor:'Sub-vendedor', kShopSales:'Ventas en tus tiendas', kShopUpx:'UPX movidos', kVendors:'Sub-vendedores con ventas', kShopBest:'Mayor venta', hRecent:'Últimas ventas', colWhen:'Cuándo', colPrice:'Precio', items:'artículos', none:'ninguno'
  },
  en_cunk:{
    title:'Rockdrigo’s Sales: A History of Letting Go', subtitle:'Every item that left, and what the world agreed to pay for its absence.',
    loading:'Reviewing the departures…', nothing:'Nothing. A quiet period. Possibly a nap.', hGifts:'Things given away for one UPX, which is generosity with paperwork',
    hRecent:'The most recent betrayals of inventory'
  },
  es_cunk:{
    title:'Las Ventas de Rockdrigo: una historia de soltar cosas', subtitle:'Cada artículo que se fue, y lo que el mundo aceptó pagar por su ausencia.',
    loading:'Revisando las despedidas…', nothing:'Nada. Un periodo tranquilo. Quizá una siesta.', hGifts:'Cosas regaladas por un UPX, que es generosidad con papeleo',
    hRecent:'Las traiciones más recientes al inventario'
  }
});

const GROUPS = ['deco', 'orn', 'veh', 'seeds', 'blk', 'ess', 'legit', 'uppie', 'memento', 'other'];
const groupOf = c => ({outdoordecor:'deco', structornmt:'orn', landvehicle:'veh', seeds:'seeds', blkexplorer:'blk', essential:'ess',
  lorelegit:'legit', racinglegits:'legit', sparkletwarz:'legit', mangueira:'legit', seasonpass:'legit', uppie:'uppie', memento:'memento'}[c] || 'other');
const DAY = 86400000;
let DATA = null, ROWS = [], SHOP = [];
let period = Site.store.get('rut:sales:period', 'year');
let group = Site.store.get('rut:sales:group', 'all');
let query = '';

const nf = (n, d = 0) => new Intl.NumberFormat(Site.locale(), {maximumFractionDigits: d, minimumFractionDigits: d}).format(n);
const fmtDate = d => new Date(d).toLocaleDateString(Site.locale(), {year:'numeric', month:'short', day:'numeric'});

function bounds(p, now){
  const end = now;
  let start;
  if(p === 'year') start = new Date(now.getFullYear(), 0, 1);
  else if(p === 'all') start = new Date(0);
  else { start = new Date(now); start.setMonth(start.getMonth() - Number(p.slice(1))); }
  return [start, end];
}
const inRange = (rows, a, b) => rows.filter(r => r.ts >= a && r.ts < b);
const isGift = r => r.cur === 'UPX' && r.amt === 1;
const sum = a => a.reduce((s, x) => s + x, 0);

function stats(rows){
  const paid = rows.filter(r => !isGift(r) && r.cur === 'UPX');
  const usd = rows.filter(r => r.cur === 'USD');
  const best = paid.reduce((m, r) => !m || r.amt > m.amt ? r : m, null);
  return {paid, usd, gifts: rows.filter(isGift), upx: sum(paid.map(r => r.amt)), best};
}

function render(){
  if(!DATA) return;
  $('#q').placeholder = t('search');
  $('#period').innerHTML = [['year','pYear'],['m1','p1'],['m2','p2'],['m3','p3'],['all','pAll']]
    .map(([k, l]) => `<button data-p="${k}" class="${period === k ? 'on' : ''}">${esc(t(l))}</button>`).join('');
  $('#groups').innerHTML = ['all', ...GROUPS].map(g =>
    `<button class="chip ${group === g ? 'on' : ''}" data-g="${g}">${esc(g === 'all' ? t('gAll') : t('g' + g))}</button>`).join('');

  const now = new Date(), [a, b] = bounds(period, now);
  const ql = query.trim().toLowerCase();
  const base = ROWS.filter(r => (group === 'all' || r.g === group) && (!ql || r.item.toLowerCase().includes(ql)));
  const cur = inRange(base, a.getTime(), b.getTime() + 1);
  const s = stats(cur);

  // KPIs, with a comparison against the period of the same length just before
  let prevTxt = '';
  if(period !== 'all'){
    const len = b - a, pa = new Date(a.getTime() - len);
    const ps = stats(inRange(base, pa.getTime(), a.getTime()));
    if(ps.upx > 0){
      const pct = (s.upx - ps.upx) / ps.upx * 100;
      const d = Math.round(pct) === 0 ? t('same') : (pct > 0 ? '▲ +' : '▼ ') + nf(pct, 0) + '%';
      prevTxt = `<div class="delta ${pct > 0 ? 'up' : pct < 0 ? 'down' : ''}">${esc(t('vsPrev', {d, n: nf(ps.upx)}))}</div>`;
    }
  }
  const kpi = (v, l, extra = '') => `<div class="kpi"><div class="v">${v}</div><div class="l">${esc(l)}</div>${extra}</div>`;
  $('#kpis').innerHTML =
    kpi(nf(s.upx) + ' UPX', t('kUpx'), prevTxt).replace('class="v"', 'class="v big"') +
    kpi(nf(s.paid.length + s.usd.length), t('kSales')) +
    kpi(s.paid.length ? nf(s.upx / s.paid.length) : '–', t('kAvg')) +
    kpi(s.best ? nf(s.best.amt) : '–', t('kBest'), s.best ? `<div class="delta">${esc(s.best.item)}</div>` : '') +
    kpi(nf(s.gifts.length), t('kGifts')) +
    (s.usd.length ? kpi(nf(s.usd.length) + ' · $' + nf(sum(s.usd.map(r => r.amt)), 2), t('kUsd')) : '');

  drawChart(s.paid, a, b);

  // By category (always shows all categories for the current period and search, so the filter chips are easy to compare)
  const inPeriod = inRange(ROWS.filter(r => !ql || r.item.toLowerCase().includes(ql)), a.getTime(), b.getTime() + 1);
  const tot = stats(inPeriod).upx || 1;
  $('#hGroups').textContent = t('hGroups');
  $('#byGroup').innerHTML = `<table><thead><tr><th>${esc(t('colGroup'))}</th><th class="num n">${esc(t('colSold'))}</th><th class="num n">${esc(t('colUpx'))}</th><th>${esc(t('colShare'))}</th><th class="num n">${esc(t('colUsd'))}</th><th class="num n">${esc(t('colGifts'))}</th></tr></thead><tbody>` +
    GROUPS.map(g => {
      const gs = stats(inPeriod.filter(r => r.g === g));
      if(!gs.paid.length && !gs.usd.length && !gs.gifts.length) return '';
      return `<tr><td>${esc(t('g' + g))}</td><td class="num n">${nf(gs.paid.length + gs.usd.length)}</td><td class="num n">${nf(gs.upx)}</td><td data-v="${gs.upx}"><div class="share" title="${nf(gs.upx / tot * 100, 0)}%"><i style="width:${gs.upx / tot * 100}%"></i></div><span class="small muted">${nf(gs.upx / tot * 100, 0)}%</span></td><td class="num n">${gs.usd.length ? '$' + nf(sum(gs.usd.map(r => r.amt)), 2) : ''}</td><td class="num n">${nf(gs.gifts.length)}</td></tr>`;
    }).join('') + '</tbody></table>';

  // Gifts
  const gc = new Map();
  s.gifts.forEach(r => { const k = r.g + '|' + r.item; gc.set(k, (gc.get(k) || 0) + 1); });
  $('#hGifts').textContent = t('hGifts'); $('#giftNote').textContent = t('giftNote');
  $('#gifts').innerHTML = gc.size ? `<table><thead><tr><th>${esc(t('colItem'))}</th><th>${esc(t('colGroup'))}</th><th class="num n">${esc(t('colCount'))}</th></tr></thead><tbody>` +
    [...gc].sort((x, y) => y[1] - x[1]).map(([k, n]) => { const [g, it] = k.split('|'); return `<tr><td>${esc(it)}</td><td>${esc(t('g' + g))}</td><td class="num n">${nf(n)}</td></tr>`; }).join('') + '</tbody></table>'
    : `<div class="empty">${esc(t('none'))}</div>`;

  // Item by item, one block per category
  $('#hItems').textContent = t('hItems');
  const open = new Set([...document.querySelectorAll('#items details[open]')].map(d => d.dataset.g));
  const firstRender = !document.querySelector('#items details');
  $('#items').innerHTML = GROUPS.filter(g => group === 'all' || group === g).map(g => {
    const rows = s.paid.filter(r => r.g === g), usdRows = s.usd.filter(r => r.g === g);
    const by = new Map();
    [...rows, ...usdRows].forEach(r => { if(!by.has(r.item)) by.set(r.item, {upx: [], usd: [], last: 0, cat: r.cat}); const e = by.get(r.item); (r.cur === 'USD' ? e.usd : e.upx).push(r.amt); e.last = Math.max(e.last, r.ts); });
    if(!by.size) return '';
    const total = sum(rows.map(r => r.amt));
    const body = [...by].sort((x, y) => sum(y[1].upx) - sum(x[1].upx)).map(([it, e]) => {
      const u = e.upx;
      return `<tr><td>${esc(it)}${g === 'other' || g === 'legit' ? ` <span class="muted small">(${esc(e.cat)})</span>` : ''}</td><td class="num n">${nf(u.length + e.usd.length)}</td><td class="num n">${nf(sum(u))}</td><td class="num n">${u.length ? nf(sum(u) / u.length) : '–'}</td><td class="num n">${u.length ? nf(Math.min(...u)) : '–'}</td><td class="num n">${u.length ? nf(Math.max(...u)) : '–'}</td><td class="num n" data-v="${e.last}">${esc(fmtDate(e.last))}</td><td class="num n">${e.usd.length ? nf(e.usd.length) + ' · $' + nf(sum(e.usd), 2) : ''}</td></tr>`;
    }).join('');
    const isOpen = firstRender ? true : open.has(g);
    return `<details class="grp" data-g="${g}" ${isOpen ? 'open' : ''}><summary><span>${esc(t('g' + g))}</span><span class="sub">${nf(by.size)} ${esc(t('items'))} · ${nf(rows.length + usdRows.length)} · ${nf(total)} UPX</span></summary>
      <div class="tablewrap"><table><thead><tr><th>${esc(t('colItem'))}</th><th class="num n">${esc(t('colSold'))}</th><th class="num n">${esc(t('colUpx'))}</th><th class="num n">${esc(t('colAvg'))}</th><th class="num n">${esc(t('colMin'))}</th><th class="num n">${esc(t('colMax'))}</th><th class="num n">${esc(t('colLast'))}</th><th class="num n">${esc(t('colUsd'))}</th></tr></thead><tbody>${body}</tbody></table></div></details>`;
  }).join('') || `<div class="empty">${esc(t('nothing'))}</div>`;

  // Other players' sales in my shops (sub-vendors), kept apart from my own
  $('#hShops').textContent = t('hShops'); $('#shopNote').textContent = t('shopNote');
  ['hVendors', 'hShopTab', 'hShopItems', 'hShopRecent'].forEach(id => $('#' + id).textContent = t(id));
  const hs = inRange(SHOP.filter(r => (group === 'all' || r.g === group) && (!ql || r.item.toLowerCase().includes(ql))), a.getTime(), b.getTime() + 1);
  const hUpx = hs.filter(r => r.cur === 'UPX'), hUsd = hs.filter(r => r.cur === 'USD');
  const hBest = hUpx.reduce((m, r) => !m || r.amt > m.amt ? r : m, null);
  $('#shopKpis').innerHTML = kpi(nf(hs.length), t('kShopSales')) +
    kpi(nf(sum(hUpx.map(r => r.amt))) + ' UPX', t('kShopUpx'), hUsd.length ? `<div class="delta">+ $${nf(sum(hUsd.map(r => r.amt)), 2)}</div>` : '') +
    kpi(nf(new Set(hs.map(r => r.vendor)).size), t('kVendors')) +
    kpi(hBest ? nf(hBest.amt) : '–', t('kShopBest'), hBest ? `<div class="delta">${esc(hBest.item)}</div>` : '');
  const grp = key => { const m = new Map(); hs.forEach(r => { const k = key(r); if(!m.has(k)) m.set(k, {n: 0, upx: 0, usd: 0, last: 0}); const e = m.get(k); e.n++; if(r.cur === 'USD') e.usd += r.amt; else e.upx += r.amt; e.last = Math.max(e.last, r.ts); }); return [...m].sort((x, y) => y[1].upx - x[1].upx || y[1].n - x[1].n); };
  const money = e => nf(e.upx) + (e.usd ? ' + $' + nf(e.usd, 2) : '');
  const tbl = (head, rows) => rows.length ? `<table><thead><tr>${head}</tr></thead><tbody>${rows.join('')}</tbody></table>` : `<div class="empty">${esc(t('nothing'))}</div>`;
  const th = (k, num) => `<th${num ? ' class="num n"' : ''}>${esc(t(k))}</th>`;
  $('#vendors').innerHTML = tbl(th('colVendor') + th('colSold', 1) + th('colUpx', 1) + th('colLast', 1), grp(r => r.vendor || '?').map(([k, e]) => `<tr><td>${esc(k)}</td><td class="num n">${nf(e.n)}</td><td class="num n">${money(e)}</td><td class="num n" data-v="${e.last}">${esc(fmtDate(e.last))}</td></tr>`));
  $('#shops').innerHTML = tbl(th('colShop') + th('colSold', 1) + th('colUpx', 1), grp(r => r.shop || '?').map(([k, e]) => `<tr><td>${esc(k)}</td><td class="num n">${nf(e.n)}</td><td class="num n">${money(e)}</td></tr>`));
  $('#shopItems').innerHTML = tbl(th('colItem') + th('colGroup') + th('colSold', 1) + th('colUpx', 1), grp(r => r.g + '|' + r.item).map(([k, e]) => { const i = k.indexOf('|'); return `<tr><td>${esc(k.slice(i + 1))}</td><td>${esc(t('g' + k.slice(0, i)))}</td><td class="num n">${nf(e.n)}</td><td class="num n">${money(e)}</td></tr>`; }));
  $('#shopRecent').innerHTML = tbl(th('colWhen') + th('colItem') + th('colVendor') + th('colShop') + th('colPrice', 1), [...hs].sort((x, y) => y.ts - x.ts).slice(0, 30).map(r => `<tr><td data-v="${r.ts}">${esc(fmtDate(r.ts))}</td><td>${esc(r.item)}</td><td>${esc(r.vendor)}</td><td>${esc(r.shop)}</td><td class="num n">${r.cur === 'USD' ? '$' + nf(r.amt, 2) : nf(r.amt) + ' UPX'}</td></tr>`));

  // Latest sales
  $('#hRecent').textContent = t('hRecent');
  const recent = cur.filter(r => !isGift(r)).sort((x, y) => y.ts - x.ts).slice(0, 30);
  $('#recent').innerHTML = recent.length ? `<table><thead><tr><th>${esc(t('colWhen'))}</th><th>${esc(t('colItem'))}</th><th>${esc(t('colGroup'))}</th><th class="num n">${esc(t('colPrice'))}</th></tr></thead><tbody>` +
    recent.map(r => `<tr><td data-v="${r.ts}">${esc(fmtDate(r.ts))}</td><td>${esc(r.item)}</td><td>${esc(t('g' + r.g))}</td><td class="num n">${r.cur === 'USD' ? '$' + nf(r.amt, 2) : nf(r.amt) + ' UPX'}</td></tr>`).join('') + '</tbody></table>'
    : `<div class="empty">${esc(t('nothing'))}</div>`;
}

function drawChart(paid, a, b){
  const first = paid.length ? Math.min(...paid.map(r => r.ts)) : a.getTime();
  const from = new Date(Math.max(a.getTime(), period === 'all' ? first : a.getTime()));
  const unit = period === 'm1' ? 'day' : (period === 'm2' || period === 'm3') ? 'week' : 'month';
  const keyOf = d => {
    d = new Date(d);
    if(unit === 'day') return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    if(unit === 'week'){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x.getTime(); }
    return new Date(d.getFullYear(), d.getMonth(), 1).getTime();
  };
  const step = k => { const x = new Date(k); if(unit === 'day') x.setDate(x.getDate() + 1); else if(unit === 'week') x.setDate(x.getDate() + 7); else x.setMonth(x.getMonth() + 1); return x.getTime(); };
  const buckets = new Map();
  for(let k = keyOf(from); k <= b.getTime(); k = step(k)) buckets.set(k, 0);
  paid.forEach(r => { const k = keyOf(r.ts); if(buckets.has(k)) buckets.set(k, buckets.get(k) + r.amt); });
  const ent = [...buckets], max = Math.max(1, ...ent.map(e => e[1]));
  const W = 720, H = 220, L = 46, B = 24, T = 10, n = ent.length, bw = (W - L) / n;
  const label = k => unit === 'month' ? new Date(k).toLocaleDateString(Site.locale(), {month:'short', year:'2-digit'}) : new Date(k).toLocaleDateString(Site.locale(), {day:'numeric', month:'short'});
  const every = Math.ceil(n / 12);
  $('#hChart').textContent = t('hChart', {u: t(unit === 'day' ? 'unitDay' : unit === 'week' ? 'unitWeek' : 'unitMonth')});
  $('#chart').setAttribute('viewBox', `0 0 ${W} ${H}`);
  $('#chart').setAttribute('aria-label', t('hChart', {u: ''}));
  $('#chart').innerHTML =
    [0, .5, 1].map(f => `<line x1="${L}" x2="${W}" y1="${T + (H - B - T) * (1 - f)}" y2="${T + (H - B - T) * (1 - f)}"/><text x="${L - 4}" y="${T + (H - B - T) * (1 - f) + 3}" text-anchor="end">${nf(max * f)}</text>`).join('') +
    ent.map(([k, v], i) => {
      const h = (H - B - T) * v / max, x = L + i * bw;
      return `<rect class="b" x="${x + bw * .12}" y="${H - B - h}" width="${bw * .76}" height="${Math.max(h, v > 0 ? 1.5 : 0)}" rx="2"><title>${esc(label(k))}: ${nf(v)} UPX</title></rect>` +
        (i % every === 0 ? `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(label(k))}</text>` : '');
    }).join('');
}

document.addEventListener('click', e => {
  const p = e.target.closest('#period button'); if(p){ period = p.dataset.p; Site.store.set('rut:sales:period', period); render(); return; }
  const g = e.target.closest('#groups .chip'); if(g){ group = g.dataset.g; Site.store.set('rut:sales:group', group); render(); }
});
$('#q').addEventListener('input', e => { query = e.target.value; render(); });

async function load(){
  $('#status').textContent = t('loading');
  try{
    const r = await fetch('../data/mysales.json', {cache: 'no-cache'});
    if(!r.ok) throw new Error(r.status);
    DATA = await r.json();
  }catch(err){ $('#status').textContent = t('errLoad'); $('#status').classList.add('err'); return; }
  const all = DATA.rows.map(([d, cat, item, amt, cur, src, shop, vendor]) => ({ts: new Date(d).getTime(), g: groupOf(cat), cat, item, amt, cur, src, shop, vendor: vendor || ''}));
  ROWS = all.filter(r => r.src !== 'h');   // my own sales
  SHOP = all.filter(r => r.src === 'h');   // sub-vendors' items sold in my shops: not my income
  $('#app').classList.remove('hidden');
  render();
}
Site.mount({onChange: () => { if(DATA){ $('#status').textContent = t('covers', {a: fmtDate(DATA.from), b: fmtDate(DATA.to), n: nf(ROWS.length), u: fmtDate(DATA.updated)}); render(); } }});
load().then(() => { if(DATA) $('#status').textContent = t('covers', {a: fmtDate(DATA.from), b: fmtDate(DATA.to), n: nf(ROWS.length), u: fmtDate(DATA.updated)}); });
</script>
</body>
