<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rockdrigo’s Trove Helper</title>
<meta name="description" content="Tap a button, Upland opens on the right property, collect the troves you still need. Made for MsTullis, open to everyone.">
<link rel="stylesheet" href="../shared/theme.css">
<style>
.cityq{width:100%;font-size:1.25rem;padding:14px;border-radius:12px;font-weight:700}
.thumb{width:28px;height:28px;border-radius:6px;flex:none;object-fit:cover}
.thumb.ph{display:inline-block;background:var(--surface-2)}
.mini{display:flex;gap:8px;flex-wrap:wrap;font-size:.9rem}
.mini span{background:var(--surface-2);border-radius:999px;padding:4px 12px}
.prog{height:10px;border-radius:99px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#b87333,#9aa3ad,#d4a017)}
.step{display:flex;gap:10px;margin:8px 0;font-size:1rem}
.step i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);text-align:center;line-height:26px;font-style:normal;font-weight:700}
.opts{display:grid;gap:8px;margin:6px 0 4px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;border:2px solid var(--border);border-radius:16px;background:var(--surface);color:inherit;font:inherit;cursor:pointer}
.opt .ic{font-size:1.8rem;flex:none}
.opt b{display:block;font-size:1.1rem}
.opt small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.opt.on{border-color:var(--accent);background:var(--surface-2)}
.opt.on b::after{content:' ✓';color:var(--accent)}
.start{display:block;width:100%;text-align:center;padding:18px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1.25rem;border:0;cursor:pointer;margin:14px 0}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;color:inherit}
.sumrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.sumrow span{background:var(--surface-2);border-radius:12px;padding:8px 12px;font-size:.95rem}
.sumrow b{font-size:1.15rem}
.tabs2{display:flex;gap:6px;margin:6px 0 10px}
.tabs2 button{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 6px;font-size:.95rem;font-weight:600;cursor:pointer}
.tabs2 button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
h2.t{font-size:1.2rem;margin:20px 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 8px}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.tcard.hero{border:2px solid var(--accent);background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.thead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.thead h3{margin:0;font-size:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;flex-wrap:wrap;align-items:center;gap:5px;background:var(--surface-2);border-radius:12px;padding:5px 9px 5px 5px;font-size:.88rem}
.chip small{flex-basis:100%;color:var(--muted);font-size:.72rem;padding-left:33px;margin-top:-2px}
.chip.more{padding:8px 12px;color:var(--muted)}
.bd{font-style:normal;font-size:.72rem;font-weight:700;border-radius:99px;padding:1px 7px;background:var(--surface);color:var(--muted)}
.bd.new{background:var(--accent);color:var(--accent-ink)}
.bd.rare{background:#d4a017;color:#1d1c19}
.gos{display:flex;flex-wrap:wrap;gap:8px}
.go{flex:1 1 150px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:58px;padding:10px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;font-size:1.05rem}
.go small{display:block;font-weight:700;font-size:.9rem;opacity:1;margin-top:2px;color:inherit;padding:0}
.go b{font-size:1.1rem}
.rprog{height:6px;border-radius:99px;background:rgba(0,0,0,.28);margin-top:6px;overflow:hidden;min-width:120px}
.rprog i{display:block;height:100%;background:var(--accent-ink);opacity:.9}
.go.cool .rprog{background:var(--border)}
.go.cool .rprog i{background:var(--muted)}
.go.cool{background:var(--surface-2);color:var(--muted)}
.go .clock{font-variant-numeric:tabular-nums;font-size:1.05rem}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:.9rem}
.tile .thumb{width:40px;height:40px}
.tile > small{color:var(--muted);font-size:.76rem}
.tile .gos{align-self:stretch;margin-top:auto}
details.fold{margin:6px 0}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.2rem;padding:12px 0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:'▸';color:var(--accent);transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.more>summary{cursor:pointer;color:var(--muted);padding:8px 0;font-weight:600}
</style>
</head>

const norm = s => String(s).normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().replace(/ 1$/, '');
const UPLAND = id => 'https://play.upland.me/?prop_id=' + id;
const MINE_KEY = 'rut:helper:mine', COOL_KEY = 'rut:helper:cool';
const TOKEN = /eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{5,}|[Bb]earer\s+[A-Za-z0-9._~+\/=-]{20,}|"(?:access_?token|refresh_?token|id_?token|authorization|cookie|set-cookie|secret|password)"\s*:\s*"[^"]{12,}"/i;
const PEOPLE = [['mstullis', 't1'], ['talljames', 't2'], ['missmarlow', 't3']];
const n0 = x => Number(x).toLocaleString(Site.locale());

let RUN = new Map(), BEST = null, FEES = null;
// Optional link with Discord: the bot's "Open on the web" button opens this page with a private key after the #. The key is kept on this
// phone and removed from the address bar; with it the page shows the file she uploaded in Discord and shares the visit timers both ways.
const SYNC_KEY = 'rut:helper:sync';
let SYNC = store.get(SYNC_KEY, null), SYNCNAME = '';
(function takeKey(){
  const h = new URLSearchParams(location.hash.replace(/^#/, '')), k = h.get('key'), api = h.get('api');
  if(k && api && /^[a-f0-9]{20,}$/.test(k) && (/^https:\/\/[a-z0-9.-]+$/i.test(api) || (location.hostname === 'localhost' && /^http:\/\/localhost:\d+$/.test(api)))){ SYNC = {key:k, api, fresh:true}; store.set(SYNC_KEY, SYNC); }
  if(location.hash) history.replaceState(null, '', location.pathname + location.search);
})();
async function sync(manual){
  if(!SYNC) return;
  try{
    const r = await fetch(SYNC.api + '/hunt/me', {headers:{'x-key':SYNC.key}, cache:'no-store'});
    if(r.status === 401){ SYNC = null; store.set(SYNC_KEY, null); MSG = ''; draw(); return; }
    if(!r.ok) throw new Error('bad');
    const d = await r.json();
    SYNCNAME = d.name || '';
    let changed = !!manual || !!SYNC.fresh;
    if(d.file && d.file.items && d.file.items.length){ if(!MINE || MINE.items.length !== d.file.items.length || (MINE.troves && MINE.troves.found) !== (d.file.troves && d.file.troves.found)) changed = true; MINE = d.file; store.set(MINE_KEY, MINE); }
    (d.visits || []).forEach(([pid, at]) => { const ms = Date.parse(at); if(ms && (!COOL[pid] || COOL[pid] < ms)){ COOL[pid] = ms; changed = true; } });
    store.set(COOL_KEY, COOL);
    if(SYNC.fresh){   // first connection: take her city and goal from Discord, once
      const goal = {all:'gold', rec:'rec', rare:'rare'}[d.goal];
      if(goal){ MODE = goal; store.set('rut:helper:mode', MODE); }
      if(d.city){ CITY = String(d.city); store.set('rut:helper:city', CITY); }
      SYNC.fresh = false; store.set(SYNC_KEY, SYNC);
    }
    if(manual) MSG = t('syncDone');
    if(changed) draw();
  }catch(e){ if(manual){ MSG = t('syncFail'); draw(); } }
}
// Her cleaned file (never the HAR: only troves and recipes) goes to the bot over HTTPS, where it is scrambled before it is stored.
async function pushFile(d){
  if(!SYNC) return;
  try{
    const r = await fetch(SYNC.api + '/hunt/file', {method:'POST', headers:{'x-key':SYNC.key}, body:JSON.stringify({format:'upland-troves-v1', date:new Date().toISOString().slice(0, 10), troves:d.troves, items:d.items, recipes:d.recipes})});
    MSG = r.ok ? t('sentFile') : t('sentFail');
  }catch(e){ MSG = t('sentFail'); }
  draw();
}
function pushVisits(pids, at){
  if(!SYNC || !pids.length) return;
  fetch(SYNC.api + '/hunt/visit', {method:'POST', headers:{'x-key':SYNC.key, 'content-type':'application/json'}, body:JSON.stringify({pids, at:new Date(at).toISOString(), city:Number(CITY)}), keepalive:true}).catch(() => {});
}
// a costly property often has a cheaper one within 80 m: stand there instead
const hopOf = pid => { const b = BEST && BEST.best80 ? BEST.best80[pid] : null; return b ? {pid:b[0], fee:b[1], lat:b[3], lng:b[4]} : null; };
// what she pays to stand for this stop: the cheaper neighbour when there is one
const standFee = pid => { const h = hopOf(pid); return h ? h.fee : FEES && FEES.fees[pid] != null ? FEES.fees[pid] : null; };
let WIB = null, PL = null, WORLD = null, CD = {}, OWNERS = {}, ROCK = null, HUNTS = null, IMG = null, MINE = store.get(MINE_KEY, null), COOL = store.get(COOL_KEY, {});
let CITY = store.get('rut:helper:city', '32'), MODE = store.get('rut:helper:mode', 'gold'), SCOPE = 'city', VIEW = store.get('rut:helper:view', 'overview'), MSG = '';

async function j(u){ try{ const r = await fetch(u, {cache:'no-cache'}); return r.ok ? await r.json() : null; }catch{ return null; } }
async function city(id){ if(!(id in CD)) CD[id] = await j('../data/troves/places/' + id + '.json') || false; return CD[id]; }

// ---------- who needs what ----------
function balance(){
  // her own file only: nobody else's numbers are shown to her; without it every trove counts as still needed
  if(!MINE) return {items:new Map(), mine:false, found:0, max:null, recipes:[]};
  const src = MINE;
  const items = new Map(src.items.map(i => [i[0], {q:i[2], lvl:Math.min(i[3], 3), th:i[4].slice(0, 3)}]));   // gold is the manual goal
  return {items, mine:!!MINE, found:src.troves ? src.troves.found : items.size, max:src.troves ? src.troves.max : null, recipes:src.recipes || []};
}
function neededSet(){
  const b = balance(), need = new Set(); if(!b || !PL) return need;

  b.recipes.forEach(([n, ing]) => ing.forEach(([g, req]) => { const it = b.items.get(g); if(!it || it.q < req) rec.set(g, true); }));
  PL.forEach((p, name) => {

    else if(MODE === 'gold'){ if(!it || (it.th.length ? it.lvl < it.th.length : false)) need.add(name); }

// structure type -> the troves it gives that are still needed

function plan(cd){

  const worth = k => { const e = by.get(k); return e ? e.all.size / (total.get(k) || 1) * Math.log2(1 + e.all.size) : 0; };

    const stops = [];
    rows.forEach(r => { r[6].forEach(b => { const k = norm(b); if(by.has(k)) stops.push({pid:r[0], label:b, w:worth(k), lat:r[4], lng:r[5], who:u}); }); owned.add(String(r[0])); });
    stops.sort((a, b) => b.w - a.w);

  cd.props.forEach(pr => { if(owned.has(String(pr[0]))) return; const ks = pr[5].map(i => sn[i]).filter(k => by.has(k)); if(ks.length) cand.push({pid:pr[0], lat:pr[2], lng:pr[3], ks, w:Math.max(...ks.map(worth))}); });

  cand.forEach(c => { const k = cell(c); (grid.get(k) || grid.set(k, []).get(k)).push(c); });

    for(let a = -1; a <= 1; a++) for(let b = -1; b <= 1; b++) (grid.get((cy + a) + ',' + (cx + b)) || []).forEach(o => { if(o !== c && Math.hypot((o.lat - c.lat) * 111320, (o.lng - c.lng) * 111320 * Math.cos(c.lat * Math.PI / 180)) <= 80) n++; });

// One visit gives one find per structure within reach (about 80 m), each picked at random from that structure's list. A place is worth the share of

function bestPlaces(cd, P, k = 6){
  const lists = new Map();
  PL.forEach((p, n) => p.structures.forEach(x => { const q = norm(x); (lists.get(q) || lists.set(q, []).get(q)).push(n); }));
  const share = cd.structs.map(x => { const l = lists.get(norm(x)); return l ? l.filter(n => P.need.has(n)).length / l.length : 0; });
  const rows = cd.props.filter(pr => pr[5].length).map(pr => ({pr, own:pr[5].reduce((a, i) => a + share[i], 0), cnt:pr[5].length}));
  const R = 80 / 111320, cell = r => [Math.floor(r.pr[2] / R), Math.floor(r.pr[3] / (R / Math.max(Math.cos(r.pr[2] * Math.PI / 180), .2)))], grid = new Map();

}

  const citySel = `<select id="cityq" class="cityq" aria-label="${esc(t('city'))}">${cs.map(c => `<option value="${c.id}"${String(c.id) === String(CITY) ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`;
  if(VIEW === 'overview'){
    const cool = Object.values(COOL).filter(a => a + 36e5 > Date.now()).length;
    const sum = PLAN ? `<div class="card" style="margin-bottom:0"><b>${esc(t('ovSum', {city:CNAME}))}</b><div class="sumrow"><span>${esc(t('sumKinds'))}: <b>${n0(PLAN.groups.length)}</b></span><span>${esc(t('sumSpecial'))}: <b>${n0(SPECN)}</b></span>${ELN ? `<span>${esc(t('sumElse'))}: <b>${n0(ELN)}</b></span>` : ''}</div>${cool ? `<p class="small muted" style="margin:8px 0 0">${esc(t('ovWait', {n:cool}))}</p>` : ''}</div>` : '';
    app.innerHTML = `<div class="card" style="margin-bottom:12px"><h2 style="margin:0 0 4px">${esc(t('hi'))} ${esc(t('ovH'))}</h2><p class="hint" style="margin:0 0 8px">${esc(t('ovN'))}</p><p class="small" style="margin:0">${esc(t('ovStarter'))}</p><p class="small" style="margin:6px 0 0">${esc(t('ovGrown'))} <a href="../troves/"><b>${esc(t('ovGrownGo'))} →</b></a></p></div>
      <h2 class="t" style="margin-top:4px">${esc(t('ovCity'))}</h2>${citySel}
      <h2 class="t">${esc(t('ovGoal'))}</h2><div class="opts">${opt('mode', 'gold', MODE, '🧺', 'gAll', 'gAllN')}${opt('mode', 'rec', MODE, '📖', 'gRec', 'gRecN')}${opt('mode', 'rare', MODE, '⭐', 'gRare', 'gRareN')}</div>
      <div style="margin-top:14px">${sum}</div>
      <button type="button" class="start" data-view="go">▶ ${esc(t('ovStart'))}</button>
      ${SYNC ? `<div class="card" style="margin-top:12px"><p class="small" style="margin:0 0 8px">🔗 ${esc(t('syncOn', {name:SYNCNAME || '…'}))}</p><button type="button" class="btn small" id="syncNow">${esc(t('syncNow'))}</button> <button type="button" class="btn small" id="syncOff">${esc(t('syncOff'))}</button>${MSG ? `<p class="small muted" style="margin:8px 0 0">${esc(MSG)}</p>` : ''}</div>` : ''}
      <h2 class="t">${esc(t('ovFile'))}</h2><p class="sub">${esc(t('ovFileN'))}</p>${dash()}
      <div class="card" style="margin-bottom:12px"><details><summary><b>${esc(t('stepsH'))}</b></summary>${steps}</details></div>`;
  } else {
    app.innerHTML = `<div class="card" style="margin-bottom:12px"><div class="row" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button type="button" class="back" data-view="overview">← ${esc(t('ovBack'))}</button><span class="chips" style="margin:0">${[['gold', 'gAll'], ['rec', 'gRec'], ['rare', 'gRare']].map(([m, k]) => `<button type="button" class="btn small${MODE === m ? ' primary' : ''}" data-mode="${m}" aria-pressed="${MODE === m}">${esc(t(k))}</button>`).join('')}</span></div><div style="margin-top:10px">${citySel}</div></div>
      <div id="next" class="small muted" style="margin:0 0 4px"></div>
      ${body}
      <p class="small" style="margin:18px 0 0"><button type="button" class="btn small" id="resetCool">${esc(t('reset'))}</button></p>`;
  }
  if(VIEW !== 'overview') foldify();
  refreshRuns(); tick();
}
// Each section (a heading and what follows it) folds; open or closed is remembered, and the first two start open.
let FOLD = store.get('rut:helper:fold', {});
function foldify(){
  const app = document.getElementById('app'); let g = null, n = 0;
  [...app.children].forEach(el => {
    if(el.matches('h2.t')){
      const d = document.createElement('details'), key = el.textContent.trim().replace(/\s+/g, ' ').slice(0, 40);
      d.className = 'fold'; d.dataset.fold = key; d.open = key in FOLD ? !!FOLD[key] : n < 2; n++;
      const sm = document.createElement('summary'); sm.innerHTML = el.innerHTML; d.appendChild(sm);
      el.replaceWith(d); g = d;
    } else if(g && !el.querySelector('#resetCool')) g.appendChild(el);
    else g = null;
  });
}
document.addEventListener('click', e => { const sm = e.target.closest('details.fold > summary'); if(!sm) return; const d = sm.parentNode; setTimeout(() => { FOLD[d.dataset.fold] = d.open; store.set('rut:helper:fold', FOLD); }, 0); });
function tick(){
  const now = Date.now(); let soon = Infinity;
  document.querySelectorAll('.clock').forEach(c => { const left = Number(c.dataset.until) - now; if(left <= 0){ const a = c.closest('a.go'); if(a && a.classList.contains('run')) refreshRuns(); else if(a){ a.classList.remove('cool'); a.querySelector('span').firstChild.textContent = '▶ ' + t('go'); c.remove(); } } else { c.textContent = clock(left); soon = Math.min(soon, left); } });
  const el = document.getElementById('next'); if(el) el.textContent = soon < Infinity ? t('ready') + ' ' + clock(soon) : Object.keys(COOL).length ? t('allReady') : '';
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if(!document.hidden){ sync(); refreshRuns(); tick(); } });
setInterval(() => { if(!document.hidden) sync(); }, 90000);
window.addEventListener('pageshow', e => { if(e.persisted){ refreshRuns(); tick(); } });

// ---------- events ----------
document.addEventListener('click', e => {
  const a = e.target.closest('a.go[data-pid]');
  if(a){
    const pid = a.dataset.pid, at = Date.now();
    if(!pid){ e.preventDefault(); return; }
    COOL[pid] = at; store.set(COOL_KEY, COOL);
    const touched = [pid];
    if(a.classList.contains('run')){
      // the properties within 80 m of where she stands are covered by this visit too, so they count as done
      let me = null; (RUN.get(a.dataset.run) || []).forEach(c => { if(String(c.pid) === pid) me = c; });
      const hp = hopOf(pid), lat = hp && hp.lat != null ? hp.lat : me && me.lat, lng = hp && hp.lng != null ? hp.lng : me && me.lng;
      if(lat != null){ const cs = Math.cos(lat * Math.PI / 180); RUN.forEach(l => l.forEach(c => { if(c.lat != null && !cooling(c.pid) && Math.hypot((c.lat - lat) * 111320, (c.lng - lng) * 111320 * cs) <= 80) { COOL[c.pid] = at; touched.push(c.pid); } })); store.set(COOL_KEY, COOL); }
      pushVisits(touched, at); setTimeout(refreshRuns, 80); return;
    }
    document.querySelectorAll('a.go[data-pid="' + pid + '"]').forEach(x => { x.classList.add('cool'); const sp = x.querySelector('span'); sp.firstChild.textContent = '⏳ ' + t('cooling'); if(!x.querySelector('.clock')) x.insertAdjacentHTML('beforeend', `<span class="clock" data-until="${at + 36e5}">${clock(36e5)}</span>`); });
    pushVisits(touched, at); tick(); return;
  }
  const sc = e.target.closest('[data-scope]'); if(sc){ SCOPE = sc.dataset.scope; store.set('rut:helper:scope', SCOPE); if(!sc.dataset.view){ draw(); return; } }
  const m = e.target.closest('[data-mode]'); if(m){ MODE = m.dataset.mode; store.set('rut:helper:mode', MODE); draw(); return; }
  const vw = e.target.closest('[data-view]'); if(vw){ VIEW = vw.dataset.view; store.set('rut:helper:view', VIEW); draw().then(() => window.scrollTo({top:0})); return; }
  if(e.target.closest('#syncNow')){ sync(true); return; }
  if(e.target.closest('#syncOff')){ SYNC = null; store.set(SYNC_KEY, null); SYNCNAME = ''; MSG = ''; draw(); return; }
  if(e.target.closest('#resetCool')){ COOL = {}; store.set(COOL_KEY, COOL); draw(); return; }
  if(e.target.closest('#forget')){ MINE = null; store.set(MINE_KEY, null); MSG = ''; draw(); }
});
document.addEventListener('change', async e => {
  if(e.target.id === 'cityq'){ CITY = e.target.value; store.set('rut:helper:city', CITY); draw(); return; }
  if(e.target.id === 'file'){
    const f = e.target.files[0]; if(!f) return;
    const text = await f.text(); let d = null;
    const fromBal = x => ({items:x.categories.flatMap(c => c.items.map(i => [i.name, c.name, i.quantity, i.bankedLevel || 0, (i.bankingLevels || []).map(l => l.requiredTrovesCount)])), recipes:x.discoveredRecipes.map(r => [r.name, r.ingredients.filter(g => (g.assetType || 'trove') === 'trove').map(g => [g.name, g.required])]), troves:{found:x.totalCount, max:x.maxCount}});
    try{
      const har = /^\s*\{\s*"log"\s*:/.test(text.slice(0, 300));
      // a HAR holds her login: it is read here, only the troves are taken out, and the rest is dropped (never stored or sent anywhere)
      if(har){
        const x = JSON.parse(text);
        for(const en of ((x.log && x.log.entries) || [])){
          const c = en && en.response && en.response.content; if(!c || !c.text) continue;
          let body; try{ body = JSON.parse(c.encoding === 'base64' ? atob(c.text) : c.text); }catch{ continue; }
          if(body && body.discoveredRecipes && body.categories){ d = fromBal(body); break; }
        }
      } else if(text.length < 5e6 && !TOKEN.test(text)){
        const x = JSON.parse(text);
        if(x && x.format === 'upland-troves-v1' && Array.isArray(x.items) && Array.isArray(x.recipes)) d = {items:x.items.filter(i => Array.isArray(i) && typeof i[0] === 'string').map(i => [String(i[0]).slice(0, 80), String(i[1] || ''), Number(i[2]) || 0, Number(i[3]) || 0, (i[4] || []).map(Number)]), recipes:x.recipes.filter(r => Array.isArray(r)).map(r => [String(r[0]), (r[1] || []).map(g => [String(g[0]), Number(g[1]) || 0])]), troves:x.troves};
        else if(x && x.categories && x.discoveredRecipes) d = fromBal(x);
      }
    }catch{ d = null; }
    if(d && d.items.length){ d.items = d.items.slice(0, 1500); d.recipes = d.recipes.slice(0, 3000); MINE = d; store.set(MINE_KEY, MINE); MSG = t('loaded', {n:d.items.length}); pushFile(d); } else MSG = t('bad');
    draw();
  }
});

async function boot(){
  Site.mount({onChange:draw});
  draw();
  const [p, w, r, h, im, bst, fe, wib] = await Promise.all([j('../data/troves/places.json'), j('../data/troves/world.json'), j('../data/troves/rockdrigo/latest.json'), j('../data/troves/rockdrigo/hunts.json'), j('../data/troves/images.json'), j('../data/troves/reach-best.json'), j('../data/troves/fees.json'), j('../data/troves/wibenji.json')]);
  PL = p ? new Map(p.troves.map(([name, cat, structures, plants]) => [name, {cat, structures, plants}])) : null;
  WIB = wib; WORLD = w; ROCK = r; HUNTS = h; IMG = im; BEST = bst; FEES = fe;
  await Promise.all(PEOPLE.map(async ([u]) => { const o = await j('../data/structures/players/' + u + '.json'); OWNERS[u] = o ? o.rows : []; }));
  draw();
  sync();
}
boot();
</script>
