<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rockdrigo’s Trove Helper</title>
<meta name="description" content="Tap a button, Upland opens on the right property, collect the troves you still need. Made for MsTullis, open to everyone.">
<link rel="stylesheet" href="../shared/theme.css">
<style>
.cityq{width:100%;font-size:1.25rem;padding:14px;border-radius:12px;font-weight:700}
.thumb{width:28px;height:28px;border-radius:6px;flex:none;object-fit:cover}
.thumb.ph{display:inline-block;background:var(--surface-2)}
.mini{display:flex;gap:8px;flex-wrap:wrap;font-size:.9rem}
.mini span{background:var(--surface-2);border-radius:999px;padding:4px 12px}
.prog{height:10px;border-radius:99px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#b87333,#9aa3ad,#d4a017)}
.step{display:flex;gap:10px;margin:8px 0;font-size:1rem}
.step i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);text-align:center;line-height:26px;font-style:normal;font-weight:700}
.tabs2{display:flex;gap:6px;margin:6px 0 10px}
.tabs2 button{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 6px;font-size:.95rem;font-weight:600;cursor:pointer}
.tabs2 button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
h2.t{font-size:1.2rem;margin:20px 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 8px}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.tcard.hero{border:2px solid var(--accent);background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.thead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.thead h3{margin:0;font-size:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;flex-wrap:wrap;align-items:center;gap:5px;background:var(--surface-2);border-radius:12px;padding:5px 9px 5px 5px;font-size:.88rem}
.chip small{flex-basis:100%;color:var(--muted);font-size:.72rem;padding-left:33px;margin-top:-2px}
.chip.more{padding:8px 12px;color:var(--muted)}
.bd{font-style:normal;font-size:.72rem;font-weight:700;border-radius:99px;padding:1px 7px;background:var(--surface);color:var(--muted)}
.bd.new{background:var(--accent);color:var(--accent-ink)}
.bd.rare{background:#d4a017;color:#1d1c19}
.gos{display:flex;flex-wrap:wrap;gap:8px}
.go{flex:1 1 150px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:58px;padding:10px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;font-size:1.05rem}
.go small{display:block;font-weight:700;font-size:.9rem;opacity:1;margin-top:2px;color:inherit;padding:0}
.go b{font-size:1.1rem}
.rprog{height:6px;border-radius:99px;background:rgba(0,0,0,.28);margin-top:6px;overflow:hidden;min-width:120px}
.rprog i{display:block;height:100%;background:var(--accent-ink);opacity:.9}
.go.cool .rprog{background:var(--border)}
.go.cool .rprog i{background:var(--muted)}
.go.cool{background:var(--surface-2);color:var(--muted)}
.go .clock{font-variant-numeric:tabular-nums;font-size:1.05rem}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:.9rem}
.tile .thumb{width:40px;height:40px}
.tile > small{color:var(--muted);font-size:.76rem}
.tile .gos{align-self:stretch;margin-top:auto}
details.more>summary{cursor:pointer;color:var(--muted);padding:8px 0;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header id="site-header"></header>
  <div id="app"></div>
  <footer id="site-footer"></footer>
</div>
<script src="../shared/site.js"></script>
<script>
"use strict";
const {t, esc, store} = Site;
Site.register({
  en:{
    title:'Rockdrigo’s Trove Helper', subtitle:'Tap, collect, repeat. For MsTullis.',
    hi:'Hello MsTullis!', hiN:'Pick a city, then tap the buttons from the top down. Each one opens Upland on a property where you can collect something you still need.',
    stepsH:'How it works',
    s1:'Open the Upland app first and stay logged in.', s2:'Check the city below (it starts on Los Angeles).', s3:'Tap a button. Upland opens on that property. Collect the troves there.', s4:'The button shows a clock for one hour. Come back to it after that, or go to the next one.', s5:'Start from the top: your own properties first, then James’s, then Marlow’s, then the rest.',
    city:'City', mode:'What are you collecting for?', mGold:'Gold on every trove', mRec:'Recipes and collections',
    mGoldN:'Every trove up to gold level. Rockdrigo’s rule: every visit gives one trove at random, so the more structures you visit, the faster you get there.',
    mRecN:'Only the troves you do not have yet, or that your recipes are missing.',
    dash:'How you are doing', dFound:'troves found', dGold:'at gold', dLeft:'to go', dLevels:'of the levels', dLoad:'Load my troves file', dLoadN:'Load your troves file to see how you are doing, which troves are new for you and which recipes you are close to.', dRock:'Showing Rockdrigo’s numbers until you load your file.',
    load:'Load my troves file', forget:'Forget my file', loaded:'Loaded your file ({n} troves).', bad:'That file could not be read. It must be the troves file from the script.',
    t1:'Your own properties', t1N:'Structures you own here that give what you need.', t2:'James’s properties', t3:'Marlow’s properties', t4:'Other places', t4N:'Structures anywhere in the city. The first ones also have more of what you need nearby.',
    none:'Nothing here for this city yet.', runOf:'{d} of {n} visited', runAll:'All visited',  seen:'Rockdrigo found it at: {x}', legend:'The medal on each trove is the level you are collecting for. NEW means you have never found it. ★ means few places give it.', go:'Go collect', cooling:'Back in', newT:'NEW', helps:'helps craft {x}', mine:'Your own properties', mineN:'Structures that are yours (or James’s and Marlow’s) in this city. No walking needed.', noOwn:'None of your own, James’s or Marlow’s properties in {city} has a structure that gives what you need.', next:'Your next stop', special:'Special finds', specialN:'Only a few kinds of structure give these, or Rockdrigo has hardly ever found them. They are worth the trip.', onlyAt:'at: {x}', notHere:'not in this city', recH:'One find from a recipe', recN:'Find just this one trove and the recipe is ready.', missing:'missing {x}', moreTypes:'{n} more kinds of structure', open:'Open in Upland', gives:'{n} troves you need', more:'{n} more', near:'+{n} nearby', ready:'Next one ready in', allReady:'Everything is ready to collect.', tap:'tap to open',
    elseH:'Not in {city}', elseN:'You still need these, but no structure in {city} gives them. Rockdrigo found them here:', elseWhere:'found in {x}', elseList:'seen at {x}', elseNone:'not seen yet',
    wait:'Loading…', fail:'Could not load the data.', reset:'Clear all clocks',
    alt:'The other option', altN:'Switch the list above to “Recipes and collections” if you only want to fill recipes and collections.',
  },
  es:{
    title:'El Ayudante de Troves de Rockdrigo', subtitle:'Toca, recolecta, repite. Para MsTullis.',
    hi:'¡Hola MsTullis!', hiN:'Elige una ciudad y toca los botones de arriba hacia abajo. Cada uno abre Upland en una propiedad donde puedes recolectar algo que aún necesitas.',
    stepsH:'Cómo funciona',
    s1:'Abre primero la app de Upland y no cierres sesión.', s2:'Revisa la ciudad de abajo (empieza en Los Ángeles).', s3:'Toca un botón. Upland abre esa propiedad. Recolecta los troves de ahí.', s4:'El botón muestra un reloj de una hora. Vuelve a él después, o pasa al siguiente.', s5:'Empieza por arriba: primero tus propiedades, luego las de James, luego las de Marlow y luego el resto.',
    city:'Ciudad', mode:'¿Para qué estás recolectando?', mGold:'Oro en cada trove', mRec:'Recetas y colecciones',
    mGoldN:'Todos los troves hasta el nivel oro. La regla de Rockdrigo: cada visita da un trove al azar, así que mientras más estructuras visites, más rápido llegas.',
    mRecN:'Solo los troves que aún no tienes o que les faltan a tus recetas.',
    dash:'Cómo vas', dFound:'troves hallados', dGold:'en oro', dLeft:'por hacer', dLevels:'de los niveles', dLoad:'Cargar mi archivo de troves', dLoadN:'Carga tu archivo de troves para ver cómo vas, qué troves son nuevos para ti y qué recetas tienes cerca.', dRock:'Se muestran los números de Rockdrigo hasta que cargues tu archivo.',
    load:'Cargar mi archivo de troves', forget:'Olvidar mi archivo', loaded:'Cargué tu archivo ({n} troves).', bad:'No pude leer ese archivo. Debe ser el archivo de troves del script.',
    t1:'Tus propiedades', t1N:'Estructuras tuyas aquí que dan lo que necesitas.', t2:'Propiedades de James', t3:'Propiedades de Marlow', t4:'Otros lugares', t4N:'Estructuras en toda la ciudad. Las primeras también tienen más de lo que necesitas cerca.',
    none:'Aquí no hay nada para esta ciudad todavía.', runOf:'{d} de {n} visitados', runAll:'Todos visitados',  seen:'Rockdrigo lo halló en: {x}', legend:'La medalla de cada trove es el nivel que estás buscando. NUEVO es que nunca lo has hallado. ★ es que pocos lugares lo dan.', go:'Ir a recolectar', cooling:'Vuelve en', newT:'NUEVO', helps:'sirve para {x}', mine:'Tus propiedades', mineN:'Estructuras tuyas (o de James y Marlow) en esta ciudad. Sin caminar.', noOwn:'Ninguna propiedad tuya, de James o de Marlow en {city} tiene una estructura que dé lo que necesitas.', next:'Tu siguiente parada', special:'Hallazgos especiales', specialN:'Solo unas pocas estructuras los dan. Vale la pena el viaje.', onlyAt:'en: {x}', notHere:'no está en esta ciudad', recH:'Un hallazgo para una receta', recN:'Encuentra solo este trove y la receta queda lista.', missing:'falta {x}', moreTypes:'{n} tipos de estructura más', open:'Abrir en Upland', gives:'{n} troves que necesitas', more:'{n} más', near:'+{n} cerca', ready:'El siguiente estará listo en', allReady:'Todo está listo para recolectar.', tap:'toca para abrir',
    elseH:'Fuera de {city}', elseN:'Aún los necesitas, pero ninguna estructura de {city} los da. Rockdrigo los encontró aquí:', elseWhere:'hallado en {x}', elseList:'visto en {x}', elseNone:'aún no se ha visto',
    wait:'Cargando…', fail:'No pude cargar los datos.', reset:'Borrar todos los relojes',
    alt:'La otra opción', altN:'Cambia la lista de arriba a “Recetas y colecciones” si solo quieres completar recetas y colecciones.',
  },
});
const norm = s => String(s).normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().replace(/ 1$/, '');
const UPLAND = id => 'https://play.upland.me/?prop_id=' + id;
const MINE_KEY = 'rut:helper:mine', COOL_KEY = 'rut:helper:cool';
const TOKEN = /eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{5,}|[Bb]earer\s+[A-Za-z0-9._~+\/=-]{20,}|"(?:access_?token|refresh_?token|id_?token|authorization|cookie|set-cookie|secret|password)"\s*:\s*"[^"]{12,}"/i;
const PEOPLE = [['mstullis', 't1'], ['talljames', 't2'], ['missmarlow', 't3']];
const n0 = x => Number(x).toLocaleString(Site.locale());

let RUN = new Map();
let PL = null, WORLD = null, CD = {}, OWNERS = {}, ROCK = null, HUNTS = null, IMG = null, MINE = store.get(MINE_KEY, null), COOL = store.get(COOL_KEY, {});
let CITY = store.get('rut:helper:city', '32'), MODE = store.get('rut:helper:mode', 'gold'), MSG = '';

async function j(u){ try{ const r = await fetch(u, {cache:'no-cache'}); return r.ok ? await r.json() : null; }catch{ return null; } }
async function city(id){ if(!(id in CD)) CD[id] = await j('../data/troves/places/' + id + '.json') || false; return CD[id]; }

// ---------- who needs what ----------
function balance(){
  // her own file only: nobody else's numbers are shown to her; without it every trove counts as still needed
  if(!MINE) return {items:new Map(), mine:false, found:0, max:null, recipes:[]};
  const src = MINE;
  const items = new Map(src.items.map(i => [i[0], {q:i[2], lvl:i[3], th:i[4]}]));
  return {items, mine:!!MINE, found:src.troves ? src.troves.found : items.size, max:src.troves ? src.troves.max : null, recipes:src.recipes || []};
}
function neededSet(){
  const b = balance(), need = new Set(); if(!b || !PL) return need;
  const rec = new Map();   // trove -> short for some recipe
  b.recipes.forEach(([n, ing]) => ing.forEach(([g, req]) => { const it = b.items.get(g); if(!it || it.q < req) rec.set(g, true); }));
  PL.forEach((p, name) => {
    const it = b.items.get(name);
    if(MODE === 'gold'){ if(!it || (it.th.length ? it.lvl < it.th.length : false)) need.add(name); }
    else if(!it || it.q === 0 || rec.has(name)) need.add(name);
  });
  return need;
}
// structure type -> the troves it gives that are still needed
function typeNeeds(need){
  const by = new Map();
  PL.forEach((p, name) => { if(!need.has(name)) return; p.structures.forEach(s => { const k = norm(s); const e = by.get(k) || {name:s, all:new Set()}; e.all.add(name); by.set(k, e); }); });
  return by;
}
function plan(cd){
  const need = neededSet(), by = typeNeeds(need), sn = cd.structs.map(norm);
  const total = new Map();   // how many troves each structure type gives in all
  PL.forEach(p => p.structures.forEach(s => { const k = norm(s); total.set(k, (total.get(k) || 0) + 1); }));
  const worth = k => { const e = by.get(k); return e ? e.all.size / (total.get(k) || 1) * Math.log2(1 + e.all.size) : 0; };
  const owned = new Set(), tiers = [];
  PEOPLE.forEach(([u, key]) => {
    const rows = (OWNERS[u] || []).filter(r => r[2] === cd.name);
    const stops = [];
    rows.forEach(r => { r[6].forEach(b => { const k = norm(b); if(by.has(k)) stops.push({pid:r[0], label:b, w:worth(k), lat:r[4], lng:r[5], who:u}); }); owned.add(String(r[0])); });
    stops.sort((a, b) => b.w - a.w);
    tiers.push({key, stops, who:u});
  });
  // everything else in the city, with how many useful structures sit within 80 m
  const cand = [];
  cd.props.forEach(pr => { if(owned.has(String(pr[0]))) return; const ks = pr[5].map(i => sn[i]).filter(k => by.has(k)); if(ks.length) cand.push({pid:pr[0], lat:pr[2], lng:pr[3], ks, w:Math.max(...ks.map(worth))}); });
  const R = 80 / 111320, grid = new Map(), cell = p => Math.floor(p.lat / R) + ',' + Math.floor(p.lng / (R / Math.max(Math.cos(p.lat * Math.PI / 180), .2)));
  cand.forEach(c => { const k = cell(c); (grid.get(k) || grid.set(k, []).get(k)).push(c); });
  cand.forEach(c => {
    const cy = Math.floor(c.lat / R), cx = Math.floor(c.lng / (R / Math.max(Math.cos(c.lat * Math.PI / 180), .2))); let n = 0;
    for(let a = -1; a <= 1; a++) for(let b = -1; b <= 1; b++) (grid.get((cy + a) + ',' + (cx + b)) || []).forEach(o => { if(o !== c && Math.hypot((o.lat - c.lat) * 111320, (o.lng - c.lng) * 111320 * Math.cos(c.lat * Math.PI / 180)) <= 80) n++; });
    c.near = n;
  });
  const types = new Map();
  cand.forEach(c => { const k = c.ks.sort((a, b) => worth(b) - worth(a))[0]; (types.get(k) || types.set(k, []).get(k)).push(c); });
  const share = k => by.get(k).all.size / (total.get(k) || 1);
  const groups = [...types.entries()].map(([k, list]) => ({k, name:by.get(k).name, w:worth(k), n:by.get(k).all.size, list:list.sort((a, b) => b.near - a.near || b.w - a.w)})).sort((a, b) => Math.round(share(b.k) * 10) - Math.round(share(a.k) * 10) || b.list.length - a.list.length);
  return {need, by, tiers, groups, sn, cand};
}
// troves still needed that nothing in this city gives
function elsewhere(cd, P){
  const here = new Set(P.sn);
  const rows = [];
  P.need.forEach(name => {
    const p = PL.get(name); if(!p) return;
    if(p.structures.some(s => here.has(norm(s)))) return;
    if(!p.structures.length && !p.plants.length) return;
    let found = [];
    if(HUNTS){
      const ti = HUNTS.troves.indexOf(name);
      if(ti >= 0){ const seen = new Map(); HUNTS.finds.forEach(f => { if(f[3] !== ti) return; const [src, kind] = HUNTS.src[f[2]]; if(kind === 'balloon') return; const c = HUNTS.cities[HUNTS.props[f[5]][2]]; const k = c + ' · ' + src; seen.set(k, (seen.get(k) || 0) + 1); }); found = [...seen.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]); }
    }
    rows.push({name, found, list:p.structures.slice(0, 4)});
  });
  return rows.sort((a, b) => (b.found.length > 0) - (a.found.length > 0) || a.name.localeCompare(b.name));
}

// ---------- drawing ----------
// the best properties in this city that give a trove: most useful neighbours first, ones not cooling first
function bestFor(P, trove, k = 1){
  const p = PL.get(trove); if(!p) return [];
  const keys = new Set(p.structures.map(norm)), now = Date.now();
  return P.cand.filter(c => c.ks.some(x => keys.has(x))).sort((a, b) => b.near - a.near).slice(0, k);
}
const tileGo = (P, trove) => { const l = bestFor(P, trove, 60); return l.length ? `<div class="gos" style="margin-top:6px;width:100%">${runBtn('v:' + trove, l)}</div>` : ''; };
const thumb = n => IMG && IMG.ids[n] ? `<img class="thumb" loading="lazy" alt="" src="${IMG.base}${IMG.ids[n]}.png" onerror="this.remove()">` : '<span class="thumb ph"></span>';
const clock = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const NAMES = {mstullis:'', talljames:'James', missmarlow:'Marlow'};
const LVN = ['', '🥉', '🥈', '🥇'];
// how many times Rockdrigo's hunting log has seen a trove, and the source it came from most often
let HC = null;
function huntCount(name){
  if(!HC && HUNTS){ HC = new Map(); const nm = HUNTS.troves; HUNTS.finds.forEach(f => HC.set(nm[f[3]], (HC.get(nm[f[3]]) || 0) + 1)); }
  return HC ? (HC.get(name) || 0) : 99;
}
function seenAt(name){
  if(!HUNTS) return '';
  const ti = HUNTS.troves.indexOf(name); if(ti < 0) return '';
  const m = new Map(); HUNTS.finds.forEach(f => { if(f[3] === ti && HUNTS.src[f[2]][1] !== 'balloon') m.set(HUNTS.src[f[2]][0], (m.get(HUNTS.src[f[2]][0]) || 0) + 1); });
  return [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, 2).map(x => x[0]).join(', ');
}
// what a trove means for her: level reached, whether it is new, which recipes it helps with
function info(name){
  const b = balance(), it = b && b.items.get(name), p = PL.get(name);
  const helps = [];
  if(b) b.recipes.forEach(([rn, ing]) => { const g = ing.find(x => x[0] === name); if(g && (!it || it.q < g[1]) && !helps.includes(rn)) helps.push(rn); });
  return {name, isNew:!it || it.q === 0 && !it.lvl, lvl:it ? it.lvl : 0, maxLvl:it ? it.th.length : 3, q:it ? it.q : 0, helps, rare:p ? (p.structures.length <= 4 || huntCount(name) <= 3) : false};
}
const chip = n => { const i = info(n); return `<span class="chip">${thumb(n)}<b>${esc(n)}</b>${!balance().mine ? '' : i.isNew ? `<em class="bd new">${esc(t('newT'))}</em>` : i.lvl < i.maxLvl ? `<em class="bd">${LVN[Math.min(i.lvl + 1, 3)]}</em>` : ''}${i.rare ? `<em class="bd rare">★</em>` : ''}${i.helps.length ? `<small>${esc(t('helps', {x:i.helps.slice(0, 2).join(', ')}))}</small>` : ''}</span>`; };
// one button for a whole list of places: it opens the next one she has not visited this hour, and counts how many are done
const cooling = pid => COOL[pid] && COOL[pid] + 36e5 > Date.now();
function runBtn(key, list){
  RUN.set(key, list);
  return `<a class="go run" data-run="${esc(key)}" data-pid="" target="_blank" rel="noopener" href="#"></a>`;
}
function refreshRuns(){
  document.querySelectorAll('a.go.run').forEach(el => {
    const list = RUN.get(el.dataset.run) || [], free = list.find(c => !cooling(c.pid)), done = list.filter(c => cooling(c.pid)).length, n = list.length;
    const prog = `<div class="rprog"><i style="width:${n ? Math.round(done / n * 100) : 0}%"></i></div>`;
    if(free){
      el.href = UPLAND(free.pid); el.dataset.pid = free.pid; el.classList.remove('cool');
      el.innerHTML = `<span><b>▶ ${esc(t('go'))}</b><small>${esc(t('runOf', {d:done, n}))}${free.near ? ' · ' + esc(t('near', {n:free.near})) : ''}</small>${prog}</span>`;
    } else {
      const soon = Math.min(...list.map(c => COOL[c.pid] + 36e5));
      el.href = '#'; el.dataset.pid = ''; el.classList.add('cool');
      el.innerHTML = `<span><b>⏳ ${esc(t('runAll'))}</b><small>${esc(t('runOf', {d:done, n}))}</small>${prog}</span><span class="clock" data-until="${soon}">${clock(soon - Date.now())}</span>`;
    }
  });
}
const goBtn = (pid, sub, label) => {
  const at = COOL[pid], left = at ? at + 36e5 - Date.now() : 0, cool = left > 0;
  return `<a class="go ${cool ? 'cool' : ''}" data-pid="${pid}" data-label="${esc(label || '')}" target="_blank" rel="noopener" href="${UPLAND(pid)}"><span>${cool ? '⏳' : '▶'} ${esc(t(cool ? 'cooling' : 'go'))}${sub ? `<small>${esc(sub)}</small>` : ''}</span>${cool ? `<span class="clock" data-until="${at + 36e5}">${clock(left)}</span>` : ''}</a>`;
};
// a card for one kind of structure: what it gives that she needs, and the buttons to get there
function typeCard(k, P, name, stops, opts = {}){
  const e = P.by.get(k), list = e ? [...e.all] : [];
  list.sort((a, b) => (info(b).rare - info(a).rare) || (info(b).isNew - info(a).isNew) || a.localeCompare(b));
  return `<div class="tcard ${opts.hero ? 'hero' : ''}"><div class="thead"><h3>${esc(name)}</h3><span class="muted small">${esc(t('gives', {n:list.length}))}</span></div>
    <div class="chips">${list.slice(0, opts.hero ? 12 : 8).map(chip).join('')}${list.length > (opts.hero ? 12 : 8) ? `<span class="chip more">${esc(t('more', {n:list.length - (opts.hero ? 12 : 8)}))}</span>` : ''}</div>
    <div class="gos">${opts.run ? runBtn('t:' + k, opts.run.slice(0, 120)) : stops.map(s => goBtn(s.pid, s.sub, name)).join('')}</div></div>`;
}
function dash(){
  const b = balance(); if(!b) return '';
  if(!b.mine) return `<div class="card" style="margin-bottom:12px"><p class="small" style="margin:0 0 8px">${esc(t('dLoadN'))}</p><label class="btn" style="display:inline-flex"><input type="file" id="file" accept=".json,application/json" hidden>${esc(t('load'))}</label>${MSG ? `<p class="small" style="margin:6px 0 0">${esc(MSG)}</p>` : ''}</div>`;
  let gold = 0, goal = 0, lv = 0, lvMax = 0;
  b.items.forEach(it => { if(it.th.length){ goal++; lv += Math.min(it.lvl, it.th.length); lvMax += it.th.length; if(it.lvl >= it.th.length) gold++; } });
  const pc = lvMax ? Math.round(lv / lvMax * 100) : 0;
  return `<div class="card" style="margin-bottom:12px"><div class="mini"><span><b>${n0(b.found)}${b.max ? ' / ' + n0(b.max) : ''}</b> ${esc(t('dFound'))}</span><span><b>${n0(gold)}</b> 🥇</span><span><b>${pc}%</b> ${esc(t('dLevels'))}</span></div>
    <div class="prog" title="${pc}%"><i style="width:${pc}%"></i></div>
    <p class="small muted" style="margin:8px 0 0"><label class="btn small" style="display:inline-flex;margin-top:4px"><input type="file" id="file" accept=".json,application/json" hidden>${esc(b.mine ? t('load') : t('dLoad'))}</label>${b.mine ? ` <button type="button" class="btn small" id="forget">${esc(t('forget'))}</button>` : ''}</p>${MSG ? `<p class="small" style="margin:6px 0 0">${esc(MSG)}</p>` : ''}</div>`;
}
async function draw(){
  const app = document.getElementById('app');
  if(!PL || !WORLD){ app.innerHTML = `<div class="card">${esc(t('wait'))}</div>`; return; }
  const cs = WORLD.cities.filter(c => c.kind === 'scan' && c.done).sort((a, b) => a.name.localeCompare(b.name));
  if(!cs.some(c => String(c.id) === String(CITY))) CITY = '32';
  const cd = await city(CITY);
  const steps = ['s1', 's2', 's3', 's4', 's5'].map((k, i) => `<div class="step"><i>${i + 1}</i><span>${esc(t(k))}</span></div>`).join('');
  let body = '';
  if(!cd) body = `<div class="card">${esc(t('fail'))}</div>`;
  else {
    const P = plan(cd), cname = cd.name, now = Date.now();
    // own, James's and Marlow's properties: one card per property, empty tiers are left out
    const own = []; P.tiers.forEach(tr => tr.stops.slice(0, 8).forEach(s => own.push({...s, whoName:NAMES[s.who], tier:tr.key})));
    const ownHtml = own.length ? `<h2 class="t">${esc(t('mine'))}</h2><p class="sub">${esc(t('mineN'))}</p>` + own.map(s => typeCard(norm(s.label), P, s.label + (s.whoName ? ' · ' + s.whoName : ''), [{pid:s.pid}])).join('')
      : `<p class="sub" style="margin:12px 0">${esc(t('noOwn', {city:cname}))}</p>`;
    // the next stop: an available own property first, else the best place in the city
    const free = pid => !(COOL[pid] && COOL[pid] + 36e5 > now);
    const pickOwn = own.find(s => free(s.pid));
    const g0 = P.groups.find(g => g.list.slice(0, 2).some(c => free(c.pid)));
    const hero = pickOwn ? typeCard(norm(pickOwn.label), P, pickOwn.label + (pickOwn.whoName ? ' · ' + pickOwn.whoName : ''), [{pid:pickOwn.pid}], {hero:true})
      : g0 ? typeCard(g0.k, P, g0.name, [], {hero:true, run:g0.list}) : '';
    // special finds: needed troves that only a few kinds of structure give
    const special = [...P.need].map(n => ({n, p:PL.get(n)})).filter(x => x.p && x.p.structures.length && info(x.n).rare).map(x => ({...x, inCity:x.p.structures.some(s => P.sn.includes(norm(s))), hc:huntCount(x.n)})).sort((a, b) => b.inCity - a.inCity || (b.hc > 0) - (a.hc > 0) || a.hc - b.hc || a.p.structures.length - b.p.structures.length).slice(0, 20);
    const specialHtml = special.length ? `<h2 class="t">⭐ ${esc(t('special'))}</h2><p class="sub">${esc(t('specialN'))}</p><div class="shelf">${special.map(x => { const i = info(x.n); return `<div class="tile">${thumb(x.n)}<b>${esc(x.n)}</b>${i.isNew ? `<em class="bd new">${esc(t('newT'))}</em>` : ''}<small>${x.inCity ? esc(t('onlyAt', {x:x.p.structures.filter(s => P.sn.includes(norm(s))).join(', ')})) : esc(t('notHere'))}</small>${seenAt(x.n) ? `<small>${esc(t('seen', {x:seenAt(x.n)}))}</small>` : ''}${x.inCity ? tileGo(P, x.n) : ''}</div>`; }).join('')}</div>` : '';
    // recipes she is closest to
    const b = balance(), rec = [];
    if(b) b.recipes.forEach(([rn, ing]) => { const miss = ing.filter(([g, q]) => { const it = b.items.get(g); return !it || it.q < q; }); if(miss.length === 1 && P.need.has(miss[0][0])) rec.push({rn, g:miss[0][0], q:miss[0][1]}); });
    const seenR = new Set(), recHtml = rec.length ? `<h2 class="t">📖 ${esc(t('recH'))}</h2><p class="sub">${esc(t('recN'))}</p><div class="shelf">${rec.filter(r => !seenR.has(r.rn) && seenR.add(r.rn)).slice(0, 8).map(r => `<div class="tile">${thumb(r.rn)}<b>${esc(r.rn)}</b><small>${esc(t('missing', {x:r.g}))}</small>${tileGo(P, r.g)}</div>`).join('')}</div>` : '';
    // the rest of the city, best kinds of structure first; only the first few are open
    const shown = P.groups.slice(0, 6), rest = P.groups.slice(6);
    const gcard = g => typeCard(g.k, P, g.name, [], {run:g.list});
    const groupHtml = `<h2 class="t">${esc(t('t4'))}</h2><p class="sub">${esc(t('t4N'))}</p>${shown.map(gcard).join('')}${rest.length ? `<details class="more"><summary>${esc(t('moreTypes', {n:rest.length}))}</summary>${rest.map(gcard).join('')}</details>` : ''}`;
    const el = elsewhere(cd, P);
    const elHtml = el.length ? `<h2 class="t">${esc(t('elseH', {city:cname}))}</h2><p class="sub">${esc(t('elseN', {city:cname}))}</p><div class="card" style="padding:10px 14px">${el.slice(0, 40).map(r => `<div class="small" style="padding:6px 0;border-bottom:1px solid var(--border)">${thumb(r.name)}<b>${esc(r.name)}</b> <span class="muted">${r.found.length ? esc(t('elseWhere', {x:r.found.join('; ')})) : r.list.length ? esc(t('elseList', {x:r.list.join(', ')})) : esc(t('elseNone'))}</span></div>`).join('')}</div>` : '';
    body = `${hero ? `<h2 class="t" style="margin-top:4px">${esc(t('next'))}</h2><p class="sub">${esc(t('legend'))}</p>${hero}` : ''}${specialHtml}${recHtml}${ownHtml}${groupHtml}${elHtml}`;
  }
  const waits = Object.values(COOL).filter(a => a + 36e5 > Date.now());
  app.innerHTML = `<div class="card" style="margin-bottom:12px"><h2 style="margin:0 0 4px">${esc(t('hi'))}</h2><p class="hint" style="margin:0 0 8px">${esc(t('hiN'))}</p>
    <label class="small muted" for="cityq">${esc(t('city'))}</label><select id="cityq" class="cityq">${cs.map(c => `<option value="${c.id}"${String(c.id) === String(CITY) ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
    <div class="small muted" style="margin:10px 0 4px">${esc(t('mode'))}</div><div class="tabs2"><button type="button" data-mode="gold" class="${MODE === 'gold' ? 'on' : ''}">🥇 ${esc(t('mGold'))}</button><button type="button" data-mode="rec" class="${MODE === 'rec' ? 'on' : ''}">📖 ${esc(t('mRec'))}</button></div>
    <p class="small muted" style="margin:0">${esc(t(MODE === 'gold' ? 'mGoldN' : 'mRecN'))}</p></div>
    ${dash()}
    <div class="card" style="margin-bottom:12px"><details><summary><b>${esc(t('stepsH'))}</b></summary>${steps}</details></div>
    <div id="next" class="small muted" style="margin:0 0 4px"></div>
    ${body}
    <p class="small" style="margin:18px 0 0"><button type="button" class="btn small" id="resetCool">${esc(t('reset'))}</button></p>`;
  refreshRuns(); tick();
}
function tick(){
  const now = Date.now(); let soon = Infinity;
  document.querySelectorAll('.clock').forEach(c => { const left = Number(c.dataset.until) - now; if(left <= 0){ const a = c.closest('a.go'); if(a && a.classList.contains('run')) refreshRuns(); else if(a){ a.classList.remove('cool'); a.querySelector('span').firstChild.textContent = '▶ ' + t('go'); c.remove(); } } else { c.textContent = clock(left); soon = Math.min(soon, left); } });
  const el = document.getElementById('next'); if(el) el.textContent = soon < Infinity ? t('ready') + ' ' + clock(soon) : Object.keys(COOL).length ? t('allReady') : '';
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if(!document.hidden){ refreshRuns(); tick(); } });
window.addEventListener('pageshow', e => { if(e.persisted){ refreshRuns(); tick(); } });

// ---------- events ----------
document.addEventListener('click', e => {
  const a = e.target.closest('a.go[data-pid]');
  if(a){
    const pid = a.dataset.pid, at = Date.now();
    if(!pid){ e.preventDefault(); return; }
    COOL[pid] = at; store.set(COOL_KEY, COOL);
    if(a.classList.contains('run')){ setTimeout(refreshRuns, 80); return; }
    document.querySelectorAll('a.go[data-pid="' + pid + '"]').forEach(x => { x.classList.add('cool'); const sp = x.querySelector('span'); sp.firstChild.textContent = '⏳ ' + t('cooling'); if(!x.querySelector('.clock')) x.insertAdjacentHTML('beforeend', `<span class="clock" data-until="${at + 36e5}">${clock(36e5)}</span>`); });
    tick(); return;
  }
  const m = e.target.closest('[data-mode]'); if(m){ MODE = m.dataset.mode; store.set('rut:helper:mode', MODE); draw(); return; }
  if(e.target.closest('#resetCool')){ COOL = {}; store.set(COOL_KEY, COOL); draw(); return; }
  if(e.target.closest('#forget')){ MINE = null; store.set(MINE_KEY, null); MSG = ''; draw(); }
});
document.addEventListener('change', async e => {
  if(e.target.id === 'cityq'){ CITY = e.target.value; store.set('rut:helper:city', CITY); draw(); return; }
  if(e.target.id === 'file'){
    const f = e.target.files[0]; if(!f) return;
    const text = await f.text(); let d = null;
    try{
      if(text.length < 5e6 && !TOKEN.test(text)){
        const x = JSON.parse(text);
        if(x && x.format === 'upland-troves-v1' && Array.isArray(x.items) && Array.isArray(x.recipes)) d = {items:x.items.filter(i => Array.isArray(i) && typeof i[0] === 'string').map(i => [String(i[0]).slice(0, 80), String(i[1] || ''), Number(i[2]) || 0, Number(i[3]) || 0, (i[4] || []).map(Number)]), recipes:x.recipes.filter(r => Array.isArray(r)).map(r => [String(r[0]), (r[1] || []).map(g => [String(g[0]), Number(g[1]) || 0])]), troves:x.troves};
        else if(x && x.categories && x.discoveredRecipes) d = {items:x.categories.flatMap(c => c.items.map(i => [i.name, c.name, i.quantity, i.bankedLevel || 0, (i.bankingLevels || []).map(l => l.requiredTrovesCount)])), recipes:x.discoveredRecipes.map(r => [r.name, r.ingredients.filter(g => (g.assetType || 'trove') === 'trove').map(g => [g.name, g.required])]), troves:{found:x.totalCount, max:x.maxCount}};
      }
    }catch{ d = null; }
    if(d && d.items.length){ MINE = d; store.set(MINE_KEY, MINE); MSG = t('loaded', {n:d.items.length}); } else MSG = t('bad');
    draw();
  }
});

async function boot(){
  Site.mount({onChange:draw});
  draw();
  const [p, w, r, h, im] = await Promise.all([j('../data/troves/places.json'), j('../data/troves/world.json'), j('../data/troves/rockdrigo/latest.json'), j('../data/troves/rockdrigo/hunts.json'), j('../data/troves/images.json')]);
  PL = p ? new Map(p.troves.map(([name, cat, structures, plants]) => [name, {cat, structures, plants}])) : null;
  WORLD = w; ROCK = r; HUNTS = h; IMG = im;
  await Promise.all(PEOPLE.map(async ([u]) => { const o = await j('../data/structures/players/' + u + '.json'); OWNERS[u] = o ? o.rows : []; }));
  draw();
}
boot();
</script>
