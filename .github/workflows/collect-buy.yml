name: Collect properties for sale

on:
  schedule:
    - cron: '32 6,18 * * *'   # every 12 hours, offset from the other collectors
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Time budget (minutes)'
        default: '90'

permissions:
  contents: write
  actions: write   # lets the keep-alive step re-enable this schedule

concurrency:
  group: collect-buy
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Gentle: one request every 2 seconds, oldest collections first, 90 minutes per run.
      # The first pass over ~620 collections takes a few runs; after that each run refreshes the oldest prices.
      - name: Price collections
        run: python3 tools/collect_buy.py --minutes "${{ github.event.inputs.minutes || '90' }}" --pause 2.0

      - name: Commit new data
        run: |
          git config user.name "buy-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/buy
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh properties for sale"
            git pull --rebase --autostash
            git push
          fi

      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect-buy.yml/enable"
