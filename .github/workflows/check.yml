name: Check pages
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Duplicate functions and text keys, script parses
        run: python3 tools/check_pages.py
