name: Collect collections

on:
  schedule:
    - cron: '47 9,21 * * *'   # every 12 hours, offset from the price job
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Time budget for property lookups (minutes)'
        default: '90'

permissions:
  contents: write
  actions: write   # lets the keep-alive step re-enable this schedule

concurrency:
  group: collect-collections
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No rush: one request every 2 seconds for up to 90 minutes per run. The first catch-up of
      # the group (~12,100 properties) takes about a week; after that runs only read new or month-old properties.
      - name: Collect collections
        run: python3 tools/collect_collections.py --minutes "${{ github.event.inputs.minutes || '90' }}" --pause 2.0

      - name: Commit new data
        run: |
          git config user.name "collections-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collections
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh collections"
            git pull --rebase --autostash
            git push
          fi

      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect-collections.yml/enable"
