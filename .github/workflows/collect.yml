name: Collectors

# One queue for everything that talks to Upland. The collectors run one after another, never together
# (this workflow can only run once at a time), and only the ones switched on. Inside a job a few requests run at once
# (measured on 29 Oct 2026: four at a time, about 9 a second, no errors), kept to about 4 to 5 a second in all,
# with a longer wait whenever Upland pushes back.
#
# Switch jobs on or off with a repo variable, no code change needed:
#   gh variable set COLLECTORS --body "prices,buy,collections"   # which jobs run (no spaces)
#   gh variable set COLLECTORS --body ""                          # pause everything
# Run something once right now, whatever the variable says:
#   gh workflow run Collectors -f only=buy

on:
  schedule:
    - cron: '17 3,15 * * *'   # every 12 hours
  workflow_dispatch:
    inputs:
      only:
        description: 'Jobs to run now, comma separated: prices, buy, collections, ledger, pulse, structures, fees, reach. Empty = the COLLECTORS variable.'
        default: ''

permissions:
  contents: write
  actions: write   # lets the keep-alive step re-enable this schedule

concurrency:
  group: upland-collectors
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      JOBS: ${{ github.event.inputs.only || vars.COLLECTORS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Jobs switched on
        run: |
          echo "Jobs switched on: '${JOBS}'"

      # 1. Ornament sales and listings: the most time-sensitive, so first.
      - name: Ornament prices
        if: contains(format(',{0},', env.JOBS), ',prices,')
        continue-on-error: true
        timeout-minutes: 60
        run: python3 tools/collect_prices.py --backfill-days 4

      - name: Save ornament prices
        if: contains(format(',{0},', env.JOBS), ',prices,')
        run: |
          bash tools/commit_data.sh "data: refresh ornament prices" ':(glob)data/*.json' data/sales data/history

      - name: Breather
        run: sleep 30

      # 2. Cheapest properties for sale per collection.
      - name: Properties for sale
        if: contains(format(',{0},', env.JOBS), ',buy,')
        continue-on-error: true
        timeout-minutes: 110
        run: python3 tools/collect_buy.py --minutes 90 --pause 0.5

      - name: Save properties for sale
        if: contains(format(',{0},', env.JOBS), ',buy,')
        run: |
          bash tools/commit_data.sh "data: refresh properties for sale" data/buy

      - name: Breather
        run: sleep 30

      # 3. The group's properties and collections: slow and not urgent, so last.
      - name: Group collections
        if: contains(format(',{0},', env.JOBS), ',collections,')
        continue-on-error: true
        timeout-minutes: 110
        run: python3 tools/collect_collections.py --minutes 90 --pause 0.25 --workers 4

      - name: Save group collections
        if: contains(format(',{0},', env.JOBS), ',collections,')
        run: |
          bash tools/commit_data.sh "data: refresh collections" data/collections

      - name: Breather
        run: sleep 30

      # 4. Everyone's sales from the chain history (Rockdrigo's Receipts): reads the chain, barely touches Upland.
      - name: Sales ledger
        if: contains(format(',{0},', env.JOBS), ',ledger,')
        continue-on-error: true
        timeout-minutes: 110
        run: python3 tools/collect_ledger.py --days 10 --minutes 90

      - name: Save sales ledger
        if: contains(format(',{0},', env.JOBS), ',ledger,')
        run: |
          bash tools/commit_data.sh "data: refresh sales ledger" data/ledger

      # 5. Neighbourhood numbers for the Quailbert pulse (Quailwood and Nomentano): two small requests to Uplytics.
      - name: Neighbourhood pulse
        if: contains(format(',{0},', env.JOBS), ',pulse,')
        continue-on-error: true
        timeout-minutes: 10
        run: python3 tools/collect_pulse.py

      - name: Save neighbourhood pulse
        if: contains(format(',{0},', env.JOBS), ',pulse,')
        run: |
          bash tools/commit_data.sh "data: refresh neighbourhood pulse" data/pulse

      # 6. Which structures each neighbourhood has and which are missing (for the spark trains): about 2,300 property reads.
      - name: Structures
        if: contains(format(',{0},', env.JOBS), ',structures,')
        continue-on-error: true
        timeout-minutes: 70
        run: python3 tools/collect_structures.py --minutes 55 --workers 4 --rate 5

      - name: Save structures
        if: contains(format(',{0},', env.JOBS), ',structures,')
        run: |
          bash tools/commit_data.sh "data: refresh structures" data/structures

      # 7. Teleport price (the visitor fee) of every property with a service structure, to find a closer or cheaper one to visit:
      # about 33,000 reads the first time, then only the ones not read yet.
      - name: Teleport prices
        if: contains(format(',{0},', env.JOBS), ',fees,')
        continue-on-error: true
        timeout-minutes: 100
        run: python3 tools/collect_fees.py --cities all --all --max-minutes 85

      - name: Save teleport prices
        if: contains(format(',{0},', env.JOBS), ',fees,')
        run: |
          bash tools/commit_data.sh "data: refresh teleport prices" data/troves/fees.json data/troves/fees-state.json

      # 8. Teleport price of every property within reach of a costly structure property, to find a cheaper place to stand while
      # trove-hunting. About 4,600 small map requests, then one read per neighbour (see tools/collect_reach.py). Resumable, and it
      # starts the next run by itself when it stops with work left, so it keeps going until everything is read.
      - name: Cheaper places to stand
        if: contains(format(',{0},', env.JOBS), ',reach,')
        continue-on-error: true
        timeout-minutes: 270
        run: python3 tools/collect_reach.py --max-minutes 250

      - name: Save cheaper places to stand
        id: savereach
        if: contains(format(',{0},', env.JOBS), ',reach,')
        run: |
          python3 tools/build_reach.py
          out=$(bash tools/commit_data.sh "data: refresh cheaper places to stand" data/troves/reach data/troves/reach-state.json data/troves/reach-best.json)
          echo "$out"
          case "$out" in *Pushed*) echo "pushed=yes" >> "$GITHUB_OUTPUT";; *) echo "pushed=no" >> "$GITHUB_OUTPUT";; esac

      - name: Carry on with the rest
        if: steps.savereach.outputs.pushed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(python3 -c "import json;s=json.load(open('data/troves/reach-state.json'));print(s['readsLeft']+s['listRequests'])")
          echo "Work left: $left"
          if [ "$left" -gt 0 ]; then gh workflow run collect.yml -f only=reach; fi

      # GitHub turns off schedules in public repos after 60 days without activity; this keeps it on.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
